  async function dataUrlOf(url) {
    if (url.startsWith("data:")) return url;
    const blob = await fetch(url).then((r) => r.blob());
    try {
      return await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = () => rej(new Error("read failed"));
        fr.readAsDataURL(blob);
      });
    } catch (e) {
      const buf = new Uint8Array(await blob.arrayBuffer());
      let bin = "";
      for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      return `data:${blob.type || "application/octet-stream"};base64,${btoa(bin)}`;
    }
  }

  async function buildExport(id, mode) {
    const s = Store.screen(id);
    const cfgOut = deep(s.live || s.draft);
    Toast.show(t("building"));
    try {
      const media = [];
      for (const rec of usedMedia(cfgOut)) {
        const out = deep(rec);
        const src = await Net.mediaUrl(rec);
        if (!src) continue;
        out.url = mode === "embed" ? await dataUrlOf(src) : new URL(src, location.href).href;
        if (mode === "live" && (rec.url || "").startsWith("/")) out.url = location.origin + rec.url;
        media.push(out);
      }
      const screenOut = Object.assign(deep(s), { draft: cfgOut, live: cfgOut });

      // brand assets are heavy; ship only what this file actually needs
      const settingsOut = deep(Store.state.settings);
      if (mode === "live") {
        settingsOut.brand = { logo: {}, fonts: [] };   // the desk supplies them
      } else {
        const used = new Set((cfgOut.widgets || []).filter((w) => w.props && w.props.brandLogo).map((w) => w.props.brandLogo));
        const logo = {};
        for (const k of used) if (settingsOut.brand.logo[k]) logo[k] = settingsOut.brand.logo[k];
        settingsOut.brand.logo = logo;
      }
      const payload = {
        screenId: id,
        live: mode === "live" ? { base: location.origin } : null,
        state: {
          v: 2, rev: 0, lang: Store.state.lang || "en",
          settings: settingsOut,
          media, screens: [screenOut]
        }
      };
      const inject = "<script>window.__SIGNAGE_EMBED__=" +
        JSON.stringify(payload).replace(/</g, "\\u003c") + ";<\/script>";
      // split literals so this source never contains the tags it looks for,
      // and splice rather than replace so payload text is taken verbatim
      const closing = "</bo" + "dy>";
      const at = APP_SOURCE.lastIndexOf(closing);
      const html = at < 0
        ? APP_SOURCE + inject
        : APP_SOURCE.slice(0, at) + inject + APP_SOURCE.slice(at);
      const file = id + "-display.html";
      const a = h("a", { href: URL.createObjectURL(new Blob([html], { type: "text/html" })), download: file });
      a.click();
      closeModal();
      showEmbedCode(s, file);
      Toast.show(t("exported"));
    } catch (e) {
      Toast.show(String(e.message || e), true);
    }
  }

  function importBackup() {

        const j = JSON.parse(await f.text());
        if (!j.screens) throw new Error("bad file");
        confirmDialog(t("importBackup"), t("restoreWarn"), () => {
          Store.set(j);
          Store.update(() => {});
          setLang(j.lang || "en");
          screenId = j.screens[0].id;
          render(); syncStage();
          Toast.show(t("restoreDone"));
        });
      } catch (e) { Toast.show(String(e.message || e), true); }
    };
    inp.click();
  }
  function resetAll() {
    confirmDialog(t("resetAll"), t("resetWarn"), async () => {
      await IDB.clear().catch(() => {});
      Store.set(defaultState());
      Store.update(() => {});
      screenId = Store.state.screens[0].id;
      render(); syncStage();
    });
  }

  /* ---------------- modal helpers ---------------- */
  let scrim = null;
  function openModal(node) {
    closeModal();
    scrim = h("div", { class: "scrim", onclick: (e) => { if (e.target === scrim) closeModal(); } }, node);
    document.body.append(scrim);
    const f = node.querySelector("input, button");
    if (f) f.focus();
  }
  function closeModal() { if (scrim) { scrim.remove(); scrim = null; } }
  function confirmDialog(title, text, onYes) {
    openModal(h("div", { class: "modal", style: { width: "420px" } },
      h("header", null, h("h2", null, title)),
      h("div", { class: "mbody" }, h("p", { class: "hint" }, text)),
      h("footer", null,
        h("button", { class: "btn ghost", onclick: closeModal }, t("cancel")),
        h("button", { class: "btn danger", onclick: () => { closeModal(); onYes(); } }, t("done")))));
  }

  function copy(text) {
    navigator.clipboard?.writeText(text).then(() => Toast.show(t("copied")),
      () => Toast.show(text, false));
  }

  /* ---------------- keyboard ---------------- */
  function bindKeys() {
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeModal(); return; }
      const tag = (e.target.tagName || "").toLowerCase();
      if (["input", "textarea", "select"].includes(tag)) return;
      if (page === "widgets" && sel.kind === "widget") {
        const step = e.shiftKey ? 2 : 0.5;
        const map = { ArrowLeft: ["x", -step], ArrowRight: ["x", step], ArrowUp: ["y", -step], ArrowDown: ["y", step] };
        if (map[e.key]) {
          e.preventDefault();
          const [k, d] = map[e.key];
          editWidget(sel.id, (w) => { w[k] = round(clamp(w[k] + d, -20, 120), 1); });
          renderInspector();
          return;
        }
        if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteWidget(sel.id); return; }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "d") { e.preventDefault(); duplicateWidget(sel.id); return; }
        if (e.key === "]" || e.key === "[") {
          e.preventDefault();
          const fwd = e.key === "]";
          if (e.shiftKey) layerTo(sel.id, fwd ? "front" : "back");
          else reorderWidget(sel.id, fwd ? 1 : -1);
          return;
        }
      }
      if (e.code === "Space" && STAGE_PAGES.includes(page)) { e.preventDefault(); cmd("toggle"); }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); return; }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveDraft(); }
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); publish(screenId); }
    });
  }

  return { start };
})();


/* ============================================================
   Display runtime — what runs on the player attached to the wall.
   No chrome, no cursor, keeps the last good frame if the link drops.
   ============================================================ */
const Display = (() => {
  let screenId = null;
  let stage = null;
  let lastSig = null;
  let lastPlaylistId = null;

  async function start(id, embedded = false) {
    screenId = id;
    document.body.classList.add("display-mode");
    const root = h("div", { id: "display-root" });
    const flag = h("div", { id: "conn-flag" });
    clear(document.body).append(root, flag);

    if (!embedded) {
      const saved = await Net.loadState().catch(() => null);
      if (saved) Store.set(saved);
    }
    setLang(Store.state.lang || "en");
    applyBrandFonts(Store.state);

    stage = new Stage(root, { interactive: false, chrome: false });

    apply(true);

    // an exported page carries its own content: no server, no storage, no heartbeat
    if (embedded) {
      // inside someone else's page it is a panel, not a kiosk — leave the cursor alone
      if (window.self !== window.top) document.body.classList.add("in-frame");
      setInterval(() => apply(false), 10000);
      keepAwake();
      return;
    }

    Net.on("state", async () => {
      try { await Store.reload(); applyBrandFonts(Store.state); apply(false); }
      catch (e) { /* keep showing the last content */ }
    });
    Net.on("cmd", (m) => {
      if (!m || (m.screenId && m.screenId !== screenId)) return;
      if (m.cmd === "play") stage.play();
      else if (m.cmd === "pause") stage.pause();
      else if (m.cmd === "next") stage.next();
      else if (m.cmd === "prev") stage.prev();
      else if (m.cmd === "reload") {
        // refresh the content first, so the screen recovers even where a
        // kiosk browser refuses a real page reload
        lastSig = null;
        apply(true);
        stage.restart();
        try { location.reload(); } catch (e) { /* the soft reload above already ran */ }
      }
    });
    Net.on("link", (up) => flag.classList.toggle("show", !up));

    // heartbeat so the desk can show On air / Not connected
    const beat = () => Net.beat({ screenId, at: Date.now(), ua: navigator.userAgent.slice(0, 60) });
    beat();
    setInterval(beat, 3000);

    // re-check the schedule every 10s; switching playlists is seamless
    setInterval(() => apply(false), 10000);

    // in browser-local mode there is no push channel from another profile,
    // so poll storage as a safety net
    if (Net.mode === "local") setInterval(async () => {
      try { await Store.reload(); applyBrandFonts(Store.state); apply(false); } catch (e) { /* ignore */ }
    }, 4000);

    keepAwake();
    window.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
    document.addEventListener("dblclick", () => document.documentElement.requestFullscreen?.());
  }

  function apply(first) {
    const s = Store.screen(screenId);
    if (!s) { showMissing(); return; }
    clearMissing();
    const cfg = s.live;
    stage.setScreen(s);
    stage.setRotation(s.rotate || 0);
    if (!cfg) { return; }
    const res = resolvePlaylist(cfg, Store.state.settings.tz || "Asia/Riyadh");
    const pl = res ? res.playlist : null;
    const sig = JSON.stringify([s.liveRev, cfg.blackout, pl && pl.id, pl && pl.items, cfg.widgets, cfg.transition, cfg.transitionMs, cfg.loop, cfg.shuffle]);
    if (sig === lastSig && !first) return;
    lastSig = sig;
    const switched = pl && pl.id !== lastPlaylistId;
    lastPlaylistId = pl ? pl.id : null;
    void switched;
    stage.apply(cfg, pl);
  }

  /* A player pointed at a link that no longer exists would otherwise sit on
     black with nothing to go on. */
  function showMissing() {
    if (document.getElementById("no-screen")) return;
    const box = h("div", {
      id: "no-screen",
      style: {
        position: "fixed", inset: "0", display: "grid", placeContent: "center",
        justifyItems: "center", gap: "10px", color: "#8188a6",
        font: "16px/1.5 system-ui, sans-serif", textAlign: "center", padding: "6vw"
      }
    },
      h("div", { style: { color: "#e8eaf6", fontSize: "20px" } }, t("screenNotFound")),
      h("div", { style: { direction: "ltr" } }, "/display/" + screenId),
      h("div", null, t("checkLink")));
    document.body.append(box);
  }
  function clearMissing() {
    const box = document.getElementById("no-screen");
    if (box) box.remove();
  }

  async function keepAwake() {
    try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); }
    catch (e) { /* not critical */ }
  }

  return { start };
})();

/* ------------------------------------------------------------
   Routing: /display/<id> when a sync server is serving the app,
   #/display/<id> when the file is opened directly.
   ------------------------------------------------------------ */
function routeOf() {
  const hash = location.hash.match(/^#\/display\/([\w-]+)/);
  if (hash) return hash[1];
  const path = location.pathname.match(/\/display\/([\w-]+)\/?$/);
  if (path) return path[1];
  return null;
}

async function boot() {
  const embed = window.__SIGNAGE_EMBED__;
  if (embed && embed.state) {
    // an exported screen: it carries its own content
    Store.set(migrate(embed.state));
    setLang(embed.state.lang || "en");
    if (embed.live && embed.live.base) {
      // …and, in live mode, keeps following the desk it came from
      Net.setBase(embed.live.base);
      const mode = await Net.init();
      Display.start(embed.screenId, mode !== "server");
      return;
    }
    Display.start(embed.screenId, true);
    return;
  }
  await Net.init();
  const id = routeOf();
  if (id) Display.start(id);
  else App.start();
  window.addEventListener("hashchange", () => location.reload());
}

// wait for the whole document: an exported file carries its content in a
// script tag that follows this one
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

</script>
</body>
</html>
