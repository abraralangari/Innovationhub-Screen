    const { dw, dh } = designSize(wM, hM);
    Store.update((st) => {
      const s = st.screens.find((x) => x.id === id);
      s.wM = wM; s.hM = hM; s.dw = dw; s.dh = dh;
      s.profile = wM >= hM ? "landscape" : "portrait";
    });
    render(); syncStage();
  }

  function addScreenDialog() {
    const state = { nameEn: "New screen", nameAr: "شاشة جديدة", id: "", wM: 0.6, hM: 2.7 };
    const idField = h("input", { type: "text", dir: "ltr", placeholder: "vertical-3", oninput: (e) => { state.id = e.target.value; } });
    const box = h("div", { class: "modal" },
      h("header", null, h("h2", null, t("addScreen"))),
      h("div", { class: "mbody" },
        h("div", { class: "row" },
          h("div", { class: "field" }, h("label", null, t("english")),
            h("input", { type: "text", value: state.nameEn, oninput: (e) => { state.nameEn = e.target.value; } })),
          h("div", { class: "field" }, h("label", null, t("arabic")),
            h("input", { type: "text", dir: "rtl", value: state.nameAr, oninput: (e) => { state.nameAr = e.target.value; } }))),
        h("div", { class: "field" }, h("label", null, t("displayUrl")), idField),
        h("div", { class: "row" },
          h("div", { class: "field" }, h("label", null, t("width_m")),
            h("input", { type: "number", step: "0.05", value: state.wM, oninput: (e) => { state.wM = +e.target.value; } })),
          h("div", { class: "field" }, h("label", null, t("height_m")),
            h("input", { type: "number", step: "0.05", value: state.hM, oninput: (e) => { state.hM = +e.target.value; } })))),
      h("footer", null,
        h("button", { class: "btn ghost", onclick: closeModal }, t("cancel")),
        h("button", {
          class: "btn primary", onclick: () => {
            const slug = (state.id || state.nameEn).toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-|-$/g, "") || uid("scr");
            if (Store.screen(slug)) { Toast.show("This link is already taken.", true); return; }
            Store.update((st) => {
              st.screens.push(newScreen(slug, state.nameEn, state.nameAr, state.wM, state.hM, state.wM >= state.hM ? "landscape" : "portrait"));
            });
            screenId = slug;
            closeModal(); render(); syncStage();
          }
        }, t("add"))));
    openModal(box);
  }

  function removeScreen(id) {
    confirmDialog(t("confirmDelete", { name: screenName(Store.screen(id)) }), t("deleteScreenWarn"), () => {
      Store.update((st) => { st.screens = st.screens.filter((s) => s.id !== id); });
      if (screenId === id) screenId = Store.state.screens[0].id;
      render(); syncStage();
    });
  }

  /* ---------------- media handling ---------------- */
  function pickFiles() {
    const inp = h("input", { type: "file", multiple: true, accept: "image/*,video/mp4,video/webm" });
    inp.onchange = () => handleFiles(inp.files);
    inp.click();
  }

  async function handleFiles(files) {
    for (const f of Array.from(files || [])) {
      try {
        const rec = await ingestFile(f);
        Store.update((st) => { st.media.unshift(rec); });
      } catch (e) { Toast.show(e.message || String(e), true); }
    }
    renderRail(); renderPage();
  }

  function replaceMedia(id) {
    const inp = h("input", { type: "file", accept: "image/*,video/mp4,video/webm" });
    inp.onchange = async () => {
      const f = inp.files[0];
      if (!f) return;
      try {
        const fresh = await ingestFile(f);
        const old = Store.media(id);
        await Net.delMedia(old);
        if (!fresh.url) {                       // browser-local: move the blob onto the existing id
          const blob = await IDB.get(fresh.id).catch(() => null);
          if (blob) { await IDB.put(id, blob); await IDB.del(fresh.id).catch(() => {}); }
        }
        Store.update((st) => {
          const m = st.media.find((x) => x.id === id);
          Object.assign(m, {
            kind: fresh.kind, mime: fresh.mime, size: fresh.size,
            w: fresh.w, h: fresh.h, dur: fresh.dur, thumb: fresh.thumb, url: fresh.url
          });
        });
        if (stage) stage.urlCache.delete(id);
        Toast.show(t("saved"));
        renderPage(); renderInspector(); syncStage();
      } catch (e) { Toast.show(e.message || String(e), true); }
    };
    inp.click();
  }

  function deleteMedia(id) {
    const m = Store.media(id);
    confirmDialog(t("confirmDelete", { name: m.name }), t("confirmDeleteMedia"), async () => {
      await Net.delMedia(m);
      Store.update((st) => {
        st.media = st.media.filter((x) => x.id !== id);
        for (const s of st.screens) {
          for (const c of [s.draft, s.live].filter(Boolean)) {
            for (const p of c.playlists) p.items = p.items.filter((i) => i.mediaId !== id);
            for (const w of c.widgets) if (w.props && w.props.mediaId === id) delete w.props.mediaId;
          }
        }
      });
      sel = { kind: null, id: null };
      render(); syncStage();
      Toast.show(t("removed"));
    });
  }

  async function previewMedia(id) {
    const m = Store.media(id);
    const url = await Net.mediaUrl(m).catch(() => null);
    const view = url
      ? (m.kind === "video"
        ? h("video", { src: url, controls: "", autoplay: true, muted: true, playsinline: "", style: { width: "100%", maxHeight: "70vh", background: "#000", display: "block" } })
        : h("img", { src: url, alt: m.name, style: { width: "100%", maxHeight: "70vh", objectFit: "contain", background: "#000", display: "block" } }))
      : h("div", { class: "empty-state" }, h("b", null, t("mediaEmpty")), t("mediaEmptyHint"));
    openModal(h("div", { class: "modal wide" },
      h("header", null, h("h2", null, m.name), h("div", { class: "sp" }),
        h("button", { class: "btn quiet icon", onclick: closeModal }, icon("close"))),
      h("div", { class: "mbody" }, view,
        h("p", { class: "hint", style: { marginTop: "10px" } },
          `${m.w}×${m.h} · ${fmtBytes(m.size)}${m.dur ? " · " + fmtClock(m.dur) : ""}`))));
  }

  function pickMedia(kind, onPick) {
    const grid = h("div", { class: "media-grid" });
    const list = Store.state.media.filter((m) => !kind || m.kind === kind);
    if (!list.length) grid.append(h("div", { class: "empty-state" }, h("b", null, t("mediaEmpty")), t("mediaEmptyHint")));
    for (const m of list) {
      grid.append(h("div", { class: "card", onclick: () => { onPick(m.id); closeModal(); renderInspector(); } },
        h("div", { class: "ph" }, m.thumb ? h("div", { class: "img", style: { backgroundImage: `url(${m.thumb})` } }) : null),
        h("div", { class: "cap" }, h("div", { class: "nm" }, m.name))));
    }
    openModal(h("div", { class: "modal wide" },
      h("header", null, h("h2", null, t("pickImage")), h("div", { class: "sp" }),
        h("button", { class: "btn quiet icon", onclick: closeModal }, icon("close"))),
      h("div", { class: "mbody" }, grid)));
  }

  /* ---------------- backup ---------------- */
  function exportBackup() {
    const blob = new Blob([JSON.stringify(Store.state, null, 2)], { type: "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: "signage-backup.json" });
    a.click();
    Toast.show(t("backupDone"));
  }
  function importBackup() {
    const inp = h("input", { type: "file", accept: "application/json" });
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      try {
        const j = JSON.parse(await f.text());
        if (!j.screens) throw new Error("bad file");
        confirmDialog(t("importBackup"), t("restoreWarn"), () => {
          Store.set(j);
          Store.update(() => {});
          setLang(j.lang || "en");
          screenId = j.screens[0].id;
          render(); syncStage();
          Toast.show(t("restoreDone"));
        });
      } catch (e) { Toast.show(String(e.message || e), true); }
    };
    inp.click();
  }
  function resetAll() {
    confirmDialog(t("resetAll"), t("resetWarn"), async () => {
      await IDB.clear().catch(() => {});
      Store.set(defaultState());
      Store.update(() => {});
      screenId = Store.state.screens[0].id;
      render(); syncStage();
    });
  }

  /* ---------------- modal helpers ---------------- */
  let scrim = null;
  function openModal(node) {
    closeModal();
    scrim = h("div", { class: "scrim", onclick: (e) => { if (e.target === scrim) closeModal(); } }, node);
    document.body.append(scrim);
    const f = node.querySelector("input, button");
    if (f) f.focus();
  }
  function closeModal() { if (scrim) { scrim.remove(); scrim = null; } }
  function confirmDialog(title, text, onYes) {
    openModal(h("div", { class: "modal", style: { width: "420px" } },
      h("header", null, h("h2", null, title)),
      h("div", { class: "mbody" }, h("p", { class: "hint" }, text)),
      h("footer", null,
        h("button", { class: "btn ghost", onclick: closeModal }, t("cancel")),
        h("button", { class: "btn danger", onclick: () => { closeModal(); onYes(); } }, t("done")))));
  }

  function copy(text) {
    navigator.clipboard?.writeText(text).then(() => Toast.show(t("copied")),
      () => Toast.show(text, false));
  }

  /* ---------------- keyboard ---------------- */
  function bindKeys() {
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeModal(); return; }
      const tag = (e.target.tagName || "").toLowerCase();
      if (["input", "textarea", "select"].includes(tag)) return;
      if (page === "widgets" && sel.kind === "widget") {
        const step = e.shiftKey ? 2 : 0.5;
        const map = { ArrowLeft: ["x", -step], ArrowRight: ["x", step], ArrowUp: ["y", -step], ArrowDown: ["y", step] };
        if (map[e.key]) {
          e.preventDefault();
          const [k, d] = map[e.key];
          editWidget(sel.id, (w) => { w[k] = round(clamp(w[k] + d, -20, 120), 1); });
          renderInspector();
          return;
        }
        if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteWidget(sel.id); return; }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "d") { e.preventDefault(); duplicateWidget(sel.id); return; }
      }
      if (e.code === "Space" && STAGE_PAGES.includes(page)) { e.preventDefault(); cmd("toggle"); }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveDraft(); }
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); publish(screenId); }
    });
  }

  return { start };
})();


/* ============================================================
   Display runtime — what runs on the player attached to the wall.
   No chrome, no cursor, keeps the last good frame if the link drops.
   ============================================================ */
const Display = (() => {
  let screenId = null;
  let stage = null;
  let lastSig = null;
  let lastPlaylistId = null;

  async function start(id) {
    screenId = id;
    document.body.classList.add("display-mode");
    const root = h("div", { id: "display-root" });
    const flag = h("div", { id: "conn-flag" });
    clear(document.body).append(root, flag);

    const saved = await Net.loadState().catch(() => null);
    if (saved) Store.set(saved);
    setLang(Store.state.lang || "en");

    stage = new Stage(root, { interactive: false, chrome: false });

    apply(true);

    Net.on("state", async () => {
      try { await Store.reload(); apply(false); }
      catch (e) { /* keep showing the last content */ }
    });
    Net.on("cmd", (m) => {
      if (!m || (m.screenId && m.screenId !== screenId)) return;
      if (m.cmd === "play") stage.play();
      else if (m.cmd === "pause") stage.pause();
      else if (m.cmd === "next") stage.next();
      else if (m.cmd === "prev") stage.prev();
      else if (m.cmd === "reload") location.reload();
    });
    Net.on("link", (up) => flag.classList.toggle("show", !up));

    // heartbeat so the desk can show On air / Not connected
    const beat = () => Net.beat({ screenId, at: Date.now(), ua: navigator.userAgent.slice(0, 60) });
    beat();
    setInterval(beat, 3000);

    // re-check the schedule every 10s; switching playlists is seamless
    setInterval(() => apply(false), 10000);

    // in browser-local mode there is no push channel from another profile,
    // so poll storage as a safety net
    if (Net.mode === "local") setInterval(async () => {
      try { await Store.reload(); apply(false); } catch (e) { /* ignore */ }
    }, 4000);

    keepAwake();
    window.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
    document.addEventListener("dblclick", () => document.documentElement.requestFullscreen?.());
  }

  function apply(first) {
    const s = Store.screen(screenId);
    if (!s) return;
    const cfg = s.live;
    stage.setScreen(s);
    if (!cfg) { return; }
    const res = resolvePlaylist(cfg, Store.state.settings.tz || "Asia/Riyadh");
    const pl = res ? res.playlist : null;
    const sig = JSON.stringify([s.liveRev, cfg.blackout, pl && pl.id, pl && pl.items, cfg.widgets, cfg.transition, cfg.transitionMs, cfg.loop, cfg.shuffle]);
    if (sig === lastSig && !first) return;
    lastSig = sig;
    const switched = pl && pl.id !== lastPlaylistId;
    lastPlaylistId = pl ? pl.id : null;
    void switched;
    stage.apply(cfg, pl);
  }

  async function keepAwake() {
    try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); }
    catch (e) { /* not critical */ }
  }

  return { start };
})();

/* ------------------------------------------------------------
   Routing: /display/<id> when a sync server is serving the app,
   #/display/<id> when the file is opened directly.
   ------------------------------------------------------------ */
function routeOf() {
  const hash = location.hash.match(/^#\/display\/([\w-]+)/);
  if (hash) return hash[1];
  const path = location.pathname.match(/\/display\/([\w-]+)\/?$/);
  if (path) return path[1];
  return null;
}

(async function boot() {
  await Net.init();
  const id = routeOf();
  if (id) Display.start(id);
  else App.start();
  window.addEventListener("hashchange", () => location.reload());
})();

</script>
