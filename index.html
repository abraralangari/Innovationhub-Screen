<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Signage Desk · Innovation Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d9a84e'/%3E%3Crect x='8' y='10' width='16' height='12' rx='1.5' fill='none' stroke='%230c1618' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ------------------------------------------------------------------
   Digital Government Authority identity.
   Primary   #1cc182 green · #1d9af2 blue · #2a206a indigo · #852cd0 purple
   Secondary #c40000 #ff6700 #ffa300 #ffe257 #00abaf #5d6167 #594aff
   Type      Diodrum Arabic (brand), Calvino for English display
   ------------------------------------------------------------------ */
:root {
  /* brand constants — identical in both desk themes */
  --dga-green: #1cc182;
  --dga-blue: #1d9af2;
  --dga-indigo: #2a206a;
  --dga-purple: #852cd0;
  --dga-ink: #1c1554;
  --dga-red: #c40000;
  --dga-amber: #ffa300;
  --dga-teal: #00abaf;
  --dga-grey: #5d6167;
  --brand-sweep: linear-gradient(115deg, var(--dga-green), var(--dga-blue) 46%, var(--dga-purple));

  /* light desk (default) */
  --canvas: #e8ebf3;
  --panel: #ffffff;
  --raise: #f2f4fa;
  --raise-2: #e6eaf6;
  --field: #f7f8fc;
  --line: #dde2ee;
  --line-soft: #ebeef6;
  --text: #211c4e;
  --muted: #5d6488;
  --dim: #8188a6;
  --accent: var(--dga-indigo);
  --accent-soft: var(--dga-blue);
  --live: var(--dga-green);
  --warn: var(--dga-red);
  --focus: var(--dga-blue);
  --sel-bg: #eef3ff;
  --on-accent: #ffffff;
  --wall: #15103f;
  --wall-lit: #241b63;
  --bezel-1: #3b3379;
  --bezel-2: #0e0a2b;
  --bezel-3: #4b4390;
  --glow: rgba(29, 154, 242, .22);
  --chip: rgba(42, 32, 106, .06);
  --overlay: rgba(20, 16, 54, .55);
  --shadow: 0 16px 40px -22px rgba(28, 21, 84, .45);
  --toast-bg: #2a206a;
  --toast-text: #ffffff;

  --rail-w: 240px;
  --insp-w: 344px;
  --top-h: 66px;
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 20px;
  --r-sweep: 44px;
  --sans: "Diodrum Arabic", "DiodrumArabic", "IBM Plex Sans Arabic", -apple-system, "Segoe UI", "Noto Sans", Arial, sans-serif;
  --arabic: "Diodrum Arabic", "DiodrumArabic", "IBM Plex Sans Arabic", "Segoe UI", "Noto Naskh Arabic", Tahoma, sans-serif;
  --display: "Calvino", "Diodrum Arabic", Georgia, serif;
}

/* night desk — same identity, for dim control rooms */
[data-theme="night"] {
  --canvas: #0f0c2e;
  --panel: #171245;
  --raise: #1e1857;
  --raise-2: #272068;
  --field: #120e38;
  --line: #2c2570;
  --line-soft: #221c5c;
  --text: #eceaff;
  --muted: #a6a3d6;
  --dim: #8a86bd;
  --accent: var(--dga-blue);
  --accent-soft: var(--dga-green);
  --sel-bg: #241d63;
  --on-accent: #0d0a26;
  --wall: #0a0722;
  --wall-lit: #171048;
  --bezel-1: #3a3380;
  --bezel-2: #060418;
  --bezel-3: #4b4390;
  --chip: rgba(255, 255, 255, .06);
  --shadow: 0 18px 48px -24px rgba(0, 0, 0, .9);
  --toast-bg: #241d63;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--canvas);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body[dir="rtl"] { font-family: var(--arabic); }

button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--accent-soft); color: #fff; }

/* ---------- app frame ---------- */
#app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--insp-w);
  grid-template-rows: var(--top-h) minmax(0, 1fr);
  grid-template-areas: "top top top" "rail stage insp";
  height: 100vh;
}

/* ---------- top bar ---------- */
.top {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  overflow: hidden;
  padding-inline: 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  z-index: 30;
}

.brandmark {
  display: flex;
  align-items: center;
  gap: 10px;
  width: calc(var(--rail-w) - 32px);
  flex: none;
}

.brandmark .glyph {
  width: 32px; height: 32px;
  border-radius: 9px 9px 9px 3px;   /* the identity's swept corner */
  background: var(--brand-sweep);
  position: relative;
  flex: none;
}
.brandmark .glyph::after {
  content: "";
  position: absolute;
  inset: 9px 8px;
  border: 1.6px solid rgba(255, 255, 255, .9);
  border-radius: 2px;
}
.brandmark img { height: 34px; width: auto; max-width: 190px; object-fit: contain; display: block; }
/* the mark stays at the physical top-left, in Arabic too */
body[dir="rtl"] .top .brandmark { order: 9; }
.brandmark b { font-weight: 600; letter-spacing: -.2px; font-size: 14px; display: block; }
.brandmark span { color: var(--dim); font-size: 11.5px; display: block; margin-top: -2px; }

.screen-picker {
  display: flex;
  max-width: 40vw;
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
  gap: 2px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  padding: 3px;
}
.screen-picker button {
  background: none;
  border: 0;
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 7px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}
.screen-picker button:hover { color: var(--text); }
.screen-picker button[aria-pressed="true"] {
  background: var(--raise);
  color: var(--text);
  box-shadow: inset 0 0 0 1px var(--line);
}
.screen-picker .ratio { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.on { background: var(--live); box-shadow: 0 0 0 3px rgba(79, 209, 165, .16); }
.dot.off { background: var(--warn); }

.status-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px 5px 10px;
  color: var(--muted);
  background: rgba(0, 0, 0, .2);
  white-space: nowrap;
}

.top .spacer { flex: 1; }

/* ---------- buttons ---------- */
.btn {
  background: var(--raise);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 14px;
  border-radius: var(--r-s);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background .12s ease, border-color .12s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--raise-2); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--raise); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--text); background: var(--raise); }
.btn.primary {
  background: var(--accent);
  border-color: transparent;
  color: var(--on-accent);
  font-weight: 600;
}
.btn.brand {
  background: var(--brand-sweep);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
}
.btn.brand:hover { filter: brightness(1.06); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--warn); }
.btn.danger:hover { background: rgba(228, 121, 107, .12); }
.btn[disabled] { opacity: .42; pointer-events: none; }
.btn.sm { padding: 5px 9px; font-size: 12.5px; }
.btn.icon { padding: 7px; }
.pulse-live { animation: pulseLive 2.4s ease-in-out infinite; }
.unpub-dot { width: 7px; height: 7px; border-radius: 50%; background: #15211f; flex: none; }
@keyframes pulseLive { 0%, 100% { box-shadow: 0 0 0 0 rgba(29, 154, 242, .38); } 50% { box-shadow: 0 0 0 7px rgba(29, 154, 242, 0); } }

/* ---------- rail ---------- */
.rail {
  grid-area: rail;
  background: var(--panel);
  border-inline-end: 1px solid var(--line);
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow-y: auto;
}
.rail button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  background: none;
  border: 0;
  color: var(--muted);
  padding: 9px 11px;
  border-radius: var(--r-s);
  cursor: pointer;
  text-align: start;
  position: relative;
}
.rail button:hover { background: var(--raise); color: var(--text); }
.rail button[aria-current="page"] { background: var(--raise); color: var(--text); }
.rail button[aria-current="page"]::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 9px; bottom: 9px;
  width: 2px;
  background: var(--accent-soft);
  border-radius: 2px;
}
.rail svg { width: 17px; height: 17px; flex: none; opacity: .9; }
.rail .count {
  margin-inline-start: auto;
  font-size: 11px;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.rail .foot {
  margin-top: auto;
  padding: 10px 11px 2px;
  border-top: 1px solid var(--line-soft);
  color: var(--dim);
  font-size: 11.5px;
  line-height: 1.6;
}
.rail .foot code { color: var(--muted); font-size: 11px; }

/* ---------- stage ---------- */
.stage-wrap {
  grid-area: stage;
  border-start-start-radius: var(--r-sweep);
  background:
    radial-gradient(130% 90% at 50% -10%, var(--wall-lit) 0%, var(--wall) 62%),
    var(--wall);
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}
.stage-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line-soft);
  color: var(--muted);
  flex: none;
}
.stage-head .title { color: var(--text); font-weight: 600; }
.stage-head .meta { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.stage-head .sp { flex: 1; }

.stage-area {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 26px 30px;
  position: relative;
}

.screen-frame { position: relative; }
.screen-frame .tick {
  position: absolute;
  color: var(--dim);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  letter-spacing: .02em;
}
.screen-frame .tick.top { top: -20px; inset-inline-start: 0; inset-inline-end: 0; text-align: center; }
.screen-frame .tick.top::before,
.screen-frame .tick.top::after {
  content: "";
  position: absolute;
  top: 50%;
  width: calc(50% - 46px);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line));
}
.screen-frame .tick.top::before { inset-inline-start: 0; }
.screen-frame .tick.top::after { inset-inline-end: 0; transform: scaleX(-1); }
.screen-frame .tick.side {
  inset-inline-end: -14px;
  top: 50%;
  transform: translate(50%, -50%) rotate(90deg);
}

.screen {
  position: relative;
  background: #000;
  overflow: hidden;
  box-shadow:
    0 0 0 1px var(--bezel-1),
    0 0 0 8px var(--bezel-2),
    0 0 0 9px var(--bezel-3),
    0 40px 80px -40px rgba(0, 0, 0, .8),
    0 0 130px -40px var(--glow);
}
.screen.is-drop { box-shadow: 0 0 0 2px var(--accent-soft), 0 0 0 9px #0e1a1c; }
.screen-reflection {
  position: absolute;
  inset-inline: 8px;
  top: 100%;
  height: 46px;
  background: linear-gradient(180deg, rgba(120, 150, 240, .14), transparent 75%);
  filter: blur(6px);
  pointer-events: none;
}

/* design-space host: content is authored at real screen coordinates and scaled */
.design {
  position: absolute;
  top: 0;
  left: 0;
  right: auto;
  transform-origin: top left;
  direction: ltr;
}

.layer { position: absolute; inset: 0; }
.media-layer { z-index: 1; }
.wg-layer { z-index: 5; }          /* widgets always sit on top of the media */
.empty-screen { z-index: 3; }
.layer img, .layer video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.layer.fade { transition: opacity var(--tdur, 700ms) ease; }

.guides { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.guides .safe { position: absolute; border: 1px dashed rgba(29, 154, 242, .45); }
.guides .safe.action { inset: 5%; }                                   /* 90% — action safe */
.guides .safe.title { inset: 10%; border-color: rgba(28, 193, 130, .40); }  /* 80% — title safe */
.guides .cx, .guides .cy { position: absolute; background: rgba(28, 193, 130, .45); }
.guides .cx { left: 50%; top: 0; bottom: 0; width: 1px; }
.guides .cy { top: 50%; left: 0; right: 0; height: 1px; }
.guides .grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(255, 255, 255, .07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, .07) 1px, transparent 1px);
}

/* widgets */
.wg { position: absolute; display: flex; overflow: hidden; }
.wg-inner { width: 100%; height: 100%; display: flex; }
.wg .wg-body { width: 100%; display: flex; flex-direction: column; justify-content: center; }
.wg.sel { outline: 2px solid var(--accent-soft); outline-offset: 0; }
.wg.editable { cursor: move; }
.wg.locked { cursor: default; }
.handle {
  position: absolute;
  width: 11px; height: 11px;
  background: var(--accent-soft);
  border: 1.5px solid #101c1e;
  border-radius: 2px;
}
.handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
.handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
.handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
.handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }

.cd-row { display: flex; width: 100%; }
.cd-cell { flex: 1; display: flex; flex-direction: column; align-items: center; }
.cd-num { font-variant-numeric: tabular-nums; line-height: 1.02; }
.cd-lab { opacity: .62; line-height: 1.6; }

.empty-screen {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 8px;
  color: #5a5590;
  text-align: center;
  padding: 8%;
}
.empty-screen b { color: #8c87c4; font-weight: 500; }

/* transport */
.transport {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px 14px;
  border-top: 1px solid var(--line-soft);
  background: rgba(0, 0, 0, .18);
}
.transport .now {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  overflow: hidden;
}
.transport .now b { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress { flex: 1; height: 3px; background: var(--line-soft); border-radius: 2px; overflow: hidden; min-width: 60px; }
.progress i { display: block; height: 100%; background: var(--accent-soft); width: 0; }

/* ---------- inspector ---------- */
.insp {
  grid-area: insp;
  background: var(--panel);
  border-inline-start: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.insp-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-soft);
  flex: none;
}
.insp-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.insp-head .sp { flex: 1; }
.insp-body { overflow-y: auto; padding: 12px 14px 28px; flex: 1; }

.field { margin-bottom: 12px; }
.field > label, .flabel {
  display: block;
  color: var(--muted);
  margin-bottom: 5px;
  font-size: 12.5px;
}
input[type="text"], input[type="number"], input[type="url"], input[type="date"],
input[type="time"], input[type="datetime-local"], select, textarea {
  width: 100%;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 7px 9px;
  color: var(--text);
}
input[type="color"] {
  width: 100%; height: 32px; padding: 2px;
  background: var(--field); border: 1px solid var(--line); border-radius: var(--r-s); cursor: pointer;
}
textarea { resize: vertical; min-height: 64px; }
input[type="range"] { width: 100%; accent-color: var(--accent-soft); }
input[type="checkbox"] { accent-color: var(--accent-soft); width: 15px; height: 15px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 12px center, right 7px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-inline-end: 24px; }
body[dir="rtl"] select { background-position: left 7px center, left 12px center; background-image: linear-gradient(135deg, transparent 50%, var(--muted) 50%), linear-gradient(45deg, var(--muted) 50%, transparent 50%); padding-inline-end: 9px; padding-inline-start: 24px; }

.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.inline { display: flex; align-items: center; gap: 8px; }
.inline label { margin: 0; }
.sect {
  border-top: 1px solid var(--line-soft);
  margin: 16px -14px 12px;
  padding: 12px 14px 0;
}
.sect > h3 {
  margin: 0 0 10px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}
.hint { color: var(--dim); font-size: 12px; line-height: 1.5; }
.opt {
  display: block; border: 1px solid var(--line); border-radius: var(--r-m);
  padding: 12px 14px; cursor: pointer; margin-bottom: 10px; background: var(--field);
}
.opt:hover { border-color: var(--accent-soft); }
.opt b { display: block; margin-bottom: 3px; }
.code {
  width: 100%; min-height: 74px; font-family: "SF Mono", Consolas, monospace;
  font-size: 12px; direction: ltr; text-align: start;
}
.timer-state { color: var(--live); font-size: 12px; }
.timer-state.off { color: var(--muted); }

.seg { display: flex; background: var(--field); border: 1px solid var(--line); border-radius: var(--r-s); padding: 2px; gap: 2px; }
.seg button {
  flex: 1;
  background: none; border: 0; color: var(--muted);
  padding: 5px 4px; border-radius: 4px; cursor: pointer; font-size: 12.5px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--raise-2); color: var(--text); }

.align-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.align-grid button {
  height: 30px; border-radius: 5px; border: 1px solid var(--line);
  background: var(--field); cursor: pointer; display: flex; padding: 4px;
}
.align-grid button:hover { border-color: var(--accent-soft); }
.align-grid i { width: 9px; height: 5px; background: var(--muted); border-radius: 1px; display: block; }
.align-grid button:hover i { background: var(--accent-soft); }

/* ---------- lists & cards ---------- */
.panel-list { display: flex; flex-direction: column; gap: 6px; }
.item {
  display: flex; align-items: center; gap: 10px;
  background: var(--field);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-s);
  padding: 7px 9px;
  cursor: pointer;
}
.item:hover { border-color: var(--line); }
.item.sel { border-color: var(--accent-soft); background: var(--sel-bg); }
.item .thumb {
  width: 42px; height: 30px; border-radius: 3px; background: #000 center/cover no-repeat;
  flex: none; position: relative; overflow: hidden;
}
.item .thumb .vid {
  position: absolute; inset-inline-end: 2px; bottom: 2px;
  background: rgba(0, 0, 0, .7); border-radius: 2px; padding: 0 3px; font-size: 9px; color: #d5e5e4;
}
.item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.item .grip { color: var(--dim); cursor: grab; touch-action: none; padding: 2px; }
.item.dragging { opacity: .55; border-color: var(--accent-soft); }
.item.hidden-w .nm { opacity: .45; text-decoration: line-through; }

.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.card {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-m);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .12s ease;
}
.card:hover { border-color: var(--line); }
.card.sel { border-color: var(--accent-soft); }
.card .ph {
  aspect-ratio: 16 / 10;
  background: var(--raise) center/contain no-repeat;
  position: relative;
  border-bottom: 1px solid var(--line-soft);
  background-image:
    linear-gradient(45deg, var(--chip) 25%, transparent 25%, transparent 75%, var(--chip) 75%),
    linear-gradient(45deg, var(--chip) 25%, transparent 25%, transparent 75%, var(--chip) 75%);
  background-size: 14px 14px;
  background-position: 0 0, 7px 7px;
}
.card .ph .img { position: absolute; inset: 0; background: center/contain no-repeat; }
.card .ph .tag {
  position: absolute; top: 6px; inset-inline-start: 6px;
  background: rgba(20, 16, 54, .78); border-radius: 4px; padding: 1px 6px; font-size: 10.5px; color: #fff;
}
.card .cap { padding: 8px 10px; }
.card .cap .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .cap .sub { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.page { padding: 20px 24px 40px; overflow-y: auto; height: 100%; }
.page h1 { font-size: 19px; font-weight: 600; margin: 0 0 3px; letter-spacing: -.2px; }
.page .lede { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }
.page-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head .sp { flex: 1; }

.screen-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.screen-card {
  background: var(--panel); border: 1px solid var(--line-soft);
  border-radius: var(--r-l) var(--r-l) var(--r-l) 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.screen-card.active { border-color: var(--accent-soft); }
.screen-card .mini {
  background: #000; border: 1px solid var(--line); border-radius: 4px;
  align-self: center; position: relative; overflow: hidden;
}
.screen-card .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.screen-card .actions .btn { flex: 0 0 auto; }
.screen-card .actions .btn.wide { flex: 1 1 100%; justify-content: center; }
.screen-card .url {
  display: flex; align-items: center; gap: 6px;
  background: var(--field); border: 1px solid var(--line-soft); border-radius: var(--r-s);
  padding: 6px 8px; color: var(--muted); font-size: 12px; overflow: hidden;
}
.screen-card .url code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: start; }

.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  text-align: start; color: var(--muted); font-weight: 500; font-size: 12.5px;
  padding: 6px 10px; border-bottom: 1px solid var(--line);
}
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.tbl tr.off td { opacity: .5; }
.tbl .now-badge { color: var(--live); font-size: 11.5px; }

.drop {
  border: 1.5px dashed var(--line);
  border-radius: var(--r-l);
  padding: 26px;
  text-align: center;
  color: var(--muted);
  background: rgba(0, 0, 0, .15);
}
.drop.hot { border-color: var(--accent-soft); color: var(--text); background: rgba(29, 154, 242, .08); }

.empty-state { padding: 34px 20px; text-align: center; color: var(--dim); }
.empty-state b { display: block; color: var(--muted); font-weight: 500; margin-bottom: 4px; }

/* ---------- modal & toast ---------- */
.scrim {
  position: fixed; inset: 0; background: var(--overlay);
  display: grid; place-items: center; z-index: 60; padding: 20px;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-l) var(--r-l) var(--r-l) 8px; box-shadow: var(--shadow);
  width: min(560px, 100%); max-height: 86vh; display: flex; flex-direction: column;
}
.modal.wide { width: min(min(1100px, 94vw), 100%); }
.modal header { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; }
.modal header h2 { margin: 0; font-size: 15px; font-weight: 600; }
.modal header .sp { flex: 1; }
.modal .mbody { padding: 16px; overflow: auto; }
.modal footer { padding: 12px 16px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; justify-content: flex-end; }

#toasts {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 90; align-items: center;
}
.toast {
  background: var(--toast-bg); color: var(--toast-text); border: 1px solid transparent; border-radius: 999px;
  padding: 9px 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 9px;
}
.toast.err { background: var(--dga-red); color: #fff; }

/* ---------- display page ---------- */
body.display-mode { background: #000; cursor: none; overflow: hidden; }
body.display-mode.in-frame { cursor: auto; }
#display-root { position: fixed; inset: 0; background: #000; overflow: hidden; display: grid; place-items: center; }
#display-root .screen { box-shadow: none; }
#conn-flag {
  position: fixed; top: 0; inset-inline-start: 0;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--warn); opacity: 0; transition: opacity .4s ease; pointer-events: none;
}
#conn-flag.show { opacity: .55; }

@media (max-width: 1180px) {
  #app { grid-template-columns: 64px minmax(0, 1fr) 300px; }
  .rail button span.lbl, .rail .foot, .brandmark b, .brandmark span { display: none; }
  .rail button { justify-content: center; }
  .brandmark { width: 42px; }
}
@media (max-width: 880px) {
  #app { grid-template-columns: 64px minmax(0, 1fr); grid-template-areas: "top top" "rail stage"; }
  .insp { position: fixed; inset-block: var(--top-h) 0; inset-inline-end: 0; width: 300px; z-index: 40; box-shadow: var(--shadow); transform: translateX(100%); transition: transform .18s ease; }
  body[dir="rtl"] .insp { transform: translateX(-100%); }
  .insp.open { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- brand palette pickers ---------- */
.swatches { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.swatches button {
  width: 20px; height: 20px; border-radius: 5px; cursor: pointer;
  border: 1px solid rgba(0, 0, 0, .18);
}
.swatches button[aria-pressed="true"] { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
.swatches .sweep { background: var(--brand-sweep); }

/* ---------- icon picker ---------- */
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.icon-grid button {
  aspect-ratio: 1; border: 1px solid var(--line-soft); border-radius: var(--r-s);
  background: var(--field); cursor: pointer; display: grid; place-items: center; color: var(--text);
  padding: 10px;
}
.icon-grid button:hover { border-color: var(--accent-soft); color: var(--accent-soft); }
.icon-grid button[aria-pressed="true"] { border-color: var(--accent-soft); background: var(--sel-bg); }
.icon-grid svg { width: 100%; height: 100%; }

/* ---------- widget internals ---------- */
.tk-wrap { width: 100%; overflow: hidden; display: flex; align-items: center; }
.tk-track { display: inline-flex; white-space: nowrap; will-change: transform; animation: tkRun linear infinite; }
.tk-track > span { padding-inline-end: var(--tk-gap, 120px); }
@keyframes tkRun { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.tk-track.rtl { animation-name: tkRunR; }
@keyframes tkRunR { from { transform: translateX(-50%); } to { transform: translateX(0); } }

.ag-row { display: flex; align-items: baseline; width: 100%; }
.ag-row .ag-time { flex: none; font-variant-numeric: tabular-nums; opacity: .85; }
.ag-row .ag-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-row.past { opacity: .38; }
.ag-row.now { opacity: 1; }
.ag-row .ag-dot { flex: none; border-radius: 50%; }

.pt-row { display: flex; align-items: baseline; justify-content: space-between; width: 100%; }
.pt-row.next { font-weight: 700; }
.pt-grid { display: flex; width: 100%; }
.pt-cell { flex: 1; display: flex; flex-direction: column; align-items: center; }

.stat-val { line-height: 1; font-variant-numeric: tabular-nums; }
.stat-lab { opacity: .72; }

/* ---------- brand page ---------- */
.brand-strip { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; }
.brand-chip {
  width: 92px; border-radius: var(--r-m); overflow: hidden;
  border: 1px solid var(--line-soft); background: var(--panel);
}
.brand-chip .fill { height: 52px; }
.brand-chip .meta { padding: 6px 8px; font-size: 11px; color: var(--muted); }
.brand-chip .meta b { display: block; color: var(--text); font-weight: 500; font-size: 11.5px; }
.logo-slot {
  border: 1.5px dashed var(--line); border-radius: var(--r-m);
  min-height: 92px; display: grid; place-items: center; padding: 12px;
  background: var(--field);
}
.logo-slot.dark { background: var(--wall); }
.logo-slot img { max-height: 64px; max-width: 100%; object-fit: contain; }

/* ---------- the stage area is dark in both desks, so its chrome inverts ---------- */
.stage-wrap { color: #e7eaf8; }
.stage-head .title { color: #ffffff; }
.stage-head .meta, .stage-head .hint, .transport .now, .transport .sub, .screen-frame .tick {
  color: rgba(231, 234, 248, .62);
}
.transport .now b { color: #ffffff; }
.stage-wrap .btn {
  background: rgba(255, 255, 255, .09);
  border-color: rgba(255, 255, 255, .16);
  color: #eef0fb;
}
.stage-wrap .btn:hover { background: rgba(255, 255, 255, .17); }
.stage-wrap .btn.quiet { background: transparent; border-color: transparent; }
.stage-wrap .btn.primary { background: var(--dga-blue); border-color: transparent; color: #fff; }
.stage-wrap .seg { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .14); }
.stage-wrap .seg button { color: rgba(231, 234, 248, .7); }
.stage-wrap .seg button:hover { color: #fff; }
.stage-wrap .seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .2); color: #fff; }
.stage-wrap .progress { background: rgba(255, 255, 255, .18); }
.stage-wrap .progress i { background: var(--dga-green); }
.stage-wrap input[type="checkbox"] { accent-color: var(--dga-green); }

/* ---------- tools on the current screen ---------- */
.wg-bar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 16px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, .08);
}
.wg-chip {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(255, 255, 255, .08);
  border: 1px solid rgba(255, 255, 255, .14);
  color: #eef0fb;
  border-radius: 999px; padding: 4px 6px 4px 11px; cursor: pointer;
  font-size: 12.5px; white-space: nowrap;
}
.wg-chip:hover { background: rgba(255, 255, 255, .16); }
.wg-chip.sel { border-color: var(--dga-blue); background: rgba(29, 154, 242, .22); }
.wg-chip.off { opacity: .5; }
.wg-chip .sw {
  width: 26px; height: 15px; border-radius: 999px; position: relative; flex: none;
  background: rgba(255, 255, 255, .24); transition: background .15s ease;
}
.wg-chip .sw::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 11px; height: 11px; border-radius: 50%; background: #fff; transition: transform .15s ease;
}
.wg-chip.on .sw { background: var(--dga-green); }
.wg-chip.on .sw::after { transform: translateX(11px); }
.wg-bar .btn { padding: 5px 11px; font-size: 12.5px; }

#insp-toggle { display: none; }
@media (max-width: 880px) { #insp-toggle { display: inline-flex; } }

.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tpl-card {
  border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px;
  background: var(--field); cursor: pointer; text-align: start;
}
.tpl-card:hover { border-color: var(--accent-soft); }
.tpl-card.sel { border-color: var(--accent-soft); background: var(--sel-bg); }
.tpl-card > div { font-size: 12.5px; }
.tpl-card .frame {
  background: #12102e; border-radius: 6px; position: relative; overflow: hidden; margin-bottom: 8px;
}
.tpl-card .frame i { position: absolute; border-radius: 2px; display: block; }

/* ---------- layout zones ---------- */
.zone-layer { z-index: 2; pointer-events: none; }
.zone {
  position: absolute;
  border: 1px dashed rgba(120, 150, 240, .55);
  border-radius: 4px;
  background: rgba(29, 154, 242, .05);
}
.zone.hot { border-color: var(--dga-green); background: rgba(28, 193, 130, .16); border-style: solid; }
.zone-tag {
  position: absolute; top: 0; inset-inline-start: 0;
  background: rgba(20, 16, 54, .72); color: #cfd6ff; border-radius: 0 0 4px 0;
  font-family: var(--sans); white-space: nowrap;
}
.zone.hot .zone-tag { background: var(--dga-green); color: #0b2018; }

/* ---------- entrance animations ---------- */
@keyframes wg-fade { from { opacity: 0; } }
@keyframes wg-rise { from { opacity: 0; transform: translateY(6%); } }
@keyframes wg-slide { from { opacity: 0; transform: translateX(-6%); } }
@keyframes wg-zoom { from { opacity: 0; transform: scale(.94); } }
@keyframes wg-sweepIn { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }

.zone-chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; font-size: 12px; color: var(--muted); background: var(--field);
}
.rows { display: flex; flex-direction: column; gap: 6px; }
.rows .row-item {
  display: flex; gap: 6px; align-items: center;
  background: var(--field); border: 1px solid var(--line-soft);
  border-radius: var(--r-s); padding: 6px;
}
.rows .row-item input, .rows .row-item select { min-width: 0; }

<script>
/* The page's own source, captured before the app rewrites the DOM.
   Exporting a screen as a standalone site reuses it verbatim. */
const APP_SOURCE = "<!doctype html>\n" + document.documentElement.outerHTML;


/* ============================================================
   QR encoder — byte mode, ECC level L/M, versions 1..20.
   Written against ISO/IEC 18004. Returns a boolean matrix.
   ============================================================ */
const QR = (() => {
  const BLOCKS = {
    L: [[[1,26,19]],[[1,44,34]],[[1,70,55]],[[1,100,80]],[[1,134,108]],[[2,86,68]],[[2,98,78]],[[2,121,97]],[[2,146,116]],[[2,86,68],[2,87,69]],[[4,101,81]],[[2,116,92],[2,117,93]],[[4,133,107]],[[3,145,115],[1,146,116]],[[5,109,87],[1,110,88]],[[5,122,98],[1,123,99]],[[1,135,107],[5,136,108]],[[5,150,120],[1,151,121]],[[3,141,113],[4,142,114]],[[3,135,107],[5,136,108]]],
    M: [[[1,26,16]],[[1,44,28]],[[1,70,44]],[[2,50,32]],[[2,67,43]],[[4,43,27]],[[4,49,31]],[[2,60,38],[2,61,39]],[[3,58,36],[2,59,37]],[[4,69,43],[1,70,44]],[[1,80,50],[4,81,51]],[[6,58,36],[2,59,37]],[[8,59,37],[1,60,38]],[[4,64,40],[5,65,41]],[[5,65,41],[5,66,42]],[[7,73,45],[3,74,46]],[[10,74,46],[1,75,47]],[[9,69,43],[4,70,44]],[[3,70,44],[11,71,45]],[[3,67,41],[13,68,42]]]
  };
  const ALIGN = [[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],[6,30,56,82],[6,30,58,86],[6,34,62,90]];
  const ECL_BITS = { L: 1, M: 0 };

  // Galois field 2^8, primitive polynomial 0x11D
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (() => {
    let x = 1;
    for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  const gmul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];

  function generatorPoly(deg) {
    let poly = [1];
    for (let i = 0; i < deg; i++) {
      const next = new Array(poly.length + 1).fill(0);
      for (let j = 0; j < poly.length; j++) {
        next[j] ^= gmul(poly[j], 1);
        next[j + 1] ^= gmul(poly[j], EXP[i]);
      }
      poly = next;
    }
    return poly;
  }

  function ecBytes(data, ecLen) {
    const gen = generatorPoly(ecLen);
    const res = new Array(data.length + ecLen).fill(0);
    for (let i = 0; i < data.length; i++) res[i] = data[i];
    for (let i = 0; i < data.length; i++) {
      const factor = res[i];
      if (factor === 0) continue;
      for (let j = 0; j < gen.length; j++) res[i + j] ^= gmul(gen[j], factor);
    }
    return res.slice(data.length);
  }

  const utf8 = (str) => Array.from(new TextEncoder().encode(str));

  function pickVersion(byteLen, ecl) {
    for (let v = 1; v <= 20; v++) {
      const groups = BLOCKS[ecl][v - 1];
      let capacity = 0;
      for (const [count, , dataCw] of groups) capacity += count * dataCw;
      const header = 4 + (v < 10 ? 8 : 16);
      if (capacity * 8 >= header + byteLen * 8) return v;
    }
    return null;
  }

  function buildCodewords(bytes, version, ecl) {
    const groups = BLOCKS[ecl][version - 1];
    let totalData = 0;
    for (const [count, , dataCw] of groups) totalData += count * dataCw;

    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
    push(4, 4);                                     // byte mode
    push(bytes.length, version < 10 ? 8 : 16);      // character count
    for (const b of bytes) push(b, 8);
    for (let i = 0; i < 4 && bits.length < totalData * 8; i++) bits.push(0); // terminator
    while (bits.length % 8) bits.push(0);

    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let b = 0;
      for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      data.push(b);
    }
    const PAD = [0xec, 0x11];
    let p = 0;
    while (data.length < totalData) data.push(PAD[p++ % 2]);

    // split into blocks, compute EC, interleave
    const dataBlocks = [], ecBlocks = [];
    let offset = 0;
    for (const [count, totalCw, dataCw] of groups) {
      for (let i = 0; i < count; i++) {
        const blk = data.slice(offset, offset + dataCw);
        offset += dataCw;
        dataBlocks.push(blk);
        ecBlocks.push(ecBytes(blk, totalCw - dataCw));
      }
    }
    const out = [];
    const maxData = Math.max(...dataBlocks.map(b => b.length));
    for (let i = 0; i < maxData; i++)
      for (const blk of dataBlocks) if (i < blk.length) out.push(blk[i]);
    const maxEc = Math.max(...ecBlocks.map(b => b.length));
    for (let i = 0; i < maxEc; i++)
      for (const blk of ecBlocks) if (i < blk.length) out.push(blk[i]);
    return out;
  }

  const MASKS = [
    (i, j) => (i + j) % 2 === 0,
    (i) => i % 2 === 0,
    (i, j) => j % 3 === 0,
    (i, j) => (i + j) % 3 === 0,
    (i, j) => (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0,
    (i, j) => ((i * j) % 2) + ((i * j) % 3) === 0,
    (i, j) => (((i * j) % 2) + ((i * j) % 3)) % 2 === 0,
    (i, j) => (((i + j) % 2) + ((i * j) % 3)) % 2 === 0
  ];

  function bch(value, poly, polyBits) {
    let v = value << (polyBits - 1);
    while (bitLength(v) >= polyBits) v ^= poly << (bitLength(v) - polyBits);
    return (value << (polyBits - 1)) | v;
  }
  const bitLength = (v) => { let n = 0; while (v !== 0) { n++; v >>>= 1; } return n; };

  function makeMatrix(version, ecl, codewords, mask) {
    const size = version * 4 + 17;
    const m = Array.from({ length: size }, () => new Array(size).fill(null)); // null = free
    const set = (r, c, v) => { m[r][c] = v; };

    const finder = (r, c) => {
      for (let dr = -1; dr <= 7; dr++) for (let dc = -1; dc <= 7; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
        const inner = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6;
        const dark = inner && ((dr === 0 || dr === 6 || dc === 0 || dc === 6) ||
                               (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4));
        set(rr, cc, dark);
      }
    };
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);

    for (let i = 8; i < size - 8; i++) { // timing
      const dark = i % 2 === 0;
      set(6, i, dark); set(i, 6, dark);
    }

    for (const r of ALIGN[version - 1]) for (const c of ALIGN[version - 1]) {
      if ((r <= 8 && c <= 8) || (r <= 8 && c >= size - 9) || (r >= size - 9 && c <= 8)) continue;
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++)
        set(r + dr, c + dc, Math.max(Math.abs(dr), Math.abs(dc)) !== 1);
    }

    set(size - 8, 8, true); // dark module

    // reserve format areas
    const reserved = [];
    for (let i = 0; i < 9; i++) { reserved.push([8, i], [i, 8]); }
    for (let i = 0; i < 8; i++) { reserved.push([8, size - 1 - i], [size - 1 - i, 8]); }
    for (const [r, c] of reserved) if (m[r][c] === null) m[r][c] = false;

    if (version >= 7) {
      const vinfo = bch(version, 0x1f25, 13);
      for (let i = 0; i < 18; i++) {
        const bit = ((vinfo >> i) & 1) === 1;
        const r = Math.floor(i / 3), c = i % 3;
        set(size - 11 + c, r, bit); set(r, size - 11 + c, bit);
      }
    }

    // mark which cells are function modules (before data placement)
    const isFunction = m.map(row => row.map(v => v !== null));

    // data placement, upward/downward zigzag from bottom-right
    let bitIndex = 0;
    const nextBit = () => {
      if (bitIndex >= codewords.length * 8) return false;
      const b = (codewords[bitIndex >> 3] >> (7 - (bitIndex & 7))) & 1;
      bitIndex++;
      return b === 1;
    };
    let upward = true;
    for (let col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--; // skip vertical timing column
      for (let k = 0; k < size; k++) {
        const row = upward ? size - 1 - k : k;
        for (let d = 0; d < 2; d++) {
          const c = col - d;
          if (isFunction[row][c]) continue;
          let bit = nextBit();
          if (MASKS[mask](row, c)) bit = !bit;
          m[row][c] = bit;
        }
      }
      upward = !upward;
    }

    // format information
    const fmt = bch((ECL_BITS[ecl] << 3) | mask, 0x537, 11) ^ 0x5412;
    for (let i = 0; i < 15; i++) {
      const bit = ((fmt >> i) & 1) === 1;
      // column 8, top-left downward then bottom-left upward
      if (i < 6) set(i, 8, bit);
      else if (i < 8) set(i + 1, 8, bit);
      else set(size - 15 + i, 8, bit);
      // row 8, right side then top-left
      if (i < 8) set(8, size - 1 - i, bit);
      else if (i === 8) set(8, 7, bit);
      else set(8, 14 - i, bit);
    }
    return { matrix: m.map(r => r.map(Boolean)), isFunction };
  }

  function penalty(m) {
    const n = m.length;
    let score = 0;
    // rule 1: runs of 5+
    for (let i = 0; i < n; i++) {
      for (const line of [m[i], m.map(r => r[i])]) {
        let run = 1;
        for (let j = 1; j < n; j++) {
          if (line[j] === line[j - 1]) run++;
          else { if (run >= 5) score += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) score += 3 + (run - 5);
      }
    }
    // rule 2: 2x2 blocks
    for (let i = 0; i < n - 1; i++) for (let j = 0; j < n - 1; j++)
      if (m[i][j] === m[i][j + 1] && m[i][j] === m[i + 1][j] && m[i][j] === m[i + 1][j + 1]) score += 3;
    // rule 3: finder-like patterns
    const pat1 = [true, false, true, true, true, false, true, false, false, false, false];
    const pat2 = [false, false, false, false, true, false, true, true, true, false, true];
    const match = (line, start, pat) => pat.every((v, k) => line[start + k] === v);
    for (let i = 0; i < n; i++) {
      const row = m[i], col = m.map(r => r[i]);
      for (let j = 0; j + 11 <= n; j++) {
        if (match(row, j, pat1) || match(row, j, pat2)) score += 40;
        if (match(col, j, pat1) || match(col, j, pat2)) score += 40;
      }
    }
    // rule 4: dark module balance
    let dark = 0;
    for (const row of m) for (const v of row) if (v) dark++;
    const ratio = (dark * 100) / (n * n);
    score += Math.floor(Math.abs(ratio - 50) / 5) * 10;
    return score;
  }

  /** Returns { size, matrix } where matrix[row][col] is true for dark modules. */
  function encode(text, ecl = 'M') {
    const bytes = utf8(String(text));
    const version = pickVersion(bytes.length, ecl);
    if (!version) throw new Error('QR: content too long');
    const codewords = buildCodewords(bytes, version, ecl);
    let best = null, bestScore = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      const { matrix } = makeMatrix(version, ecl, codewords, mask);
      const s = penalty(matrix);
      if (s < bestScore) { bestScore = s; best = matrix; }
    }
    return { size: best.length, matrix: best, version };
  }

  /** Renders to an SVG path string sized to `modules` units, with quiet zone. */
  function toSvg(text, opts = {}) {
    const { ecl = 'M', quiet = 2, dark = '#000', light = '#fff', radius = 0 } = opts;
    const { size, matrix } = encode(text, ecl);
    const total = size + quiet * 2;
    let path = '';
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++)
      if (matrix[r][c]) path += `M${c + quiet} ${r + quiet}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet">` +
      `<rect width="${total}" height="${total}" rx="${radius}" fill="${light}"/>` +
      `<path d="${path}" fill="${dark}"/></svg>`;
  }

  return { encode, toSvg };
})();

if (typeof module !== 'undefined') module.exports = QR;

let fontSig = null;
function applyBrandFonts(state) {
  const fonts = (state && state.settings && state.settings.brand && state.settings.brand.fonts) || [];
  const sig = fonts.map((f) => f.family + f.weight + (f.src || "").length).join("|");
  if (sig === fontSig) return;                 // font files are large; only rewrite on change
  fontSig = sig;
  let tag = document.getElementById("brand-fonts");
  if (!tag) { tag = document.createElement("style"); tag.id = "brand-fonts"; document.head.append(tag); }
  tag.textContent = fonts
    .map((f) => `@font-face{font-family:"${f.family}";src:url(${f.src});font-weight:${f.weight || 400};font-display:swap;}`)
    .join("\n");
}

/* ------------------------------------------------------------
   Prayer times — Umm al-Qura convention (Fajr 18.5°, Isha 90 min
   after Maghrib), Asr at shadow factor 1. Computed on the device,
   so a screen with no network still shows the right times.
   ------------------------------------------------------------ */
const PRAYER_NAMES = {
  en: { fajr: "Fajr", sunrise: "Sunrise", dhuhr: "Dhuhr", asr: "Asr", maghrib: "Maghrib", isha: "Isha" },
  ar: { fajr: "الفجر", sunrise: "الشروق", dhuhr: "الظهر", asr: "العصر", maghrib: "المغرب", isha: "العشاء" }
};

function prayerTimes(date, lat, lon, tzOffsetHours, opts = {}) {
  const fajrAngle = opts.fajrAngle ?? 18.5;
  const ishaGap = opts.ishaGap ?? 90;            // minutes after Maghrib
  const asrFactor = opts.asrFactor ?? 1;         // 1 = Shafi'i, 2 = Hanafi
  const rad = Math.PI / 180;

  // Julian day at 00:00 UT of the local date
  const y = date.y, m = date.mo, d = date.d;
  let yy = y, mm = m;
  if (mm <= 2) { yy -= 1; mm += 12; }
  const A = Math.floor(yy / 100);
  const B = 2 - A + Math.floor(A / 4);
  const jd = Math.floor(365.25 * (yy + 4716)) + Math.floor(30.6001 * (mm + 1)) + d + B - 1524.5 - tzOffsetHours / 24;

  const sunPosition = (jdate) => {
    const D = jdate - 2451545.0;
    const g = (357.529 + 0.98560028 * D) % 360;
    const q = (280.459 + 0.98564736 * D) % 360;
    const L = (q + 1.915 * Math.sin(g * rad) + 0.020 * Math.sin(2 * g * rad)) % 360;
    const e = 23.439 - 0.00000036 * D;
    const decl = Math.asin(Math.sin(e * rad) * Math.sin(L * rad)) / rad;
    let ra = Math.atan2(Math.cos(e * rad) * Math.sin(L * rad), Math.cos(L * rad)) / rad;
    ra = ((ra % 360) + 360) % 360;
    const eqt = q / 15 - ra / 15;
    return { decl, eqt: ((eqt + 12) % 24) - 12 };
  };

  const { decl, eqt } = sunPosition(jd + 0.5);
  const dhuhr = 12 - eqt - lon / 15 + tzOffsetHours;

  const hourAngle = (altitude) => {
    const cosH = (Math.sin(altitude * rad) - Math.sin(decl * rad) * Math.sin(lat * rad)) /
      (Math.cos(decl * rad) * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null;       // sun never reaches that altitude
    return Math.acos(cosH) / rad / 15;
  };

  const asrAltitude = Math.atan(1 / (asrFactor + Math.abs(Math.tan((lat - decl) * rad)))) / rad;
  const hSunrise = hourAngle(-0.833);
  const hFajr = hourAngle(-fajrAngle);
  const hAsr = hourAngle(asrAltitude);

  const out = {
    fajr: hFajr === null ? null : dhuhr - hFajr,
    sunrise: hSunrise === null ? null : dhuhr - hSunrise,
    dhuhr,
    asr: hAsr === null ? null : dhuhr + hAsr,
    maghrib: hSunrise === null ? null : dhuhr + hSunrise
  };
  out.isha = out.maghrib === null ? null : out.maghrib + ishaGap / 60;
  for (const k in out) if (out[k] !== null) out[k] = ((out[k] % 24) + 24) % 24;
  return out;
}

const fmtPrayer = (hours, h12, loc) => {
  if (hours === null || hours === undefined) return "—";
  let hh = Math.floor(hours);
  let mm = Math.round((hours - hh) * 60);
  if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }
  let suffix = "";
  if (h12) {
    suffix = " " + (hh >= 12 ? (loc === "ar" ? "م" : "PM") : (loc === "ar" ? "ص" : "AM"));
    hh = hh % 12 || 12;
  }
  const s = (h12 ? hh : String(hh).padStart(2, "0")) + ":" + String(mm).padStart(2, "0");
  return (loc === "ar" ? toArabicDigits(s) : s) + suffix;
};

function tzParts(tz, date = new Date()) {
  const p = {};
  for (const part of tzFormatter(tz).formatToParts(date)) p[part.type] = part.value;
  const hour = p.hour === "24" ? 0 : +p.hour;
  return {
    y: +p.year, mo: +p.month, d: +p.day,
    h: hour, mi: +p.minute, s: +p.second,
    dow: DOW[p.weekday] ?? 0,

  const p = tzParts(tz, date);

function zonedToEpoch(tz, y, mo, d, h = 0, mi = 0, s = 0) {
  const guess = Date.UTC(y, mo - 1, d, h, mi, s);
  const p = tzParts(tz, new Date(guess));
  const seen = Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s);
  return guess - (seen - guess);
}
