<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Signage Desk · Innovation Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d9a84e'/%3E%3Crect x='8' y='10' width='16' height='12' rx='1.5' fill='none' stroke='%230c1618' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root {
  --canvas: #0c1618;
  --wall: #0a1214;
  --panel: #122023;
  --raise: #182d31;
  --raise-2: #20393e;
  --line: #23393e;
  --line-soft: #1a2c30;
  --text: #e8f1f0;
  --muted: #8ba4a7;
  --dim: #7b9897;
  --brass: #d9a84e;
  --brass-deep: #b98b34;
  --live: #4fd1a5;
  --warn: #e4796b;
  --focus: #6fd6f2;
  --rail-w: 232px;
  --insp-w: 336px;
  --top-h: 62px;
  --r-s: 6px;
  --r-m: 10px;
  --r-l: 16px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --arabic: "Segoe UI", "Noto Naskh Arabic", "Dubai", Tahoma, sans-serif;
  --shadow: 0 18px 48px -24px rgba(0, 0, 0, .9);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--canvas);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body[dir="rtl"] { font-family: var(--arabic); }

button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--brass); color: #10191a; }

/* ---------- app frame ---------- */
#app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--insp-w);
  grid-template-rows: var(--top-h) minmax(0, 1fr);
  grid-template-areas: "top top top" "rail stage insp";
  height: 100vh;
}

/* ---------- top bar ---------- */
.top {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  overflow: hidden;
  padding-inline: 16px;
  background: linear-gradient(180deg, #142427, #0f1e21);
  border-bottom: 1px solid var(--line);
  z-index: 30;
}

.brandmark {
  display: flex;
  align-items: center;
  gap: 10px;
  width: calc(var(--rail-w) - 32px);
  flex: none;
}

.brandmark .glyph {
  width: 30px; height: 30px;
  border-radius: 7px;
  background: linear-gradient(150deg, var(--brass), #8a6320);
  position: relative;
  flex: none;
}
.brandmark .glyph::after {
  content: "";
  position: absolute;
  inset: 8px 7px;
  border: 1.5px solid rgba(12, 22, 24, .85);
  border-radius: 2px;
}
.brandmark b { font-weight: 600; letter-spacing: -.2px; font-size: 14px; display: block; }
.brandmark span { color: var(--dim); font-size: 11.5px; display: block; margin-top: -2px; }

.screen-picker {
  display: flex;
  max-width: 40vw;
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
  gap: 2px;
  background: var(--wall);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  padding: 3px;
}
.screen-picker button {
  background: none;
  border: 0;
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 7px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}
.screen-picker button:hover { color: var(--text); }
.screen-picker button[aria-pressed="true"] {
  background: var(--raise);
  color: var(--text);
  box-shadow: inset 0 0 0 1px var(--line);
}
.screen-picker .ratio { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.on { background: var(--live); box-shadow: 0 0 0 3px rgba(79, 209, 165, .16); }
.dot.off { background: var(--warn); }

.status-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px 5px 10px;
  color: var(--muted);
  background: rgba(0, 0, 0, .2);
  white-space: nowrap;
}

.top .spacer { flex: 1; }

/* ---------- buttons ---------- */
.btn {
  background: var(--raise);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 14px;
  border-radius: var(--r-s);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background .12s ease, border-color .12s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--raise-2); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--raise); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--text); background: var(--raise); }
.btn.primary {
  background: linear-gradient(180deg, var(--brass), var(--brass-deep));
  border-color: #8d6a25;
  color: #14211f;
  font-weight: 600;
}
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--warn); }
.btn.danger:hover { background: rgba(228, 121, 107, .12); }
.btn[disabled] { opacity: .42; pointer-events: none; }
.btn.sm { padding: 5px 9px; font-size: 12.5px; }
.btn.icon { padding: 7px; }
.pulse-live { animation: pulseLive 2.4s ease-in-out infinite; }
.unpub-dot { width: 7px; height: 7px; border-radius: 50%; background: #15211f; flex: none; }
@keyframes pulseLive { 50% { box-shadow: 0 0 0 6px rgba(217, 168, 78, 0); } }

/* ---------- rail ---------- */
.rail {
  grid-area: rail;
  background: var(--panel);
  border-inline-end: 1px solid var(--line);
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow-y: auto;
}
.rail button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  background: none;
  border: 0;
  color: var(--muted);
  padding: 9px 11px;
  border-radius: var(--r-s);
  cursor: pointer;
  text-align: start;
  position: relative;
}
.rail button:hover { background: var(--raise); color: var(--text); }
.rail button[aria-current="page"] { background: var(--raise); color: var(--text); }
.rail button[aria-current="page"]::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 9px; bottom: 9px;
  width: 2px;
  background: var(--brass);
  border-radius: 2px;
}
.rail svg { width: 17px; height: 17px; flex: none; opacity: .9; }
.rail .count {
  margin-inline-start: auto;
  font-size: 11px;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.rail .foot {
  margin-top: auto;
  padding: 10px 11px 2px;
  border-top: 1px solid var(--line-soft);
  color: var(--dim);
  font-size: 11.5px;
  line-height: 1.6;
}
.rail .foot code { color: var(--muted); font-size: 11px; }

/* ---------- stage ---------- */
.stage-wrap {
  grid-area: stage;
  background:
    radial-gradient(120% 80% at 50% 0%, #12211f 0%, var(--wall) 62%),
    var(--wall);
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}
.stage-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line-soft);
  color: var(--muted);
  flex: none;
}
.stage-head .title { color: var(--text); font-weight: 600; }
.stage-head .meta { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.stage-head .sp { flex: 1; }

.stage-area {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 26px 30px;
  position: relative;
}

.screen-frame { position: relative; }
.screen-frame .tick {
  position: absolute;
  color: var(--dim);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  letter-spacing: .02em;
}
.screen-frame .tick.top { top: -20px; inset-inline-start: 0; inset-inline-end: 0; text-align: center; }
.screen-frame .tick.top::before,
.screen-frame .tick.top::after {
  content: "";
  position: absolute;
  top: 50%;
  width: calc(50% - 46px);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line));
}
.screen-frame .tick.top::before { inset-inline-start: 0; }
.screen-frame .tick.top::after { inset-inline-end: 0; transform: scaleX(-1); }
.screen-frame .tick.side {
  inset-inline-end: -14px;
  top: 50%;
  transform: translate(50%, -50%) rotate(90deg);
}

.screen {
  position: relative;
  background: #000;
  overflow: hidden;
  box-shadow:
    0 0 0 1px #2c4145,
    0 0 0 8px #0e1a1c,
    0 0 0 9px #223339,
    0 40px 80px -40px rgba(0, 0, 0, .95),
    0 0 120px -40px rgba(79, 209, 165, .18);
}
.screen.is-drop { box-shadow: 0 0 0 2px var(--brass), 0 0 0 9px #0e1a1c; }
.screen-reflection {
  position: absolute;
  inset-inline: 8px;
  top: 100%;
  height: 46px;
  background: linear-gradient(180deg, rgba(120, 190, 190, .10), transparent 75%);
  filter: blur(6px);
  pointer-events: none;
}

/* design-space host: content is authored at real screen coordinates and scaled */
.design {
  position: absolute;
  top: 0;
  left: 0;
  right: auto;
  transform-origin: top left;
  direction: ltr;
}

.layer { position: absolute; inset: 0; }
.layer img, .layer video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.layer.fade { transition: opacity var(--tdur, 700ms) ease; }

.guides { position: absolute; inset: 0; pointer-events: none; }
.guides .safe { position: absolute; inset: 5%; border: 1px dashed rgba(217, 168, 78, .38); }
.guides .cx, .guides .cy { position: absolute; background: rgba(111, 214, 242, .30); }
.guides .cx { left: 50%; top: 0; bottom: 0; width: 1px; }
.guides .cy { top: 50%; left: 0; right: 0; height: 1px; }
.guides .grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(255, 255, 255, .07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, .07) 1px, transparent 1px);
}

/* widgets */
.wg { position: absolute; display: flex; overflow: hidden; }
.wg-inner { width: 100%; height: 100%; display: flex; }
.wg .wg-body { width: 100%; display: flex; flex-direction: column; justify-content: center; }
.wg.sel { outline: 2px solid var(--brass); outline-offset: 0; }
.wg.editable { cursor: move; }
.wg.locked { cursor: default; }
.handle {
  position: absolute;
  width: 11px; height: 11px;
  background: var(--brass);
  border: 1.5px solid #101c1e;
  border-radius: 2px;
}
.handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
.handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
.handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
.handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }

.cd-row { display: flex; width: 100%; }
.cd-cell { flex: 1; display: flex; flex-direction: column; align-items: center; }
.cd-num { font-variant-numeric: tabular-nums; line-height: 1.02; }
.cd-lab { opacity: .62; line-height: 1.6; }

.empty-screen {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 8px;
  color: #3e565a;
  text-align: center;
  padding: 8%;
}
.empty-screen b { color: #6d8b8e; font-weight: 500; }

/* transport */
.transport {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px 14px;
  border-top: 1px solid var(--line-soft);
  background: rgba(8, 16, 17, .55);
}
.transport .now {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  overflow: hidden;
}
.transport .now b { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress { flex: 1; height: 3px; background: var(--line-soft); border-radius: 2px; overflow: hidden; min-width: 60px; }
.progress i { display: block; height: 100%; background: var(--brass); width: 0; }

/* ---------- inspector ---------- */
.insp {
  grid-area: insp;
  background: var(--panel);
  border-inline-start: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.insp-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-soft);
  flex: none;
}
.insp-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.insp-head .sp { flex: 1; }
.insp-body { overflow-y: auto; padding: 12px 14px 28px; flex: 1; }

.field { margin-bottom: 12px; }
.field > label, .flabel {
  display: block;
  color: var(--muted);
  margin-bottom: 5px;
  font-size: 12.5px;
}
input[type="text"], input[type="number"], input[type="url"], input[type="date"],
input[type="time"], input[type="datetime-local"], select, textarea {
  width: 100%;
  background: var(--wall);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 7px 9px;
  color: var(--text);
}
input[type="color"] {
  width: 100%; height: 32px; padding: 2px;
  background: var(--wall); border: 1px solid var(--line); border-radius: var(--r-s); cursor: pointer;
}
textarea { resize: vertical; min-height: 64px; }
input[type="range"] { width: 100%; accent-color: var(--brass); }
input[type="checkbox"] { accent-color: var(--brass); width: 15px; height: 15px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 12px center, right 7px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-inline-end: 24px; }
body[dir="rtl"] select { background-position: left 7px center, left 12px center; background-image: linear-gradient(135deg, transparent 50%, var(--muted) 50%), linear-gradient(45deg, var(--muted) 50%, transparent 50%); padding-inline-end: 9px; padding-inline-start: 24px; }

.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.inline { display: flex; align-items: center; gap: 8px; }
.inline label { margin: 0; }
.sect {
  border-top: 1px solid var(--line-soft);
  margin: 16px -14px 12px;
  padding: 12px 14px 0;
}
.sect > h3 {
  margin: 0 0 10px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}
.hint { color: var(--dim); font-size: 12px; line-height: 1.5; }

.seg { display: flex; background: var(--wall); border: 1px solid var(--line); border-radius: var(--r-s); padding: 2px; gap: 2px; }
.seg button {
  flex: 1;
  background: none; border: 0; color: var(--muted);
  padding: 5px 4px; border-radius: 4px; cursor: pointer; font-size: 12.5px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--raise-2); color: var(--text); }

.align-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.align-grid button {
  height: 30px; border-radius: 5px; border: 1px solid var(--line);
  background: var(--wall); cursor: pointer; display: flex; padding: 4px;
}
.align-grid button:hover { border-color: var(--brass); }
.align-grid i { width: 9px; height: 5px; background: var(--muted); border-radius: 1px; display: block; }
.align-grid button:hover i { background: var(--brass); }

/* ---------- lists & cards ---------- */
.panel-list { display: flex; flex-direction: column; gap: 6px; }
.item {
  display: flex; align-items: center; gap: 10px;
  background: var(--wall);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-s);
  padding: 7px 9px;
  cursor: pointer;
}
.item:hover { border-color: var(--line); }
.item.sel { border-color: var(--brass); background: #17262a; }
.item .thumb {
  width: 42px; height: 30px; border-radius: 3px; background: #000 center/cover no-repeat;
  flex: none; position: relative; overflow: hidden;
}
.item .thumb .vid {
  position: absolute; inset-inline-end: 2px; bottom: 2px;
  background: rgba(0, 0, 0, .7); border-radius: 2px; padding: 0 3px; font-size: 9px; color: #d5e5e4;
}
.item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.item .grip { color: var(--dim); cursor: grab; touch-action: none; padding: 2px; }
.item.dragging { opacity: .55; border-color: var(--brass); }
.item.hidden-w .nm { opacity: .45; text-decoration: line-through; }

.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.card {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-m);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .12s ease;
}
.card:hover { border-color: var(--line); }
.card.sel { border-color: var(--brass); }
.card .ph {
  aspect-ratio: 16 / 10;
  background: #000 center/contain no-repeat;
  position: relative;
  border-bottom: 1px solid var(--line-soft);
  background-image:
    linear-gradient(45deg, #101b1d 25%, transparent 25%, transparent 75%, #101b1d 75%),
    linear-gradient(45deg, #101b1d 25%, transparent 25%, transparent 75%, #101b1d 75%);
  background-size: 14px 14px;
  background-position: 0 0, 7px 7px;
}
.card .ph .img { position: absolute; inset: 0; background: center/contain no-repeat; }
.card .ph .tag {
  position: absolute; top: 6px; inset-inline-start: 6px;
  background: rgba(6, 12, 13, .78); border-radius: 4px; padding: 1px 6px; font-size: 10.5px; color: #cfe2e1;
}
.card .cap { padding: 8px 10px; }
.card .cap .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .cap .sub { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.page { padding: 20px 24px 40px; overflow-y: auto; height: 100%; }
.page h1 { font-size: 19px; font-weight: 600; margin: 0 0 3px; letter-spacing: -.2px; }
.page .lede { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }
.page-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head .sp { flex: 1; }

.screen-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.screen-card {
  background: var(--panel); border: 1px solid var(--line-soft);
  border-radius: var(--r-l); padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.screen-card.active { border-color: var(--brass); }
.screen-card .mini {
  background: #000; border: 1px solid var(--line); border-radius: 4px;
  align-self: center; position: relative; overflow: hidden;
}
.screen-card .url {
  display: flex; align-items: center; gap: 6px;
  background: var(--wall); border: 1px solid var(--line-soft); border-radius: var(--r-s);
  padding: 6px 8px; color: var(--muted); font-size: 12px; overflow: hidden;
}
.screen-card .url code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: start; }

.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  text-align: start; color: var(--muted); font-weight: 500; font-size: 12.5px;
  padding: 6px 10px; border-bottom: 1px solid var(--line);
}
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.tbl tr.off td { opacity: .5; }
.tbl .now-badge { color: var(--live); font-size: 11.5px; }

.drop {
  border: 1.5px dashed var(--line);
  border-radius: var(--r-l);
  padding: 26px;
  text-align: center;
  color: var(--muted);
  background: rgba(0, 0, 0, .15);
}
.drop.hot { border-color: var(--brass); color: var(--text); background: rgba(217, 168, 78, .07); }

.empty-state { padding: 34px 20px; text-align: center; color: var(--dim); }
.empty-state b { display: block; color: var(--muted); font-weight: 500; margin-bottom: 4px; }

/* ---------- modal & toast ---------- */
.scrim {
  position: fixed; inset: 0; background: rgba(4, 9, 10, .72);
  display: grid; place-items: center; z-index: 60; padding: 20px;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-l); box-shadow: var(--shadow);
  width: min(560px, 100%); max-height: 86vh; display: flex; flex-direction: column;
}
.modal.wide { width: min(min(1100px, 94vw), 100%); }
.modal header { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; }
.modal header h2 { margin: 0; font-size: 15px; font-weight: 600; }
.modal header .sp { flex: 1; }
.modal .mbody { padding: 16px; overflow: auto; }
.modal footer { padding: 12px 16px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; justify-content: flex-end; }

#toasts {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 90; align-items: center;
}
.toast {
  background: #1a2e32; border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 9px;
}
.toast.err { border-color: var(--warn); color: #ffd9d3; }

/* ---------- display page ---------- */
body.display-mode { background: #000; cursor: none; overflow: hidden; }
#display-root { position: fixed; inset: 0; background: #000; overflow: hidden; }
#display-root .screen { box-shadow: none; }
#conn-flag {
  position: fixed; top: 0; inset-inline-start: 0;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--warn); opacity: 0; transition: opacity .4s ease; pointer-events: none;
}
#conn-flag.show { opacity: .55; }

@media (max-width: 1180px) {
  #app { grid-template-columns: 64px minmax(0, 1fr) 300px; }
  .rail button span.lbl, .rail .foot, .brandmark b, .brandmark span { display: none; }
  .rail button { justify-content: center; }
  .brandmark { width: 42px; }
}
@media (max-width: 880px) {
  #app { grid-template-columns: 64px minmax(0, 1fr); grid-template-areas: "top top" "rail stage"; }
  .insp { position: fixed; inset-block: var(--top-h) 0; inset-inline-end: 0; width: 300px; z-index: 40; box-shadow: var(--shadow); transform: translateX(100%); transition: transform .18s ease; }
  body[dir="rtl"] .insp { transform: translateX(-100%); }
  .insp.open { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

<script>
/* ============================================================
   QR encoder — byte mode, ECC level L/M, versions 1..20.
   Written against ISO/IEC 18004. Returns a boolean matrix.
   ============================================================ */
const QR = (() => {
  const BLOCKS = {
    L: [[[1,26,19]],[[1,44,34]],[[1,70,55]],[[1,100,80]],[[1,134,108]],[[2,86,68]],[[2,98,78]],[[2,121,97]],[[2,146,116]],[[2,86,68],[2,87,69]],[[4,101,81]],[[2,116,92],[2,117,93]],[[4,133,107]],[[3,145,115],[1,146,116]],[[5,109,87],[1,110,88]],[[5,122,98],[1,123,99]],[[1,135,107],[5,136,108]],[[5,150,120],[1,151,121]],[[3,141,113],[4,142,114]],[[3,135,107],[5,136,108]]],
    M: [[[1,26,16]],[[1,44,28]],[[1,70,44]],[[2,50,32]],[[2,67,43]],[[4,43,27]],[[4,49,31]],[[2,60,38],[2,61,39]],[[3,58,36],[2,59,37]],[[4,69,43],[1,70,44]],[[1,80,50],[4,81,51]],[[6,58,36],[2,59,37]],[[8,59,37],[1,60,38]],[[4,64,40],[5,65,41]],[[5,65,41],[5,66,42]],[[7,73,45],[3,74,46]],[[10,74,46],[1,75,47]],[[9,69,43],[4,70,44]],[[3,70,44],[11,71,45]],[[3,67,41],[13,68,42]]]
  };
  const ALIGN = [[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],[6,30,56,82],[6,30,58,86],[6,34,62,90]];
  const ECL_BITS = { L: 1, M: 0 };

  // Galois field 2^8, primitive polynomial 0x11D
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (() => {
    let x = 1;
    for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  const gmul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];

  function generatorPoly(deg) {
    let poly = [1];
    for (let i = 0; i < deg; i++) {
      const next = new Array(poly.length + 1).fill(0);
      for (let j = 0; j < poly.length; j++) {
        next[j] ^= gmul(poly[j], 1);
        next[j + 1] ^= gmul(poly[j], EXP[i]);
      }
      poly = next;
    }
    return poly;
  }

  function ecBytes(data, ecLen) {
    const gen = generatorPoly(ecLen);
    const res = new Array(data.length + ecLen).fill(0);
    for (let i = 0; i < data.length; i++) res[i] = data[i];
    for (let i = 0; i < data.length; i++) {
      const factor = res[i];
      if (factor === 0) continue;
      for (let j = 0; j < gen.length; j++) res[i + j] ^= gmul(gen[j], factor);
    }
    return res.slice(data.length);
  }

  const utf8 = (str) => Array.from(new TextEncoder().encode(str));

  function pickVersion(byteLen, ecl) {
    for (let v = 1; v <= 20; v++) {
      const groups = BLOCKS[ecl][v - 1];
      let capacity = 0;
      for (const [count, , dataCw] of groups) capacity += count * dataCw;
      const header = 4 + (v < 10 ? 8 : 16);
      if (capacity * 8 >= header + byteLen * 8) return v;
    }
    return null;
  }

  function buildCodewords(bytes, version, ecl) {
    const groups = BLOCKS[ecl][version - 1];
    let totalData = 0;
    for (const [count, , dataCw] of groups) totalData += count * dataCw;

    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
    push(4, 4);                                     // byte mode
    push(bytes.length, version < 10 ? 8 : 16);      // character count
    for (const b of bytes) push(b, 8);
    for (let i = 0; i < 4 && bits.length < totalData * 8; i++) bits.push(0); // terminator
    while (bits.length % 8) bits.push(0);

    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let b = 0;
      for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      data.push(b);
    }
    const PAD = [0xec, 0x11];
    let p = 0;
    while (data.length < totalData) data.push(PAD[p++ % 2]);

    // split into blocks, compute EC, interleave
    const dataBlocks = [], ecBlocks = [];
    let offset = 0;
    for (const [count, totalCw, dataCw] of groups) {
      for (let i = 0; i < count; i++) {
        const blk = data.slice(offset, offset + dataCw);
        offset += dataCw;
        dataBlocks.push(blk);
        ecBlocks.push(ecBytes(blk, totalCw - dataCw));
      }
    }
    const out = [];
    const maxData = Math.max(...dataBlocks.map(b => b.length));
    for (let i = 0; i < maxData; i++)
      for (const blk of dataBlocks) if (i < blk.length) out.push(blk[i]);
    const maxEc = Math.max(...ecBlocks.map(b => b.length));
    for (let i = 0; i < maxEc; i++)
      for (const blk of ecBlocks) if (i < blk.length) out.push(blk[i]);
    return out;
  }

  const MASKS = [
    (i, j) => (i + j) % 2 === 0,
    (i) => i % 2 === 0,
    (i, j) => j % 3 === 0,
    (i, j) => (i + j) % 3 === 0,
    (i, j) => (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0,
    (i, j) => ((i * j) % 2) + ((i * j) % 3) === 0,
    (i, j) => (((i * j) % 2) + ((i * j) % 3)) % 2 === 0,
    (i, j) => (((i + j) % 2) + ((i * j) % 3)) % 2 === 0
  ];

  function bch(value, poly, polyBits) {
    let v = value << (polyBits - 1);
    while (bitLength(v) >= polyBits) v ^= poly << (bitLength(v) - polyBits);
    return (value << (polyBits - 1)) | v;
  }
  const bitLength = (v) => { let n = 0; while (v !== 0) { n++; v >>>= 1; } return n; };

  function makeMatrix(version, ecl, codewords, mask) {
    const size = version * 4 + 17;
    const m = Array.from({ length: size }, () => new Array(size).fill(null)); // null = free
    const set = (r, c, v) => { m[r][c] = v; };

    const finder = (r, c) => {
      for (let dr = -1; dr <= 7; dr++) for (let dc = -1; dc <= 7; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
        const inner = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6;
        const dark = inner && ((dr === 0 || dr === 6 || dc === 0 || dc === 6) ||
                               (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4));
        set(rr, cc, dark);
      }
    };
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);

    for (let i = 8; i < size - 8; i++) { // timing
      const dark = i % 2 === 0;
      set(6, i, dark); set(i, 6, dark);
    }

    for (const r of ALIGN[version - 1]) for (const c of ALIGN[version - 1]) {
      if ((r <= 8 && c <= 8) || (r <= 8 && c >= size - 9) || (r >= size - 9 && c <= 8)) continue;
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++)
        set(r + dr, c + dc, Math.max(Math.abs(dr), Math.abs(dc)) !== 1);
    }

    set(size - 8, 8, true); // dark module

    // reserve format areas
    const reserved = [];
    for (let i = 0; i < 9; i++) { reserved.push([8, i], [i, 8]); }
    for (let i = 0; i < 8; i++) { reserved.push([8, size - 1 - i], [size - 1 - i, 8]); }
    for (const [r, c] of reserved) if (m[r][c] === null) m[r][c] = false;

    if (version >= 7) {
      const vinfo = bch(version, 0x1f25, 13);
      for (let i = 0; i < 18; i++) {
        const bit = ((vinfo >> i) & 1) === 1;
        const r = Math.floor(i / 3), c = i % 3;
        set(size - 11 + c, r, bit); set(r, size - 11 + c, bit);
      }
    }

    // mark which cells are function modules (before data placement)
    const isFunction = m.map(row => row.map(v => v !== null));

    // data placement, upward/downward zigzag from bottom-right
    let bitIndex = 0;
    const nextBit = () => {
      if (bitIndex >= codewords.length * 8) return false;
      const b = (codewords[bitIndex >> 3] >> (7 - (bitIndex & 7))) & 1;
      bitIndex++;
      return b === 1;
    };
    let upward = true;
    for (let col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--; // skip vertical timing column
      for (let k = 0; k < size; k++) {
        const row = upward ? size - 1 - k : k;
        for (let d = 0; d < 2; d++) {
          const c = col - d;
          if (isFunction[row][c]) continue;
          let bit = nextBit();
          if (MASKS[mask](row, c)) bit = !bit;
          m[row][c] = bit;
        }
      }
      upward = !upward;
    }

    // format information
    const fmt = bch((ECL_BITS[ecl] << 3) | mask, 0x537, 11) ^ 0x5412;
    for (let i = 0; i < 15; i++) {
      const bit = ((fmt >> i) & 1) === 1;
      // column 8, top-left downward then bottom-left upward
      if (i < 6) set(i, 8, bit);
      else if (i < 8) set(i + 1, 8, bit);
      else set(size - 15 + i, 8, bit);
      // row 8, right side then top-left
      if (i < 8) set(8, size - 1 - i, bit);
      else if (i === 8) set(8, 7, bit);
      else set(8, 14 - i, bit);
    }
    return { matrix: m.map(r => r.map(Boolean)), isFunction };
  }

  function penalty(m) {
    const n = m.length;
    let score = 0;
    // rule 1: runs of 5+
    for (let i = 0; i < n; i++) {
      for (const line of [m[i], m.map(r => r[i])]) {
        let run = 1;
        for (let j = 1; j < n; j++) {
          if (line[j] === line[j - 1]) run++;
          else { if (run >= 5) score += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) score += 3 + (run - 5);
      }
    }
    // rule 2: 2x2 blocks
    for (let i = 0; i < n - 1; i++) for (let j = 0; j < n - 1; j++)
      if (m[i][j] === m[i][j + 1] && m[i][j] === m[i + 1][j] && m[i][j] === m[i + 1][j + 1]) score += 3;
    // rule 3: finder-like patterns
    const pat1 = [true, false, true, true, true, false, true, false, false, false, false];
    const pat2 = [false, false, false, false, true, false, true, true, true, false, true];
    const match = (line, start, pat) => pat.every((v, k) => line[start + k] === v);
    for (let i = 0; i < n; i++) {
      const row = m[i], col = m.map(r => r[i]);
      for (let j = 0; j + 11 <= n; j++) {
        if (match(row, j, pat1) || match(row, j, pat2)) score += 40;
        if (match(col, j, pat1) || match(col, j, pat2)) score += 40;
      }
    }
    // rule 4: dark module balance
    let dark = 0;
    for (const row of m) for (const v of row) if (v) dark++;
    const ratio = (dark * 100) / (n * n);
    score += Math.floor(Math.abs(ratio - 50) / 5) * 10;
    return score;
  }

  /** Returns { size, matrix } where matrix[row][col] is true for dark modules. */
  function encode(text, ecl = 'M') {
    const bytes = utf8(String(text));
    const version = pickVersion(bytes.length, ecl);
    if (!version) throw new Error('QR: content too long');
    const codewords = buildCodewords(bytes, version, ecl);
    let best = null, bestScore = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      const { matrix } = makeMatrix(version, ecl, codewords, mask);
      const s = penalty(matrix);
      if (s < bestScore) { bestScore = s; best = matrix; }
    }
    return { size: best.length, matrix: best, version };
  }

  /** Renders to an SVG path string sized to `modules` units, with quiet zone. */
  function toSvg(text, opts = {}) {
    const { ecl = 'M', quiet = 2, dark = '#000', light = '#fff', radius = 0 } = opts;
    const { size, matrix } = encode(text, ecl);
    const total = size + quiet * 2;
    let path = '';
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++)
      if (matrix[r][c]) path += `M${c + quiet} ${r + quiet}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet">` +
      `<rect width="${total}" height="${total}" rx="${radius}" fill="${light}"/>` +
      `<path d="${path}" fill="${dark}"/></svg>`;
  }

  return { encode, toSvg };
})();

if (typeof module !== 'undefined') module.exports = QR;

const TZ_PARTS_CACHE = new Map();
function tzFormatter(tz) {
  if (!TZ_PARTS_CACHE.has(tz)) {

      timeZone: tz, hour12: false,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short"

/** Wall-clock parts for `date` inside `tz`. */
function tzParts(tz, date = new Date()) {
  const p = {};
  for (const part of tzFormatter(tz).formatToParts(date)) p[part.type] = part.value;
  const hour = p.hour === "24" ? 0 : +p.hour;
  return {
    y: +p.year, mo: +p.month, d: +p.day,
    h: hour, mi: +p.minute, s: +p.second,
    dow: DOW[p.weekday] ?? 0,
    minutes: hour * 60 + +p.minute,
    dateStr: `${p.year}-${p.month}-${p.day}`
  };
}
/** Epoch ms for a wall-clock time expressed in `tz`. */
function zonedToEpoch(tz, y, mo, d, h = 0, mi = 0, s = 0) {
  const guess = Date.UTC(y, mo - 1, d, h, mi, s);
  const p = tzParts(tz, new Date(guess));
  const seen = Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s);
  return guess - (seen - guess);
}

    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(STORE, mode);
      const req = fn(t.objectStore(STORE));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    put: (k, v) => tx("readwrite", (s) => s.put(v, k)),
    get: (k) => tx("readonly", (s) => s.get(k)),
    del: (k) => tx("readwrite", (s) => s.delete(k)),
    clear: () => tx("readwrite", (s) => s.clear())
  };
})();

/* ---------- transport: browser-local or sync server ---------- */
const Net = (() => {
  const LS_KEY = "ic-signage-state";
  const CH_NAME = "ic-signage";
  let mode = "local";
  let chan = null, es = null;
  const listeners = { state: [], cmd: [], beat: [], link: [] };
  const emit = (k, v) => listeners[k].forEach((f) => f(v));
  const clientId = uid("cl");
  const objectUrls = new Map();

  async function probe() {
    try {
      const r = await fetch("/api/ping", { cache: "no-store" });
      if (r.ok) { const j = await r.json(); if (j && j.signage) return true; }
    } catch (e) { /* offline / file:// — fall back to local */ }
    return false;
  }

  async function init() {
    mode = (await probe()) ? "server" : "local";
    if (mode === "server") {
      connectSse();
    } else if ("BroadcastChannel" in window) {
      chan = new BroadcastChannel(CH_NAME);
      chan.onmessage = (ev) => {
        const m = ev.data || {};
        if (m.from === clientId) return;
        if (m.k === "state") emit("state", m.rev);
        else if (m.k === "cmd") emit("cmd", m.payload);
        else if (m.k === "beat") emit("beat", m.payload);
      };
      window.addEventListener("storage", (e) => { if (e.key === LS_KEY) emit("state", null); });
    }
    return mode;
  }

  let sseRetry = 0;
  function connectSse() {
    try { if (es) es.close(); } catch (e) { /* noop */ }
    es = new EventSource("/api/events");
    es.onopen = () => { sseRetry = 0; emit("link", true); };
    es.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.from === clientId) return;
      if (m.k === "state") emit("state", m.rev);
      else if (m.k === "cmd") emit("cmd", m.payload);
      else if (m.k === "beat") emit("beat", m.payload);
    };
    es.onerror = () => {
      emit("link", false);
      try { es.close(); } catch (e) { /* noop */ }
      sseRetry = Math.min(sseRetry + 1, 6);
      setTimeout(connectSse, 800 * sseRetry);
    };
  }

  async function loadState() {
    if (mode === "server") {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw new Error("state unavailable");
      const j = await r.json();
      return j && j.screens ? j : defaultState();
    }
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const j = JSON.parse(raw); if (j && j.screens) return j; }
    } catch (e) { /* corrupt or blocked storage */ }
    return null;
  }

  async function saveState(state) {
    if (mode === "server") {
      await fetch("/api/state", {
        method: "POST",
        headers: { "content-type": "application/json", "x-client": clientId },
        body: JSON.stringify(state)
      });
      return;
    }
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch (e) { throw new Error("storage-full"); }
    if (chan) chan.postMessage({ k: "state", rev: state.rev, from: clientId });
  }

  function post(k, payload) {
    if (mode === "server") {
      fetch("/api/bus", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ k, payload, from: clientId })
      }).catch(() => { /* screen keeps last content */ });
    } else if (chan) {
      chan.postMessage({ k, payload, from: clientId });
    }
  }
  const sendCmd = (payload) => post("cmd", payload);
  const beat = (payload) => post("beat", payload);

  async function putMedia(file, rec) {
    if (mode === "server") {
      const r = await fetch("/api/media?name=" + encodeURIComponent(file.name), {
        method: "POST",
        headers: { "content-type": file.type || "application/octet-stream" },
        body: file
      });
      if (!r.ok) throw new Error("upload failed");
      const j = await r.json();
      return { ...rec, url: j.url };
    }
    await IDB.put(rec.id, file);
    return rec;
  }

  async function delMedia(rec) {
    if (mode === "server") {
      if (rec.url) await fetch("/api/media?url=" + encodeURIComponent(rec.url), { method: "DELETE" }).catch(() => {});
    } else {
      await IDB.del(rec.id).catch(() => {});
      const u = objectUrls.get(rec.id);
      if (u) { URL.revokeObjectURL(u); objectUrls.delete(rec.id); }
    }
  }

  async function mediaUrl(rec) {
    if (!rec) return null;
    if (rec.url) return rec.url;
    if (objectUrls.has(rec.id)) return objectUrls.get(rec.id);
    let blob = null;
    try { blob = await IDB.get(rec.id); } catch (e) { return null; }
    if (!blob) return null;
    const u = URL.createObjectURL(blob);
    objectUrls.set(rec.id, u);
    return u;
  }

  return {
    init, loadState, saveState, sendCmd, beat, putMedia, delMedia, mediaUrl,
    on: (k, f) => listeners[k].push(f),
    get mode() { return mode; },
    clientId
  };
})();

/* ---------- store ---------- */
const Store = (() => {
  let state = defaultState();
  const subs = [];
  let saveTimer = null, pending = false;

  function notify(reason) { subs.forEach((f) => f(state, reason)); }

  function flush() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!pending) return Promise.resolve();
    pending = false;
    return Net.saveState(state).catch((e) => {
      Toast.show(e && e.message === "storage-full"
        ? "Storage is full — remove some media."
        : "Could not save. Check the sync server.", true);
    });
  }

  /** Mutate state; persists (debounced) and re-renders. */
  function update(fn, opts = {}) {
    const r = fn(state);
    if (r === false) return;
    state.rev = (state.rev || 0) + 1;
    pending = true;
    if (!opts.defer) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 220); }
    if (!opts.silent) notify(opts.reason || "update");
  }

  async function reload(reason = "remote") {
    const s = await Net.loadState();
    if (s) { state = s; notify(reason); }
  }

  return {
    get state() { return state; },
    set(s) { state = s; },
    update, flush, reload,
    subscribe: (f) => { subs.push(f); return () => subs.splice(subs.indexOf(f), 1); },
    notify,
    screen: (id) => state.screens.find((s) => s.id === id),
    media: (id) => state.media.find((m) => m.id === id)
  };
})();

/* ---------- toasts ---------- */
const Toast = (() => {
  let host = null;
  function show(msg, isErr = false) {
    if (!host) { host = h("div", { id: "toasts" }); document.body.append(host); }
    const el = h("div", { class: "toast" + (isErr ? " err" : "") }, msg);
    host.append(el);
    setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, isErr ? 4200 : 2200);
    setTimeout(() => el.remove(), isErr ? 4600 : 2600);
  }
  return { show };
})();

/* ---------- schedule resolution ---------- */
function scheduleMatches(block, tz, now = new Date()) {
  if (!block || block.enabled === false) return false;
  const p = tzParts(tz, now);
  if (block.startDate && p.dateStr < block.startDate) return false;
  if (block.endDate && p.dateStr > block.endDate) return false;
  const rep = block.repeat || "daily";
  if (rep === "weekdays" && !(p.dow >= 0 && p.dow <= 4)) return false;      // Sun–Thu
  if (rep === "weekends" && !(p.dow === 5 || p.dow === 6)) return false;    // Fri–Sat
  if (rep === "custom" && !(block.days || []).includes(p.dow)) return false;
  if (rep === "once" && block.startDate && p.dateStr !== block.startDate) return false;
  const toMin = (s) => { const [a, b] = String(s || "").split(":"); return (+a) * 60 + (+b || 0); };
  const from = block.startTime ? toMin(block.startTime) : 0;
  const to = block.endTime ? toMin(block.endTime) : 24 * 60;
  if (to <= from) return p.minutes >= from || p.minutes < to;   // wraps past midnight
  return p.minutes >= from && p.minutes < to;
}

/** Which playlist should be on air right now. */
function resolvePlaylist(cfg, tz, now = new Date()) {
  if (!cfg) return null;
  for (const b of cfg.schedules || []) {
    if (scheduleMatches(b, tz, now)) {
      const pl = (cfg.playlists || []).find((p) => p.id === b.playlistId);
      if (pl) return { playlist: pl, block: b };
    }
  }
  const pl = (cfg.playlists || []).find((p) => p.id === cfg.activePlaylistId) || (cfg.playlists || [])[0] || null;
  return pl ? { playlist: pl, block: null } : null;
}

/* ---------- thumbnails ---------- */
function readImageMeta(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      const scale = Math.min(1, 300 / Math.max(img.width, img.height));
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const isPng = file.type === "image/png" || file.type === "image/webp";
      let thumb = "";
      try { thumb = c.toDataURL(isPng ? "image/png" : "image/jpeg", isPng ? undefined : 0.7); } catch (e) { /* tainted */ }
      URL.revokeObjectURL(url);
      res({ w: img.width, h: img.height, thumb });
    };
    img.onerror = () => { URL.revokeObjectURL(url); res({ w: 0, h: 0, thumb: "" }); };
    img.src = url;
  });
}

function readVideoMeta(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    v.preload = "metadata"; v.muted = true; v.playsInline = true;
    const done = (out) => { URL.revokeObjectURL(url); res(out); };
    v.onloadeddata = () => {
      const grab = () => {
        const c = document.createElement("canvas");
        const scale = Math.min(1, 300 / Math.max(v.videoWidth || 1, v.videoHeight || 1));
        c.width = Math.max(1, Math.round((v.videoWidth || 320) * scale));
        c.height = Math.max(1, Math.round((v.videoHeight || 180) * scale));
        let thumb = "";
        try {
          c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
          thumb = c.toDataURL("image/jpeg", 0.7);
        } catch (e) { /* ignore */ }
        done({ w: v.videoWidth, h: v.videoHeight, dur: v.duration || 0, thumb });
      };
      if (v.readyState >= 2) { v.currentTime = Math.min(1, (v.duration || 2) / 3); v.onseeked = grab; setTimeout(grab, 1200); }
      else grab();
    };
    v.onerror = () => done({ w: 0, h: 0, dur: 0, thumb: "" });
    v.src = url;
  });
}

async function ingestFile(file) {
  const mime = file.type || "";
  const isImg = IMAGE_TYPES.includes(mime) || /\.(png|jpe?g|webp|gif|svg)$/i.test(file.name);
  const isVid = VIDEO_TYPES.includes(mime) || /\.(mp4|webm|mov)$/i.test(file.name);
  if (!isImg && !isVid) throw new Error(t("badType", { name: file.name }));
  if (file.size > MAX_UPLOAD_MB * 1048576) throw new Error(t("fileTooBig", { n: MAX_UPLOAD_MB }));
  const meta = isVid ? await readVideoMeta(file) : await readImageMeta(file);
  const rec = {
    id: uid("md"),
    name: file.name.replace(/\.[^.]+$/, ""),
    kind: isVid ? "video" : "image",
    mime: mime || (isVid ? "video/mp4" : "image/png"),
    size: file.size,
    w: meta.w, h: meta.h,
    dur: meta.dur || 0,
    thumb: meta.thumb || "",
    addedAt: Date.now()
  };
  return await Net.putMedia(file, rec);
}


/* ============================================================
   Stage — the single renderer used by both the admin preview and
   the display page. Content is authored in a fixed "design space"
   (the screen's real proportions) and scaled to whatever box it
   lands in, so a widget sits in the same spot on both.
   ============================================================ */

const FIT_CSS = { fit: "contain", fill: "cover", stretch: "fill", original: "none" };

class Stage {
  constructor(host, opts = {}) {
    this.host = host;
    this.opts = Object.assign({ interactive: false, chrome: false, guides: null }, opts);
    this.screen = null;
    this.cfg = null;
    this.items = [];
    this.order = [];
    this.index = 0;
    this.playing = true;
    this.scale = 1;
    this.selected = null;
    this.urlCache = new Map();
    this.timer = null;
    this.itemStart = 0;
    this.itemLength = 0;
    this.paused_remaining = null;
    this.widgetEls = new Map();
    this.updaters = [];
    this._build();
    this._ro = new ResizeObserver(() => this.layout());
    this._ro.observe(this.host);
    this._tick = setInterval(() => this._onTick(), 250);
  }

  _build() {
    clear(this.host);
    this.frame = h("div", { class: "screen-frame" });
    this.screenEl = h("div", { class: "screen" });
    this.design = h("div", { class: "design", dir: "ltr" });
    this.layerA = h("div", { class: "layer" });
    this.layerB = h("div", { class: "layer" });
    this.wgLayer = h("div", { class: "layer", style: { pointerEvents: this.opts.interactive ? "auto" : "none" } });
    this.guideLayer = h("div", { class: "guides" });
    this.emptyEl = h("div", { class: "empty-screen" });
    this.design.append(this.layerA, this.layerB, this.emptyEl, this.wgLayer, this.guideLayer);
    this.screenEl.append(this.design);
    this.frame.append(this.screenEl);
    if (this.opts.chrome) {
      this.tickTop = h("div", { class: "tick top" });
      this.tickSide = h("div", { class: "tick side" });
      this.frame.append(this.tickTop, this.tickSide, h("div", { class: "screen-reflection" }));
    }
    this.host.append(this.frame);
    this.front = this.layerA;
    this.back = this.layerB;
    if (this.opts.interactive) this._bindEditing();
  }

  /* ---------- geometry ---------- */
  setScreen(screen) {
    const changed = !this.screen || this.screen.id !== screen.id || this.screen.dw !== screen.dw || this.screen.dh !== screen.dh;
    this.screen = screen;
    this.design.style.width = screen.dw + "px";
    this.design.style.height = screen.dh + "px";
    if (this.opts.chrome) {
      const dec = (v) => (v < 1 ? v.toFixed(2) : v.toFixed(1));
      this.tickTop.textContent = dec(screen.wM) + " m";
      this.tickSide.textContent = dec(screen.hM) + " m";
    }
    this.layout();
    return changed;
  }

  layout() {
    if (!this.screen) return;
    const pad = this.opts.chrome ? 30 : 0;
    const bw = Math.max(40, this.host.clientWidth - pad * 2);
    const bh = Math.max(40, this.host.clientHeight - pad * 2);
    const s = Math.min(bw / this.screen.dw, bh / this.screen.dh);
    this.scale = s;
    const w = Math.round(this.screen.dw * s), hh = Math.round(this.screen.dh * s);
    this.screenEl.style.width = w + "px";
    this.screenEl.style.height = hh + "px";
    this.design.style.transform = `scale(${s})`;
  }

  /* ---------- guides ---------- */
  setGuides(g) {
    clear(this.guideLayer);
    if (!g || !g.on) return;
    if (g.grid) this.guideLayer.append(h("div", {
      class: "grid",
      style: { backgroundSize: `${this.screen.dw / 12}px ${this.screen.dw / 12}px` }
    }));
    if (g.safe) this.guideLayer.append(h("div", { class: "safe" }));
    if (g.center) this.guideLayer.append(h("div", { class: "cx" }), h("div", { class: "cy" }));
  }

  /* ---------- applying a configuration ---------- */
  async apply(cfg, playlist) {
    const prevItems = JSON.stringify(this.items.map((i) => [i.mediaId, i.seconds, i.fit]));
    this.cfg = cfg;
    const media = Store.state.media;
    this.items = (playlist ? playlist.items : []).filter((i) => media.some((m) => m.id === i.mediaId));
    const nowItems = JSON.stringify(this.items.map((i) => [i.mediaId, i.seconds, i.fit]));

    this.screenEl.style.background = cfg && cfg.blackout ? "#000" : "#000";
    this.design.style.visibility = cfg && cfg.blackout ? "hidden" : "visible";

    this._renderWidgets(cfg ? cfg.widgets || [] : []);

    if (nowItems !== prevItems || this.order.length !== this.items.length) {
      this._buildOrder();
      const keep = this.current ? this.items.findIndex((i) => i.id === this.current.id) : -1;
      if (keep >= 0) {
        // the current clip survived the edit — keep it on screen, just re-time it
        this.index = Math.max(0, this.order.indexOf(keep));
        this.current = this.items[keep];
        this._arm();
      } else {
        this.index = 0;
        await this._show(0, true);
      }
    }
    this._updateEmpty();
  }

  _updateEmpty() {
    const none = this.items.length === 0;
    clear(this.emptyEl);
    this.emptyEl.style.display = none ? "grid" : "none";
    if (none && this.opts.chrome) {
      this.emptyEl.style.fontSize = Math.round(this.screen.dh * 0.028) + "px";
      this.emptyEl.append(
        h("b", null, t("playlistEmpty")),
        h("div", null, t("playlistEmptyHint"))
      );
    }
  }

  _buildOrder() {
    this.order = this.items.map((_, i) => i);
    if (this.cfg && this.cfg.shuffle) {
      for (let i = this.order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [this.order[i], this.order[j]] = [this.order[j], this.order[i]];
      }
    }
  }

  async _url(mediaId) {
    if (this.urlCache.has(mediaId)) return this.urlCache.get(mediaId);
    const rec = Store.media(mediaId);
    let u = null;
    try { u = await Net.mediaUrl(rec); } catch (e) { u = null; }
    if (u) this.urlCache.set(mediaId, u);
    return u;
  }

  /* ---------- playback ---------- */
  async _show(orderPos, immediate = false) {
    clearTimeout(this.timer);
    if (!this.items.length) {
      clear(this.front); clear(this.back);
      this.current = null;
      return;
    }
    const pos = ((orderPos % this.order.length) + this.order.length) % this.order.length;
    this.index = pos;
    const item = this.items[this.order[pos]];
    this.current = item;
    const rec = Store.media(item.mediaId);
    const url = await this._url(item.mediaId);
    if (!url) { this._armNext(3000); return; }

    const node = rec.kind === "video"
      ? h("video", { src: url, autoplay: true, muted: true, playsinline: "", "webkit-playsinline": "" })
      : h("img", { src: url, alt: "" });
    node.style.objectFit = FIT_CSS[item.fit || "fit"] || "contain";
    if ((item.fit || "fit") === "original") node.style.objectPosition = "center";

    clear(this.back);
    this.back.append(node);
    this.back.style.opacity = "0";
    this.back.style.zIndex = "2";
    this.front.style.zIndex = "1";

    const ready = new Promise((res) => {
      let settled = false;
      const go = () => { if (!settled) { settled = true; res(); } };
      node.addEventListener(rec.kind === "video" ? "loadeddata" : "load", go, { once: true });
      node.addEventListener("error", go, { once: true });
      setTimeout(go, 2500);
    });
    await ready;

    const mode = immediate ? "cut" : (this.cfg && this.cfg.transition) || "crossfade";
    const ms = Math.max(0, (this.cfg && this.cfg.transitionMs) || 700);

    if (rec.kind === "video") {
      node.currentTime = 0;
      const p = node.play();
      if (p && p.catch) p.catch(() => {});
      if (!this.playing) node.pause();
      node.addEventListener("ended", () => { if (this.playing && this.current === item) this.next(); });
    }

    if (mode === "cut" || ms === 0) {
      this.back.style.transition = "none";
      this.back.style.opacity = "1";
      this.front.style.opacity = "0";
      this._swap();
    } else if (mode === "fade") {
      this.front.style.transition = `opacity ${ms / 2}ms ease`;
      this.front.style.opacity = "0";
      await new Promise((r) => setTimeout(r, ms / 2));
      this.back.style.transition = `opacity ${ms / 2}ms ease`;
      void this.back.offsetWidth;
      this.back.style.opacity = "1";
      this._swap();
    } else {
      this.back.style.transition = `opacity ${ms}ms ease`;
      void this.back.offsetWidth;
      this.back.style.opacity = "1";
      setTimeout(() => { this.front.style.opacity = "0"; }, ms);
      this._swap();
    }

    this._arm();
  }

  _swap() {
    const tmp = this.front;
    this.front = this.back;
    this.back = tmp;
    setTimeout(() => { if (this.back !== this.front) clear(this.back); }, 900);
  }

  _arm() {
    clearTimeout(this.timer);
    const item = this.current;
    if (!item) return;
    const rec = Store.media(item.mediaId);
    this.itemStart = performance.now();
    if (rec && rec.kind === "video") {
      this.itemLength = (rec.dur || 0) * 1000;
      if (!rec.dur) this._armNext(20000);
      return;
    }
    this.itemLength = Math.max(1, item.seconds || 10) * 1000;
    if (this.playing) this._armNext(this.itemLength);
  }

  _armNext(ms) {
    clearTimeout(this.timer);
    if (!this.playing) return;
    if (this.items.length === 1 && this.cfg && this.cfg.loop === false) return;
    this.timer = setTimeout(() => this.next(), ms);
  }

  _video() {
    const n = this.front.querySelector("video");
    return n || null;
  }

  play() {
    this.playing = true;
    const v = this._video();
    if (v) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    if (this.paused_remaining != null) {
      const rem = this.paused_remaining;
      this.paused_remaining = null;
      this.itemStart = performance.now() - (this.itemLength - rem);
      this._armNext(rem);
    } else { this._arm(); }
  }

  pause() {
    this.playing = false;
    clearTimeout(this.timer);
    const v = this._video();
    if (v) v.pause();
    if (this.itemLength) this.paused_remaining = Math.max(0, this.itemLength - (performance.now() - this.itemStart));
  }

  toggle() { this.playing ? this.pause() : this.play(); }

  next() {
    this.paused_remaining = null;
    if (!this.items.length) return;
    const last = this.index >= this.order.length - 1;
    if (last && this.cfg && this.cfg.loop === false) { this.pause(); return; }
    if (last && this.cfg && this.cfg.shuffle) this._buildOrder();
    this._show(this.index + 1);
  }

  prev() {
    this.paused_remaining = null;
    if (!this.items.length) return;
    this._show(this.index - 1);
  }

  goTo(itemIndex) {
    const pos = this.order.indexOf(itemIndex);
    this.paused_remaining = null;
    this._show(pos < 0 ? 0 : pos);
  }

  _onTick() {
    for (const f of this.updaters) { try { f(); } catch (e) { /* keep the wall alive */ } }
    if (!this.opts.onTick) return;
    const rec = this.current ? Store.media(this.current.mediaId) : null;
    let elapsed = 0, total = this.itemLength / 1000;
    const v = this._video();
    if (v && rec && rec.kind === "video") { elapsed = v.currentTime; total = v.duration || rec.dur || 0; }
    else if (this.current) {
      elapsed = this.playing
        ? (performance.now() - this.itemStart) / 1000
        : (this.itemLength - (this.paused_remaining ?? this.itemLength)) / 1000;
    }
    this.opts.onTick({
      playing: this.playing,
      index: this.current ? this.order[this.index] : -1,
      count: this.items.length,
      name: rec ? rec.name : null,
      elapsed: clamp(elapsed, 0, total || 0),
      total: total || 0
    });
  }

  /* ---------- widgets ---------- */
  _renderWidgets(widgets) {
    const sig = JSON.stringify(widgets) + "|" + this.selected + "|" + getLang();
    if (sig === this._wgSig) return;
    this._wgSig = sig;
    this.updaters = [];
    clear(this.wgLayer);
    this.widgetEls.clear();
    const list = [...widgets].sort((a, b) => (a.z || 0) - (b.z || 0));
    for (const w of list) {
      if (w.hidden && !this.opts.interactive) continue;
      const el = this._widgetEl(w);
      this.wgLayer.append(el);
      this.widgetEls.set(w.id, el);
    }
  }

  _widgetEl(w) {
    const S = w.style || {};
    const el = h("div", {
      class: "wg" + (this.opts.interactive ? " editable" : "") + (w.locked ? " locked" : "") +
        (this.selected === w.id && this.opts.interactive ? " sel" : ""),
      dataset: { id: w.id },
      style: {
        left: w.x + "%", top: w.y + "%", width: w.w + "%", height: w.h + "%",
        opacity: w.hidden ? (this.opts.interactive ? ".28" : "0") : String(S.opacity ?? 1),
        borderRadius: (S.radius || 0) + "px",
        background: hexA(S.bg || "#000000", S.bgOpacity ?? 0),
        color: S.color || "#ffffff",
        fontFamily: fontCss(S.font),
        fontWeight: String(S.weight || 600),
        fontSize: (S.size || 60) + "px",
        letterSpacing: (S.letter || 0) + "px",
        padding: (S.pad || 0) + "px",
        textAlign: S.align || "center",
        justifyContent: S.align === "left" ? "flex-start" : S.align === "right" ? "flex-end" : "center",
        alignItems: "center",
        pointerEvents: this.opts.interactive && !w.locked ? "auto" : "none"
      }
    });
    const body = h("div", { class: "wg-body" });
    el.append(body);
    this._paint(w, body);
    if (this.opts.interactive && this.selected === w.id && !w.locked) {
      for (const c of ["nw", "ne", "sw", "se"]) el.append(h("i", { class: "handle " + c, dataset: { corner: c } }));
    }
    return el;
  }

  _paint(w, body) {
    const S = w.style || {}, P = w.props || {};
    const tz = Store.state.settings.tz || "Asia/Riyadh";
    const loc = P.locale === "ar" ? "ar" : "en";
    const num = (v) => (loc === "ar" && P.arabicDigits !== false ? toArabicDigits(v) : String(v));

    if (w.type === "text") {
      body.style.whiteSpace = "pre-wrap";
      body.style.lineHeight = String(P.lineHeight || 1.2);
      body.textContent = P.text || "";
      return;
    }

    if (w.type === "clock") {
      const out = h("div", { class: "cd-num" });
      body.append(out);
      const upd = () => {
        const p = tzParts(tz, new Date());
        let hh = p.h, suffix = "";
        if (P.h12) {
          suffix = " " + (hh >= 12 ? (loc === "ar" ? "م" : "PM") : (loc === "ar" ? "ص" : "AM"));
          hh = hh % 12 || 12;
        }
        let s = String(P.h12 ? hh : String(hh).padStart(2, "0")) + ":" + String(p.mi).padStart(2, "0");
        if (P.seconds !== false) s += ":" + String(p.s).padStart(2, "0");
        out.textContent = num(s) + suffix;
      };
      upd(); this.updaters.push(upd);
      return;
    }

    if (w.type === "date") {
      const out = h("div");
      body.append(out);
      const upd = () => {
        const now = new Date();
        const style = P.dateStyle === "short" ? "short" : "long";
        const greg = new Intl.DateTimeFormat(loc === "ar" ? "ar-SA-u-ca-gregory" : "en-GB", {
          timeZone: tz, dateStyle: style
        }).format(now);
        let hij = "";
        try {
          hij = new Intl.DateTimeFormat((loc === "ar" ? "ar-SA" : "en-GB") + "-u-ca-islamic-umalqura", {
            timeZone: tz, dateStyle: style
          }).format(now);
        } catch (e) { hij = ""; }
        const cal = P.calendar || "gregorian";
        if (cal === "hijri") out.textContent = hij || greg;
        else if (cal === "both") {
          clear(out);
          out.append(h("div", null, greg));
          if (hij) out.append(h("div", { style: { fontSize: "0.62em", opacity: ".72" } }, hij));
        } else out.textContent = greg;
      };
      upd(); this.updaters.push(upd);
      return;
    }

    if (w.type === "countdown") {
      const labels = loc === "ar"
        ? { d: "يوم", h: "ساعة", m: "دقيقة", s: "ثانية" }
        : { d: "Days", h: "Hours", m: "Minutes", s: "Seconds" };
      const units = ["d", "h", "m", "s"].filter((u) => !(u === "s" && P.showSeconds === false));
      const row = h("div", { class: "cd-row", style: { gap: (S.gap ?? 24) + "px", justifyContent: body.parentElement.style.justifyContent } });
      const cells = {};
      for (const u of units) {
        const n = h("div", { class: "cd-num" }, "00");
        const cell = h("div", { class: "cd-cell" }, n);
        if (P.showLabels !== false) cell.append(h("div", { class: "cd-lab", style: { fontSize: Math.round((S.size || 60) * 0.26) + "px", fontWeight: "400" } }, labels[u]));
        cells[u] = n;
        row.append(cell);
      }
      body.append(row);
      const upd = () => {
        const target = P.targetDate
          ? zonedToEpoch(tz, ...P.targetDate.split("-").map(Number), ...String(P.targetTime || "00:00").split(":").map(Number))
          : Date.now();
        let diff = Math.max(0, target - Date.now()) / 1000;
        const d = Math.floor(diff / 86400); diff -= d * 86400;
        const hh = Math.floor(diff / 3600); diff -= hh * 3600;
        const mm = Math.floor(diff / 60);
        const ss = Math.floor(diff - mm * 60);
        const map = { d, h: hh, m: mm, s: ss };
        for (const u of units) cells[u].textContent = num(String(map[u]).padStart(2, "0"));
      };
      upd(); this.updaters.push(upd);
      return;
    }

    if (w.type === "qr") {
      const pad = S.pad || 0;
      const wrap = h("div", { style: { width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center" } });
      try {
        wrap.innerHTML = QR.toSvg(P.url || "https://example.com", {
          ecl: "M",
          quiet: P.quiet ?? 2,
          dark: P.dark || "#000000",
          light: P.light || "#ffffff",
          radius: 0
        });
        const svg = wrap.querySelector("svg");
        svg.style.width = "100%"; svg.style.height = "100%";
        svg.style.maxWidth = "100%"; svg.style.maxHeight = "100%";
      } catch (e) {
        wrap.textContent = "—";
      }
      body.style.height = "100%";
      body.style.padding = "0";
      body.append(wrap);
      void pad;
      return;
    }

    if (w.type === "logo") {
      const img = h("img", { alt: "", style: { width: "100%", height: "100%", objectFit: "contain", display: "block" } });
      body.style.height = "100%";
      body.append(img);
      if (P.mediaId) this._url(P.mediaId).then((u) => { if (u) img.src = u; });
      return;
    }
  }

  refreshWidgets() { this._wgSig = null; this._renderWidgets(this.cfg ? this.cfg.widgets || [] : []); }
  setSelected(id) { if (this.selected !== id) { this.selected = id; this.refreshWidgets(); } }

  /* ---------- interactive editing ---------- */
  _bindEditing() {
    let drag = null;
    const pctOf = (px, axis) => (px / this.scale) / (axis === "x" ? this.screen.dw : this.screen.dh) * 100;

    this.wgLayer.addEventListener("pointerdown", (ev) => {
      const handle = ev.target.closest(".handle");
      const el = ev.target.closest(".wg");
      if (!el) return;
      const id = el.dataset.id;
      const w = (this.cfg.widgets || []).find((x) => x.id === id);
      if (!w || w.locked) return;
      if (this.opts.onSelect) this.opts.onSelect(id);
      ev.preventDefault();
      el.setPointerCapture?.(ev.pointerId);
      drag = {
        id, el, w: deep(w), startX: ev.clientX, startY: ev.clientY,
        corner: handle ? handle.dataset.corner : null
      };
    });

    const move = (ev) => {
      if (!drag) return;
      const dx = pctOf(ev.clientX - drag.startX, "x");
      const dy = pctOf(ev.clientY - drag.startY, "y");
      const o = drag.w;
      let n = { x: o.x, y: o.y, w: o.w, h: o.h };
      if (!drag.corner) {
        n.x = clamp(o.x + dx, -20, 120 - 0);
        n.y = clamp(o.y + dy, -20, 120);
        if (!ev.altKey) {
          const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
          if (Math.abs(cx - 50) < 1.2) n.x = 50 - n.w / 2;
          if (Math.abs(cy - 50) < 1.2) n.y = 50 - n.h / 2;
          n.x = Math.round(n.x * 10) / 10;
          n.y = Math.round(n.y * 10) / 10;
        }
      } else {
        const c = drag.corner;
        if (c.includes("e")) n.w = Math.max(2, o.w + dx);
        if (c.includes("s")) n.h = Math.max(2, o.h + dy);
        if (c.includes("w")) { n.w = Math.max(2, o.w - dx); n.x = o.x + (o.w - n.w); }
        if (c.includes("n")) { n.h = Math.max(2, o.h - dy); n.y = o.y + (o.h - n.h); }
        n.w = Math.round(n.w * 10) / 10; n.h = Math.round(n.h * 10) / 10;
      }
      Object.assign(drag.el.style, { left: n.x + "%", top: n.y + "%", width: n.w + "%", height: n.h + "%" });
      drag.next = n;
    };

    const up = () => {
      if (!drag) return;
      const d = drag; drag = null;
      if (d.next && this.opts.onGeometry) this.opts.onGeometry(d.id, d.next);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
    this._unbind = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    };
    this.wgLayer.addEventListener("pointerdown", (ev) => {
      if (!ev.target.closest(".wg") && this.opts.onSelect) this.opts.onSelect(null);
    });
  }

  destroy() {
    clearInterval(this._tick);
    clearTimeout(this.timer);
    this._ro.disconnect();
    if (this._unbind) this._unbind();
    clear(this.host);
  }
}

function hexA(hex, alpha) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "#000000");
  if (!m) return `rgba(0,0,0,${alpha ?? 0})`;
  return `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${alpha ?? 0})`;
}


/* ============================================================
   Admin desk.
   ============================================================ */
const App = (() => {
  let page = "screens";
  let screenId = null;
  let sel = { kind: null, id: null };
  let stage = null;
  const beats = new Map();          // screenId -> last heartbeat ms
  let els = {};

  const screen = () => Store.screen(screenId) || Store.state.screens[0];
  const cfg = () => screen() && screen().draft;
  const tz = () => Store.state.settings.tz || "Asia/Riyadh";
  const screenName = (s) => (s.name && (s.name[getLang()] || s.name.en)) || s.id;
  const isOnline = (id) => Date.now() - (beats.get(id) || 0) < 9000;
  const activePlaylist = () => {
    const c = cfg();
    return (c.playlists.find((p) => p.id === c.activePlaylistId) || c.playlists[0]);
  };
  const dirty = (s) => JSON.stringify(s.draft) !== JSON.stringify(s.live);

  function displayUrl(id) {
    if (Net.mode === "server") return location.origin + "/display/" + id;
    return location.href.split("#")[0] + "#/display/" + id;
  }

  /* ---------------- boot ---------------- */
  async function start() {
    document.body.classList.remove("display-mode");
    const saved = await Net.loadState();
    if (saved) Store.set(saved);
    else Store.update(() => {}, { reason: "init" });
    setLang(Store.state.lang || "en");
    screenId = Store.state.screens[0].id;
    buildShell();
    Net.on("state", async () => {
      await Store.reload();
      setLang(Store.state.lang || "en");
      render();
      syncStage();
    });
    Net.on("beat", (b) => {
      if (!b || !b.screenId) return;
      const was = isOnline(b.screenId);
      beats.set(b.screenId, Date.now());
      if (!was) { renderTop(); if (page === "screens") renderPage(); }
    });
    setInterval(() => { renderTop(); if (page === "screens") renderPage(); }, 4000);
    render();
    syncStage();
    bindKeys();
  }

  /* ---------------- shell ---------------- */
  function buildShell() {
    const app = h("div", { id: "app" });
    els.top = h("div", { class: "top" });
    els.rail = h("nav", { class: "rail" });
    els.center = h("div", { class: "stage-wrap" });
    els.insp = h("aside", { class: "insp" });
    app.append(els.top, els.rail, els.center, els.insp);
    clear(document.body).append(app);
  }

  function render() {
    document.documentElement.lang = getLang();
    document.body.dir = isRTL() ? "rtl" : "ltr";
    renderTop();
    renderRail();
    renderPage();
    renderInspector();
  }

  /* ---------------- top bar ---------------- */
  function renderTop() {
    if (!els.top) return;
    const s = screen();
    clear(els.top);
    const brand = h("div", { class: "brandmark" },
      h("div", { class: "glyph" }),
      h("div", null, h("b", null, t("appName")), h("span", null, t("appSub"))));

    const picker = h("div", { class: "screen-picker", role: "group" });
    for (const sc of Store.state.screens) {
      picker.append(h("button", {
        "aria-pressed": String(sc.id === screenId),
        onclick: () => { screenId = sc.id; sel = { kind: null, id: null }; render(); syncStage(); }
      },
        h("span", { class: "dot " + (isOnline(sc.id) ? "on" : "") }),
        screenName(sc),
        h("span", { class: "ratio" }, ratioLabel(sc))));
    }

    const on = isOnline(s.id);
    const status = h("div", { class: "status-chip" },
      h("span", { class: "dot " + (on ? "on" : "off") }),
      on ? t("online") : t("offline"));

    const unpub = dirty(s);
    els.top.append(brand, picker, status, h("div", { class: "spacer" }),
      h("button", { class: "btn quiet", onclick: toggleLang, title: t("interfaceLang") }, icon("globe"), getLang() === "en" ? "عربي" : "EN"),
      h("button", { class: "btn ghost", onclick: () => window.open(displayUrl(s.id), "_blank", "noopener") }, icon("ext"), t("preview")),
      h("button", { class: "btn ghost", onclick: saveDraft }, t("saveDraft")),
      h("button", {
        class: "btn primary" + (unpub ? " pulse-live" : ""),
        onclick: () => publish(s.id),
        title: unpub ? t("unpublished") : t("allPublished")
      }, unpub ? h("span", { class: "unpub-dot" }) : icon("check"), t("publish")));
  }

  const ratioLabel = (s) => (s.profile === "portrait" ? "2:9" : "2:1");

  function toggleLang() {
    const next = getLang() === "en" ? "ar" : "en";
    setLang(next);
    Store.update((st) => { st.lang = next; });
    render();
    if (stage) stage.refreshWidgets();
  }

  /* ---------------- rail ---------------- */
  function renderRail() {
    const c = cfg();
    const nav = [
      ["screens", "screens", Store.state.screens.length],
      ["media", "media", Store.state.media.length],
      ["playlist", "playlist", activePlaylist().items.length],
      ["widgets", "widgets", c.widgets.length],
      ["schedule", "schedule", c.schedules.length],
      ["settings", "settings", null]
    ];
    clear(els.rail);
    for (const [id, ic, count] of nav) {
      els.rail.append(h("button", {
        "aria-current": page === id ? "page" : null,
        onclick: () => { page = id; sel = { kind: null, id: null }; renderRail(); renderPage(); renderInspector(); }
      }, icon(ic), h("span", { class: "lbl" }, t(id)), count !== null ? h("span", { class: "count" }, count) : null));
    }
    els.rail.append(h("div", { class: "foot" }, t("workflow")));
  }

  /* ---------------- centre ---------------- */
  const STAGE_PAGES = ["playlist", "widgets"];

  function renderPage() {
    const usesStage = STAGE_PAGES.includes(page);
    if (usesStage) { renderStageView(); return; }
    if (stage) { stage.destroy(); stage = null; }
    clear(els.center);
    const wrap = h("div", { class: "page" });
    els.center.append(wrap);
    if (page === "screens") pageScreens(wrap);
    else if (page === "media") pageMedia(wrap);
    else if (page === "schedule") pageSchedule(wrap);
    else if (page === "settings") pageSettings(wrap);
  }

  function renderStageView() {
    if (!els.center.querySelector(".stage-area")) {
      clear(els.center);
      els.stageHead = h("div", { class: "stage-head" });
      els.stageArea = h("div", { class: "stage-area" });
      els.transport = h("div", { class: "transport" });
      els.center.append(els.stageHead, els.stageArea, els.transport);
      stage = null;
    }
    if (!stage) {
      stage = new Stage(els.stageArea, {
        interactive: true,
        chrome: true,
        onSelect: (id) => { sel = id ? { kind: "widget", id } : { kind: null, id: null }; if (page !== "widgets") page = "widgets"; stage.setSelected(id); renderRail(); renderInspector(); },
        onGeometry: (id, geo) => {
          Store.update((st) => {
            const w = st.screens.find((x) => x.id === screenId).draft.widgets.find((x) => x.id === id);
            Object.assign(w, geo);
          }, { silent: true });
          touch(); renderInspector();
        },
        onTick: (info) => paintTransport(info)
      });
    }
    stage.setSelected(page === "widgets" && sel.kind === "widget" ? sel.id : null);
    renderStageHead();
    syncStage();
    renderTransport();
  }

  function renderStageHead() {
    const s = screen();
    const g = Store.state.settings.guides;
    clear(els.stageHead);
    const res = resolvePlaylist(cfg(), tz());
    els.stageHead.append(
      h("span", { class: "title" }, screenName(s)),
      h("span", { class: "meta" }, `${s.wM < 1 ? s.wM.toFixed(2) : s.wM} × ${s.hM < 1 ? s.hM.toFixed(2) : s.hM} m · ${ratioLabel(s)} · ${s.dw}×${s.dh}`),
      res && res.block ? h("span", { class: "meta", style: { color: "var(--live)" } }, "▸ " + res.block.name) : null,
      h("div", { class: "sp" }),
      guideControls(g));
  }

  function guideControls(g) {
    const wrap = h("div", { class: "inline" });
    const apply = () => { stage.setGuides(Store.state.settings.guides); renderStageHead(); };
    wrap.append(h("label", { class: "inline hint" },
      h("input", {
        type: "checkbox", checked: g.on,
        onchange: (e) => { Store.update((st) => { st.settings.guides.on = e.target.checked; }, { silent: true }); apply(); }
      }), t("guides")));
    const row = h("div", { class: "seg" });
    for (const [key, label] of [["safe", t("safeArea")], ["center", t("centerLines")], ["grid", t("grid")]]) {
      row.append(h("button", {
        "aria-pressed": String(!!g[key]), disabled: !g.on,
        onclick: () => { Store.update((st) => { st.settings.guides[key] = !st.settings.guides[key]; }, { silent: true }); apply(); }
      }, label));
    }
    wrap.append(row);
    return wrap;
  }

  function syncStage() {
    if (!stage) return;
    const s = screen();
    stage.setScreen(s);
    stage.setGuides(Store.state.settings.guides);
    const res = resolvePlaylist(s.draft, tz());
    stage.apply(s.draft, res ? res.playlist : null);
  }

  function renderTransport() {
    const c = cfg();
    clear(els.transport);
    const btn = (ic, label, fn, pressed) => h("button", {
      class: "btn ghost icon" + (pressed ? " primary" : ""), title: label, "aria-label": label, onclick: fn
    }, icon(ic));
    els.progressBar = h("i");
    els.nowName = h("b", null, t("nothingPlaying"));
    els.nowTime = h("span", { class: "sub" }, "");
    els.playBtn = btn("pause", t("pause"), () => cmd("toggle"));
    els.transport.append(
      btn("prev", t("prev"), () => cmd("prev")),
      els.playBtn,
      btn("next", t("next"), () => cmd("next")),
      h("div", { class: "now" }, els.nowName, els.nowTime),
      h("div", { class: "progress" }, els.progressBar),
      btn("loop", t("loop"), () => { Store.update((st) => { const d = st.screens.find((x) => x.id === screenId).draft; d.loop = !d.loop; }); touch(); renderTransport(); }, c.loop),
      btn("shuffle", t("shuffle"), () => { Store.update((st) => { const d = st.screens.find((x) => x.id === screenId).draft; d.shuffle = !d.shuffle; }); touch(); renderTransport(); }, c.shuffle),
      btn("power", c.blackout ? t("showContent") : t("blackout"), toggleBlackout, c.blackout),
      btn("refresh", t("reloadScreen"), () => { Net.sendCmd({ screenId, cmd: "reload" }); Toast.show(t("reloadScreen")); }));
  }

  function paintTransport(info) {
    if (!els.nowName) return;
    els.nowName.textContent = info.name || t("nothingPlaying");
    els.nowTime.textContent = info.count ? `${(info.index + 1) || 0} ${t("of")} ${info.count} · ${fmtClock(info.elapsed)}${info.total ? " / " + fmtClock(info.total) : ""}` : "";
    els.progressBar.style.width = info.total ? clamp((info.elapsed / info.total) * 100, 0, 100) + "%" : "0%";
    const want = info.playing ? "pause" : "play";
    if (els.playBtn.dataset.state !== want) {
      els.playBtn.dataset.state = want;
      clear(els.playBtn).append(icon(want));
      els.playBtn.title = info.playing ? t("pause") : t("play");

  function makeSortable(list, onReorder) {
    let drag = null;
    list.addEventListener("pointerdown", (e) => {
      const grip = e.target.closest(".grip");
      if (!grip) return;
      const row = grip.closest(".item");
      const rows = [...list.children];
      drag = { row, from: rows.indexOf(row) };
      row.classList.add("dragging");
      row.setPointerCapture?.(e.pointerId);
      e.preventDefault();
    });
    list.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const rows = [...list.children].filter((r) => r !== drag.row);
      let placed = false;
      for (const r of rows) {
        const box = r.getBoundingClientRect();
        if (e.clientY < box.top + box.height / 2) { list.insertBefore(drag.row, r); placed = true; break; }
      }
      if (!placed) list.append(drag.row);
    });
    const end = () => {
      if (!drag) return;
      drag.row.classList.remove("dragging");
      const to = [...list.children].indexOf(drag.row);
      const from = drag.from;
      drag = null;
      if (to !== from && to >= 0) onReorder(from, to);
    };
    list.addEventListener("pointerup", end);
    list.addEventListener("pointercancel", end);
  }
