/** Brings a stored state up to the current shape. */
function migrate(state) {
  if (!state || !state.screens) return state;
  if ((state.v || 1) < 2) {
    const v1 = state.screens.find((s) => s.id === "vertical-1");
    if (v1) { v1.id = "innovatex"; v1.name = { en: "InnovateX", ar: "إنوفيت إكس" }; }
    const v2 = state.screens.find((s) => s.id === "vertical-2");
    const untouched = v2 && !v2.publishedAt && !v2.draft.widgets.length &&
      v2.draft.playlists.every((p) => !p.items.length);
    if (untouched) state.screens = state.screens.filter((s) => s.id !== "vertical-2");
    state.v = 2;
  }
  if (!state.settings.brand) state.settings.brand = { logo: {}, fonts: [] };
  if (!state.settings.brand.logo) state.settings.brand.logo = {};
  if (!state.settings.brand.fonts || !state.settings.brand.fonts.length) {
    state.settings.brand.fonts = deep(BRAND_FONT_FILES);       // the identity typeface ships with the app
  }
  if (!state.settings.brand.logo.light && !state.settings.brand.logo.custom) {
    state.settings.brand.logo.light = DGA_LOGO.colour;
    state.settings.brand.logo.dark = DGA_LOGO.white;
  }
  if (!state.settings.theme) state.settings.theme = "dga";
  for (const s of state.screens) {
    if (s.rotate === undefined) s.rotate = 0;
    for (const cfg of [s.draft, s.live].filter(Boolean)) {
      if (!cfg.layout) cfg.layout = { id: "free", zones: [] };
      for (const w of cfg.widgets || []) {
        if (w.type === "countdown" && !w.props.mode) {
          w.props.mode = "date";
          w.props.running = w.props.running !== false;
          w.props.durationSec = w.props.durationSec || 300;
        }
      }
    }
  }
  return state;
}

/* ---------- IndexedDB blob store (browser-only mode) ---------- */
const IDB = (() => {
  const DB = "ic-signage", STORE = "files";
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (typeof indexedDB === "undefined" || !indexedDB) { rej(new Error("no-indexeddb")); return; }
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(STORE, mode);
      const req = fn(t.objectStore(STORE));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    put: (k, v) => tx("readwrite", (s) => s.put(v, k)),
    get: (k) => tx("readonly", (s) => s.get(k)),
    del: (k) => tx("readwrite", (s) => s.delete(k)),
    clear: () => tx("readwrite", (s) => s.clear())
  };
})();

/* ---------- transport: browser-local or sync server ---------- */
const Net = (() => {
  const LS_KEY = "ic-signage-state";
  const CH_NAME = "ic-signage";
  let mode = "local";
  let base = "";                        // set when a copy is hosted away from the server
  const api = (p) => base + p;
  let chan = null, es = null;
  const listeners = { state: [], cmd: [], beat: [], link: [] };
  const emit = (k, v) => listeners[k].forEach((f) => f(v));
  const clientId = uid("cl");
  const objectUrls = new Map();

  async function probe() {
    try {
      const r = await fetch(api("/api/ping"), { cache: "no-store" });
      if (r.ok) { const j = await r.json(); if (j && j.signage) return true; }
    } catch (e) { /* offline / file:// — fall back to local */ }
    return false;
  }

  let blobStore = true;
  async function probeBlobs() {
    try {
      await IDB.put("__probe", new Blob(["x"]));
      await IDB.del("__probe");
      return true;
    } catch (e) { return false; }
  }

  async function init() {
    mode = (await probe()) ? "server" : "local";
    if (mode === "local") blobStore = await probeBlobs();
    if (mode === "server") {
      connectSse();
    } else if ("BroadcastChannel" in window) {
      chan = new BroadcastChannel(CH_NAME);
      chan.onmessage = (ev) => {
        const m = ev.data || {};
        if (m.from === clientId) return;
        if (m.k === "state") emit("state", m.rev);
        else if (m.k === "cmd") emit("cmd", m.payload);
        else if (m.k === "beat") emit("beat", m.payload);
      };
      window.addEventListener("storage", (e) => { if (e.key === LS_KEY) emit("state", null); });
    }
    return mode;
  }

  let sseRetry = 0;
  function connectSse() {
    try { if (es) es.close(); } catch (e) { /* noop */ }
    es = new EventSource(api("/api/events"));
    es.onopen = () => { sseRetry = 0; emit("link", true); };
    es.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.from === clientId) return;
      if (m.k === "state") emit("state", m.rev);
      else if (m.k === "cmd") emit("cmd", m.payload);
      else if (m.k === "beat") emit("beat", m.payload);
    };
    es.onerror = () => {
      emit("link", false);
      try { es.close(); } catch (e) { /* noop */ }
      sseRetry = Math.min(sseRetry + 1, 6);
      setTimeout(connectSse, 800 * sseRetry);
    };
  }

  async function loadState() {
    if (mode === "server") {
      const r = await fetch(api("/api/state"), { cache: "no-store" });
      if (!r.ok) throw new Error("state unavailable");
      const j = await r.json();
      return j && j.screens ? migrate(j) : defaultState();
    }
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const j = JSON.parse(raw); if (j && j.screens) return migrate(j); }
    } catch (e) { /* corrupt or blocked storage */ }
    return null;
  }

  async function saveState(state) {
    if (mode === "server") {
      await fetch(api("/api/state"), {
        method: "POST",
        headers: { "content-type": "application/json", "x-client": clientId },
        body: JSON.stringify(state)
      });
      return;
    }
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch (e) { throw new Error("storage-full"); }
    if (chan) chan.postMessage({ k: "state", rev: state.rev, from: clientId });
  }

  function post(k, payload) {
    if (mode === "server") {
      fetch(api("/api/bus"), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ k, payload, from: clientId })
      }).catch(() => { /* screen keeps last content */ });
    } else if (chan) {
      chan.postMessage({ k, payload, from: clientId });
    }
  }
  const sendCmd = (payload) => post("cmd", payload);
  const beat = (payload) => post("beat", payload);

  function fileToDataUrl(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new Error("read failed"));
      fr.readAsDataURL(file);
    });
  }

  async function putMedia(file, rec) {
    if (mode === "server") {
      const r = await fetch(api("/api/media?name=") + encodeURIComponent(file.name), {
        method: "POST",
        headers: { "content-type": file.type || "application/octet-stream" },
        body: file
      });
      if (!r.ok) throw new Error("upload failed");
      const j = await r.json();
      return { ...rec, url: j.url };
    }
    try {
      await IDB.put(rec.id, file);
      return rec;
    } catch (e) {
      // no blob storage here — keep small files inline so uploading still works
      if (file.size <= 6 * 1048576) return { ...rec, url: await fileToDataUrl(file) };
      throw new Error(t("storageBlocked"));
    }
  }

  async function delMedia(rec) {
    if (mode === "server") {
      if (rec.url) await fetch(api("/api/media?url=") + encodeURIComponent(rec.url), { method: "DELETE" }).catch(() => {});
    } else {
      await IDB.del(rec.id).catch(() => {});
      const u = objectUrls.get(rec.id);
      if (u) { URL.revokeObjectURL(u); objectUrls.delete(rec.id); }
    }
  }

  async function mediaUrl(rec) {
    if (!rec) return null;
    if (rec.url) return rec.url.startsWith("/") ? base + rec.url : rec.url;
    if (objectUrls.has(rec.id)) return objectUrls.get(rec.id);
    let blob = null;
    try { blob = await IDB.get(rec.id); } catch (e) { return null; }
    if (!blob) return null;
    const u = URL.createObjectURL(blob);
    objectUrls.set(rec.id, u);
    return u;
  }

  return {
    init, loadState, saveState, sendCmd, beat, putMedia, delMedia, mediaUrl,
    on: (k, f) => listeners[k].push(f),
    setBase: (u) => { base = String(u || "").replace(/\/$/, ""); },
    get base() { return base; },
    get mode() { return mode; },
    get blobStore() { return blobStore; },
    clientId
  };
})();

/* ---------- store ---------- */
const Store = (() => {
  let state = defaultState();
  const subs = [];
  let saveTimer = null, pending = false;

  function notify(reason) { subs.forEach((f) => f(state, reason)); }

  function flush() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!pending) return Promise.resolve();
    pending = false;
    return Net.saveState(state).catch((e) => {
      Toast.show(e && e.message === "storage-full" ? t("storageFull") : "Could not save. Check the sync server.", true);
    });
  }

  /** Mutate state; persists (debounced) and re-renders. */
  const history = [];
  function snapshot() {
    try { history.push(JSON.stringify(state)); } catch (e) { return; }
    if (history.length > 12) history.shift();
  }
  function undo() {
    const prev = history.pop();
    if (!prev) return false;
    state = JSON.parse(prev);
    state.rev = (state.rev || 0) + 1;
    pending = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 120);
    notify("undo");
    return true;
  }

  function update(fn, opts = {}) {
    if (!opts.silent && opts.history !== false) snapshot();
    const r = fn(state);
    if (r === false) return;
    state.rev = (state.rev || 0) + 1;
    pending = true;
    if (!opts.defer) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 220); }
    if (!opts.silent) notify(opts.reason || "update");
  }

  async function reload(reason = "remote") {
    const s = await Net.loadState();
    if (s) { state = s; notify(reason); }
  }

  return {
    get state() { return state; },
    set(s) { state = s; },
    update, flush, reload, undo,
    subscribe: (f) => { subs.push(f); return () => subs.splice(subs.indexOf(f), 1); },
    notify,
    screen: (id) => state.screens.find((s) => s.id === id),
    media: (id) => state.media.find((m) => m.id === id)
  };
})();

/* ---------- toasts ---------- */
const Toast = (() => {
  let host = null;
  function show(msg, isErr = false) {
    if (!host) { host = h("div", { id: "toasts" }); document.body.append(host); }
    const el = h("div", { class: "toast" + (isErr ? " err" : "") }, msg);
    host.append(el);
    setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, isErr ? 4200 : 2200);
    setTimeout(() => el.remove(), isErr ? 4600 : 2600);
  }
  return { show };
})();

/* ---------- schedule resolution ---------- */
function scheduleMatches(block, tz, now = new Date()) {
  if (!block || block.enabled === false) return false;
  const p = tzParts(tz, now);
  if (block.startDate && p.dateStr < block.startDate) return false;
  if (block.endDate && p.dateStr > block.endDate) return false;
  const rep = block.repeat || "daily";
  if (rep === "weekdays" && !(p.dow >= 0 && p.dow <= 4)) return false;      // Sun–Thu
  if (rep === "weekends" && !(p.dow === 5 || p.dow === 6)) return false;    // Fri–Sat
  if (rep === "custom" && !(block.days || []).includes(p.dow)) return false;
  if (rep === "once" && block.startDate && p.dateStr !== block.startDate) return false;
  const toMin = (s) => { const [a, b] = String(s || "").split(":"); return (+a) * 60 + (+b || 0); };
  const from = block.startTime ? toMin(block.startTime) : 0;
  const to = block.endTime ? toMin(block.endTime) : 24 * 60;
  if (to <= from) return p.minutes >= from || p.minutes < to;   // wraps past midnight
  return p.minutes >= from && p.minutes < to;
}

/** Which playlist should be on air right now. */
function resolvePlaylist(cfg, tz, now = new Date()) {
  if (!cfg) return null;
  for (const b of cfg.schedules || []) {
    if (scheduleMatches(b, tz, now)) {
      const pl = (cfg.playlists || []).find((p) => p.id === b.playlistId);
      if (pl) return { playlist: pl, block: b };
    }
  }
  const pl = (cfg.playlists || []).find((p) => p.id === cfg.activePlaylistId) || (cfg.playlists || [])[0] || null;
  return pl ? { playlist: pl, block: null } : null;
}

/* ---------- thumbnails ---------- */
function readImageMeta(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      const scale = Math.min(1, 300 / Math.max(img.width, img.height));
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const isPng = file.type === "image/png" || file.type === "image/webp";
      let thumb = "";
      try { thumb = c.toDataURL(isPng ? "image/png" : "image/jpeg", isPng ? undefined : 0.7); } catch (e) { /* tainted */ }
      URL.revokeObjectURL(url);
      res({ w: img.width, h: img.height, thumb });
    };
    img.onerror = () => { URL.revokeObjectURL(url); res({ w: 0, h: 0, thumb: "" }); };
    img.src = url;
  });
}

function readVideoMeta(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    v.preload = "metadata"; v.muted = true; v.playsInline = true;
    const done = (out) => { URL.revokeObjectURL(url); res(out); };
    v.onloadeddata = () => {
      const grab = () => {
        const c = document.createElement("canvas");
        const scale = Math.min(1, 300 / Math.max(v.videoWidth || 1, v.videoHeight || 1));
        c.width = Math.max(1, Math.round((v.videoWidth || 320) * scale));
        c.height = Math.max(1, Math.round((v.videoHeight || 180) * scale));
        let thumb = "";
        try {
          c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
          thumb = c.toDataURL("image/jpeg", 0.7);
        } catch (e) { /* ignore */ }
        done({ w: v.videoWidth, h: v.videoHeight, dur: v.duration || 0, thumb });
      };
      if (v.readyState >= 2) { v.currentTime = Math.min(1, (v.duration || 2) / 3); v.onseeked = grab; setTimeout(grab, 1200); }
      else grab();
    };
    v.onerror = () => done({ w: 0, h: 0, dur: 0, thumb: "" });
    v.src = url;
  });
}

async function ingestFile(file) {
  const mime = file.type || "";
  let kind = null;
  if (mime.startsWith("image/")) kind = "image";
  else if (mime.startsWith("video/")) kind = "video";
  else if (IMAGE_EXT.test(file.name)) kind = "image";
  else if (VIDEO_EXT.test(file.name)) kind = "video";

  const limit = maxUploadMB();
  if (file.size > limit * 1048576) throw new Error(t("fileTooBig", { n: limit }));

  // a failure to read dimensions or draw a thumbnail must never block the upload
  const safely = async (fn) => { try { return await fn(file); } catch (e) { return { w: 0, h: 0, dur: 0, thumb: "" }; } };

  let meta = { w: 0, h: 0, dur: 0, thumb: "" };
  let unknown = false;
  if (kind === "image") meta = await safely(readImageMeta);
  else if (kind === "video") meta = await safely(readVideoMeta);
  else {
    // unfamiliar container: let the browser try it as video, then as an image
    unknown = true;
    meta = await safely(readVideoMeta);
    kind = "video";
    if (!meta.w) { const asImg = await safely(readImageMeta); if (asImg.w) { meta = asImg; kind = "image"; } }
  }

  const rec = {
    id: uid("md"),
    name: file.name.replace(/\.[^.]+$/, ""),
    kind,
    mime: mime || (kind === "video" ? "video/mp4" : "image/png"),
    size: file.size,
    w: meta.w, h: meta.h,
    dur: meta.dur || 0,
    thumb: meta.thumb || "",
    addedAt: Date.now()
  };
  const stored = await Net.putMedia(file, rec);
  if (unknown) Toast.show(t("unknownFormat", { name: file.name }));
  return stored;
}


/* ============================================================
   Stage — the single renderer used by both the admin preview and
   the display page. Content is authored in a fixed "design space"
   (the screen's real proportions) and scaled to whatever box it
   lands in, so a widget sits in the same spot on both.
   ============================================================ */

const FIT_CSS = { fit: "contain", fill: "cover", stretch: "fill", original: "none" };

class Stage {
  constructor(host, opts = {}) {
    this.host = host;
    this.opts = Object.assign({ interactive: false, chrome: false, guides: null }, opts);
    this.screen = null;
    this.cfg = null;
    this.items = [];
    this.order = [];
    this.index = 0;
    this.playing = true;
    this.scale = 1;
    this.selected = null;
    this.urlCache = new Map();
    this.timer = null;
    this.itemStart = 0;
    this.itemLength = 0;
    this.paused_remaining = null;
    this.widgetEls = new Map();
    this.rotate = 0;
    this.updaters = [];
    this._build();
    this._ro = new ResizeObserver(() => this.layout());
    this._ro.observe(this.host);
    this._tick = setInterval(() => this._onTick(), 250);
  }

  _build() {
    clear(this.host);
    this.frame = h("div", { class: "screen-frame" });
    this.screenEl = h("div", { class: "screen" });
    this.design = h("div", { class: "design", dir: "ltr" });
    // stacking order, lowest first: media (1–2) · empty notice (3) · widgets (5) · guides (6)
    this.layerA = h("div", { class: "layer media-layer" });
    this.layerB = h("div", { class: "layer media-layer" });
    this.wgLayer = h("div", {
      class: "layer wg-layer",
      style: { pointerEvents: this.opts.interactive ? "auto" : "none" }
    });
    this.zoneLayer = h("div", { class: "layer zone-layer" });
    this.guideLayer = h("div", { class: "guides" });
    this.emptyEl = h("div", { class: "empty-screen" });
    this.design.append(this.layerA, this.layerB, this.emptyEl, this.zoneLayer, this.wgLayer, this.guideLayer);
    this.screenEl.append(this.design);
    this.frame.append(this.screenEl);
    if (this.opts.chrome) {
      this.tickTop = h("div", { class: "tick top" });
      this.tickSide = h("div", { class: "tick side" });
      this.frame.append(this.tickTop, this.tickSide, h("div", { class: "screen-reflection" }));
    }
    this.host.append(this.frame);
    this.front = this.layerA;
    this.back = this.layerB;
    if (this.opts.interactive) this._bindEditing();
  }

  /* ---------- geometry ---------- */
  setScreen(screen) {
    const changed = !this.screen || this.screen.id !== screen.id || this.screen.dw !== screen.dw || this.screen.dh !== screen.dh;
    this.screen = screen;
    this.design.style.width = screen.dw + "px";
    this.design.style.height = screen.dh + "px";
    if (this.opts.chrome) {
      const dec = (v) => (v < 1 ? v.toFixed(2) : v.toFixed(1));
      this.tickTop.textContent = dec(screen.wM) + " m";
      this.tickSide.textContent = dec(screen.hM) + " m";
    }
    this.layout();
    return changed;
  }

  setRotation(deg) {
    this.rotate = ((deg % 360) + 360) % 360;
    this.frame.style.transform = this.rotate ? `rotate(${this.rotate}deg)` : "";
    this.layout();
  }

  layout() {
    if (!this.screen) return;
    const pad = this.opts.chrome ? 30 : 0;
    const bw = Math.max(40, this.host.clientWidth - pad * 2);
    const bh = Math.max(40, this.host.clientHeight - pad * 2);
    const turned = this.rotate === 90 || this.rotate === 270;
    const s = turned
      ? Math.min(bh / this.screen.dw, bw / this.screen.dh)
      : Math.min(bw / this.screen.dw, bh / this.screen.dh);
    this.scale = s;
    const w = Math.round(this.screen.dw * s), hh = Math.round(this.screen.dh * s);
    this.screenEl.style.width = w + "px";
    this.screenEl.style.height = hh + "px";
    this.design.style.transform = `scale(${s})`;
  }

  /* ---------- guides ---------- */
  setGuides(g) {
    clear(this.guideLayer);
    if (!g || !g.on) return;
    if (g.grid) this.guideLayer.append(h("div", {
      class: "grid",
      style: { backgroundSize: `${this.screen.dw / 12}px ${this.screen.dw / 12}px` }
    }));
    if (g.safe) {
      this.guideLayer.append(h("div", { class: "safe action" }));   // 90% — action safe
      this.guideLayer.append(h("div", { class: "safe title" }));    // 80% — title safe
    }
    if (g.center) this.guideLayer.append(h("div", { class: "cx" }), h("div", { class: "cy" }));
  }

  /** Draws the layout's content zones behind the widgets (desk only). */
  renderZones(cfg) {
    if (!this.opts.interactive) return;
    const zones = (cfg && cfg.layout && cfg.layout.zones) || [];
    const sig = JSON.stringify(zones) + "|" + (this.opts.showZones !== false);
    if (sig === this._zoneSig) return;
    this._zoneSig = sig;
    clear(this.zoneLayer);
    this.zoneLayer.style.display = this.opts.showZones === false ? "none" : "block";
    const label = Math.round(this.screen.dh * 0.022);
    for (const z of zones) {
      this.zoneLayer.append(h("div", {
        class: "zone", dataset: { zone: z.id },
        style: { left: z.x + "%", top: z.y + "%", width: z.w + "%", height: z.h + "%" }
      }, h("span", { class: "zone-tag", style: { fontSize: label + "px", padding: label * 0.25 + "px " + label * 0.5 + "px" } },
        (z.name && (z.name[getLang()] || z.name.en)) || z.id)));
    }
  }

  setZones(on) { this.opts.showZones = on; this._zoneSig = null; this.renderZones(this.cfg); }

  zoneAt(xPct, yPct) {
    const zones = (this.cfg && this.cfg.layout && this.cfg.layout.zones) || [];
    return zones.find((z) => xPct >= z.x && xPct <= z.x + z.w && yPct >= z.y && yPct <= z.y + z.h) || null;
  }

  /* ---------- applying a configuration ---------- */
  async apply(cfg, playlist) {
    const prevItems = JSON.stringify(this.items.map((i) => [i.mediaId, i.seconds, i.fit]));
    this.cfg = cfg;
    const media = Store.state.media;
    this.items = (playlist ? playlist.items : []).filter((i) => media.some((m) => m.id === i.mediaId));
    const nowItems = JSON.stringify(this.items.map((i) => [i.mediaId, i.seconds, i.fit]));

    this.screenEl.style.background = cfg && cfg.blackout ? "#000" : "#000";
    this.design.style.visibility = cfg && cfg.blackout ? "hidden" : "visible";

    this.renderZones(cfg);
    this._renderWidgets(cfg ? cfg.widgets || [] : []);

    if (nowItems !== prevItems || this.order.length !== this.items.length) {
      this._buildOrder();
      const keep = this.current ? this.items.findIndex((i) => i.id === this.current.id) : -1;
      if (keep >= 0) {
        // the current clip survived the edit — keep it on screen, just re-time it
        this.index = Math.max(0, this.order.indexOf(keep));
        this.current = this.items[keep];
        this._arm();
      } else {
        this.index = 0;
        await this._show(0, true);
      }
    }
    this._updateEmpty();
  }

  _updateEmpty() {
    const none = this.items.length === 0;
    clear(this.emptyEl);
    this.emptyEl.style.display = none ? "grid" : "none";
    if (none && this.opts.chrome) {
      this.emptyEl.style.fontSize = Math.round(this.screen.dh * 0.028) + "px";
      this.emptyEl.append(
        h("b", null, t("playlistEmpty")),
        h("div", null, t("playlistEmptyHint"))
      );
    }
  }

  _buildOrder() {
    this.order = this.items.map((_, i) => i);
    if (this.cfg && this.cfg.shuffle) {
      for (let i = this.order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [this.order[i], this.order[j]] = [this.order[j], this.order[i]];
      }
    }
  }

  async _url(mediaId) {
    if (this.urlCache.has(mediaId)) return this.urlCache.get(mediaId);
    const rec = Store.media(mediaId);
    let u = null;
    try { u = await Net.mediaUrl(rec); } catch (e) { u = null; }
    if (u) this.urlCache.set(mediaId, u);
    return u;
  }

  /* ---------- playback ---------- */
  async _show(orderPos, immediate = false) {
    clearTimeout(this.timer);
    const token = (this._showToken = (this._showToken || 0) + 1);
    if (!this.items.length) {
      clear(this.front); clear(this.back);
      this.current = null;
      return;
    }
    const pos = ((orderPos % this.order.length) + this.order.length) % this.order.length;
    this.index = pos;
    const item = this.items[this.order[pos]];
    this.current = item;
    const rec = Store.media(item.mediaId);
    const url = await this._url(item.mediaId);
    if (!url) { this._armNext(3000); return; }

    const node = rec.kind === "video" ? makeVideo(url) : h("img", { src: url, alt: "" });
    node.style.objectFit = FIT_CSS[item.fit || "fit"] || "contain";
    if ((item.fit || "fit") === "original") node.style.objectPosition = "center";

    clear(this.back);
    this.back.append(node);
    this.back.style.opacity = "0";
    this.back.style.zIndex = "2";      // both media layers stay below the widgets
    this.front.style.zIndex = "1";

    const ready = new Promise((res) => {
      let settled = false;
      const go = () => { if (!settled) { settled = true; res(); } };
      node.addEventListener(rec.kind === "video" ? "loadeddata" : "load", go, { once: true });
      node.addEventListener("error", go, { once: true });
      setTimeout(go, 2500);
    });
    await ready;
    if (token !== this._showToken) return;    // superseded while it was loading

    const mode = immediate ? "cut" : (this.cfg && this.cfg.transition) || "crossfade";
    const ms = Math.max(0, (this.cfg && this.cfg.transitionMs) || 700);

    if (rec.kind === "video") {
      const alone = this.items.length === 1;
      // repeat when asked for, when the clip is being held, or when it is the
      // only thing on the screen — native looping leaves no gap between passes
      node.loop = !!(item.loop || item.hold || (alone && (!this.cfg || this.cfg.loop !== false)));
      node.currentTime = 0;
      const start = () => playVideo(node);
      start();
      if (!this.playing) node.pause();

      // compare by id: a state refresh replaces these objects wholesale
      const isCurrent = () => this.current && this.current.id === item.id;
      node.addEventListener("ended", () => {
        if (!this.playing || !isCurrent()) return;
        if (node.loop) { node.currentTime = 0; start(); return; }
        if (item.hold) return;
        this.next();
      });
      node.addEventListener("error", () => {
        if (!isCurrent()) return;
        if (this.items.length > 1) this._armNext(4000);
      });
    }

    // hold on to the outgoing layer: after the swap `this.front` is the new one,
    // and fading that out is what used to black the screen mid-clip
    const outgoing = this.front;

    if (mode === "cut" || ms === 0) {
      this.back.style.transition = "none";
      this.back.style.opacity = "1";
      outgoing.style.opacity = "0";
      this._swap(0);
    } else if (mode === "fade") {
      outgoing.style.transition = `opacity ${ms / 2}ms ease`;
      outgoing.style.opacity = "0";
      await new Promise((r) => setTimeout(r, ms / 2));
      if (token !== this._showToken) return;
      this.back.style.transition = `opacity ${ms / 2}ms ease`;
      void this.back.offsetWidth;
      this.back.style.opacity = "1";
      this._swap(ms / 2);
    } else {
      this.back.style.transition = `opacity ${ms}ms ease`;
      void this.back.offsetWidth;
      this.back.style.opacity = "1";
      this._swap(ms);
      setTimeout(() => { outgoing.style.opacity = "0"; }, ms);
    }

    this._arm();
  }

  _swap(fadeMs = 0) {
    const outgoing = this.front;
    this.front = this.back;
    this.back = outgoing;
    // clear the old layer only once the fade has finished, never the live one
    setTimeout(() => {
      if (outgoing === this.front) return;
      clear(outgoing);
      outgoing.style.transition = "none";
      outgoing.style.opacity = "0";
    }, (fadeMs || 0) + 400);
  }

  _arm() {
    clearTimeout(this.timer);
    this._stallAt = 0;
    this._nudged = false;
    this._lastT = -1;
    const item = this.current;
    if (!item) return;
    const rec = Store.media(item.mediaId);
    this.itemStart = performance.now();
    if (rec && rec.kind === "video") {
      const node = this._video();
      this.itemLength = ((node && node.duration) || rec.dur || 0) * 1000;
      // a clip of unknown length ends on its own "ended" event; the stall
      // watchdog in the tick handles a player that quietly gives up
      return;
    }
    if (item.hold || this.items.length === 1) {
      // held on purpose, or it is the only thing on this screen — nothing to advance to
      this.itemLength = 0;
      return;
    }
    this.itemLength = Math.max(1, item.seconds || 10) * 1000;
    if (this.playing) this._armNext(this.itemLength);
  }

  _armNext(ms) {
    clearTimeout(this.timer);
    if (!this.playing) return;
    if (this.items.length === 1 && this.cfg && this.cfg.loop === false) return;
    this.timer = setTimeout(() => this.next(), ms);
  }

  _video() {
    const n = this.front.querySelector("video");
    return n || null;
  }

  /** Start the current playlist again from the top, re-fetching its media. */
  restart() {
    this.urlCache.clear();
    this.paused_remaining = null;
    this._buildOrder();
    this.index = 0;
    this._show(0, true);
  }

  play() {
    this.playing = true;
    const v = this._video();
    if (v) playVideo(v);
    if (this.paused_remaining != null) {
      const rem = this.paused_remaining;
      this.paused_remaining = null;
      this.itemStart = performance.now() - (this.itemLength - rem);
      this._armNext(rem);
    } else { this._arm(); }
  }

  pause() {
    this.playing = false;
    clearTimeout(this.timer);
    const v = this._video();
    if (v) v.pause();
    if (this.itemLength) this.paused_remaining = Math.max(0, this.itemLength - (performance.now() - this.itemStart));
  }

  toggle() { this.playing ? this.pause() : this.play(); }

  next() {
    this.paused_remaining = null;
    if (!this.items.length) return;
    const last = this.index >= this.order.length - 1;
    if (last && this.cfg && this.cfg.loop === false) { this.pause(); return; }
    if (last && this.cfg && this.cfg.shuffle) this._buildOrder();
    this._show(this.index + 1);
  }

  prev() {
    this.paused_remaining = null;
    if (!this.items.length) return;
    this._show(this.index - 1);
  }

  goTo(itemIndex) {
    const pos = this.order.indexOf(itemIndex);
    this.paused_remaining = null;
    this._show(pos < 0 ? 0 : pos);
  }

  _onTick() {
    for (const f of this.updaters) { try { f(); } catch (e) { /* keep the wall alive */ } }
    this._watchVideo();
    if (!this.opts.onTick) return;
    const rec = this.current ? Store.media(this.current.mediaId) : null;
    let elapsed = 0, total = this.itemLength / 1000;
    const v = this._video();
    if (v && rec && rec.kind === "video") { elapsed = v.currentTime; total = v.duration || rec.dur || 0; }
    else if (this.current) {
      elapsed = this.playing
        ? (performance.now() - this.itemStart) / 1000
        : (this.itemLength - (this.paused_remaining ?? this.itemLength)) / 1000;
    }
    this.opts.onTick({
      playing: this.playing,
      index: this.current ? this.order[this.index] : -1,
      count: this.items.length,
      name: rec ? rec.name : null,
      elapsed: clamp(elapsed, 0, total || 0),
      total: total || 0
    });
  }

  /** Nudges a video that has quietly stopped, then moves on if it stays dead. */
  _watchVideo() {
    const v = this._video();
    if (!v || !this.playing || v.paused || v.ended) { this._stallAt = 0; this._lastT = -1; return; }
    if (Math.abs(v.currentTime - (this._lastT ?? -1)) > 0.01) {
      this._stallAt = 0;
      this._lastT = v.currentTime;
      return;
    }
    if (!this._stallAt) { this._stallAt = performance.now(); return; }
    const stuck = performance.now() - this._stallAt;
    if (stuck > 6000 && !this._nudged) {
      this._nudged = true;
      playVideo(v);
      return;
    }
    if (stuck > 20000) {
      this._stallAt = 0;
      this._nudged = false;
      if (v.loop) { v.currentTime = 0; playVideo(v); }
      else if (this.items.length > 1) this.next();
      else this._show(this.index, true);
    }
  }

  /* ---------- widgets ---------- */
  _renderWidgets(widgets) {
    const sig = JSON.stringify(widgets) + "|" + this.selected + "|" + getLang();
    if (sig === this._wgSig) return;
    this._wgSig = sig;
    this.updaters = [];
    clear(this.wgLayer);
    this.widgetEls.clear();
    const list = [...widgets].sort((a, b) => (a.z || 0) - (b.z || 0));
    for (const w of list) {
      if (w.hidden && !this.opts.interactive) continue;
      const el = this._widgetEl(w);
      if (w.when) {
        const tzv = Store.state.settings.tz || "Asia/Riyadh";
        const check = () => {
          const on = scheduleMatches(Object.assign({ enabled: true }, w.when), tzv);
          if (this.opts.interactive) el.style.filter = on ? "" : "grayscale(1) opacity(.45)";
          else el.style.display = on ? "" : "none";
        };
        check();
        this.updaters.push(check);
      }
      this.wgLayer.append(el);
      this.widgetEls.set(w.id, el);
    }
  }

  _mainText(w) {
    const P = w.props || {};
    if (P.text) return P.text;
    if (P.titleAr || P.titleEn) return (P.titleAr || "") + " " + (P.titleEn || "");
    if (P.question) return P.question;
    if (P.hashtag) return P.hashtag;
    const first = (P.items || P.posts || P.options || [])[0];
    if (first) return first.text || first.label || first.name || first.title || "";
    return "";
  }

  _widgetEl(w) {
    const S = w.style || {};
    const el = h("div", {
      class: "wg" + (this.opts.interactive ? " editable" : "") + (w.locked ? " locked" : "") +
        (this.selected === w.id && this.opts.interactive ? " sel" : ""),
      dataset: { id: w.id },
      style: {
        left: w.x + "%", top: w.y + "%", width: w.w + "%", height: w.h + "%",
        opacity: w.hidden ? (this.opts.interactive ? ".28" : "0") : String(S.opacity ?? 1),
        borderRadius: (S.radius || 0) + "px",
        background: hexA(S.bg || "#000000", S.bgOpacity ?? 0),
        color: S.color || "#ffffff",
        fontFamily: fontCss(S.font),
        fontWeight: String(S.weight || 600),
        fontSize: (S.size || 60) + "px",
        letterSpacing: (S.letter || 0) + "px",
        padding: (S.pad || 0) + "px",
        // logical alignment: "left" means the reading start, so Arabic
        // lines sit right and English lines sit left in the same widget
        textAlign: S.align === "left" ? "start" : S.align === "right" ? "end" : "center",
        justifyContent: S.align === "left" ? "flex-start" : S.align === "right" ? "flex-end" : "center",
        alignItems: "center",
        pointerEvents: this.opts.interactive && !w.locked ? "auto" : "none"
      }
    });
    if (w.anim && w.anim.type && w.anim.type !== "none" && (!this.opts.interactive || this._animate)) {
      el.style.animation = `wg-${w.anim.type} ${w.anim.dur || 700}ms cubic-bezier(.22,.61,.36,1) ${w.anim.delay || 0}ms both`;
    }
    el.dir = dirFor(w, this._mainText(w));
    const body = h("div", { class: "wg-body" });
    el.append(body);
    this._paint(w, body);
    if (this.opts.interactive && this.selected === w.id && !w.locked) {
      for (const c of ["nw", "ne", "sw", "se"]) el.append(h("i", { class: "handle " + c, dataset: { corner: c } }));
    }
    return el;
  }

  _paint(w, body) {
    const S = w.style || {}, P = w.props || {};
    const tz = Store.state.settings.tz || "Asia/Riyadh";
    const loc = P.locale === "ar" ? "ar" : "en";
    const num = (v) => (loc === "ar" && P.arabicDigits !== false ? toArabicDigits(v) : String(v));

    if (w.type === "text") {
      body.style.lineHeight = String(P.lineHeight || 1.2);
      for (const line of String(P.text || "").split("\n")) {
        body.append(h("div", { dir: dirFor(w, line), style: { whiteSpace: "pre-wrap", minHeight: "0.8em" } }, line));
      }
      return;
    }

    if (w.type === "clock") {
      const out = h("div", { class: "cd-num" });
      body.append(out);
      const upd = () => {
        const p = tzParts(tz, new Date());
        let hh = p.h, suffix = "";
        if (P.h12) {
          suffix = " " + (hh >= 12 ? (loc === "ar" ? "م" : "PM") : (loc === "ar" ? "ص" : "AM"));
          hh = hh % 12 || 12;
        }
        let s = String(P.h12 ? hh : String(hh).padStart(2, "0")) + ":" + String(p.mi).padStart(2, "0");
        if (P.seconds !== false) s += ":" + String(p.s).padStart(2, "0");
        out.textContent = num(s) + suffix;
      };
      upd(); this.updaters.push(upd);
      return;
    }

    if (w.type === "date") {
      const out = h("div");
      body.append(out);
      const upd = () => {
        const now = new Date();
        const style = P.dateStyle === "short" ? "short" : "long";
        const greg = new Intl.DateTimeFormat(loc === "ar" ? "ar-SA-u-ca-gregory" : "en-GB", {
          timeZone: tz, dateStyle: style
        }).format(now);
        let hij = "";
        try {
          hij = new Intl.DateTimeFormat((loc === "ar" ? "ar-SA" : "en-GB") + "-u-ca-islamic-umalqura", {
            timeZone: tz, dateStyle: style
          }).format(now);
        } catch (e) { hij = ""; }
        const cal = P.calendar || "gregorian";
        if (cal === "hijri") out.textContent = hij || greg;
        else if (cal === "both") {
          clear(out);
          out.append(h("div", null, greg));
          if (hij) out.append(h("div", { style: { fontSize: "0.62em", opacity: ".72" } }, hij));
        } else out.textContent = greg;
      };
      upd(); this.updaters.push(upd);
      return;
    }

    if (w.type === "countdown") {
      const labels = loc === "ar"
        ? { d: "يوم", h: "ساعة", m: "دقيقة", s: "ثانية" }
        : { d: "Days", h: "Hours", m: "Minutes", s: "Seconds" };
      const units = countdownUnits(P);
      const row = h("div", { class: "cd-row", style: { gap: (S.gap ?? 24) + "px", justifyContent: body.parentElement.style.justifyContent } });
      const cells = {};
      for (const u of units) {
        const n = h("div", { class: "cd-num" }, "00");
        const cell = h("div", { class: "cd-cell" }, n);
        if (P.showLabels !== false) cell.append(h("div", { class: "cd-lab", style: { fontSize: Math.round((S.size || 60) * 0.26) + "px", fontWeight: "400" } }, labels[u]));
        cells[u] = n;
        row.append(cell);
      }
      body.append(row);
      const upd = () => {
        let diff = countdownRemaining(P, tz);
        const d = Math.floor(diff / 86400); diff -= d * 86400;
        const hh = Math.floor(diff / 3600); diff -= hh * 3600;
        const mm = Math.floor(diff / 60);
        const ss = Math.floor(diff - mm * 60);
        const map = {
          d, s: ss,
          h: units.includes("d") ? hh : hh + d * 24,
          m: units.includes("h") ? mm : mm + hh * 60 + d * 1440
        };
        for (const u of units) cells[u].textContent = num(String(map[u]).padStart(2, "0"));
      };
      upd(); this.updaters.push(upd);
      return;
    }

    if (w.type === "qr") {
      const pad = S.pad || 0;
      const wrap = h("div", { style: { width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center" } });
      try {
        wrap.innerHTML = QR.toSvg(P.url || "https://example.com", {
          ecl: "M",
          quiet: P.quiet ?? 2,
          dark: P.dark || "#000000",
          light: P.light || "#ffffff",
          radius: 0
        });
        const svg = wrap.querySelector("svg");
        svg.style.width = "100%"; svg.style.height = "100%";
        svg.style.maxWidth = "100%"; svg.style.maxHeight = "100%";
      } catch (e) {
        wrap.textContent = "—";
      }
      body.style.height = "100%";
      body.style.padding = "0";
      body.append(wrap);
      void pad;
      return;
    }

    if (w.type === "wayfinding") {
      const items = P.items || [];
      const gap = S.gap ?? 26;
      const list = h("div", { style: { width: "100%", display: "flex", flexDirection: "column", gap: gap + "px" } });
      const ARROW = {
        right: "M4 12h15M13.5 6.5 19 12l-5.5 5.5",
        left: "M20 12H5M10.5 6.5 5 12l5.5 5.5",
        up: "M12 20V5M6.5 10.5 12 5l5.5 5.5",
        down: "M12 4v15M6.5 13.5 12 19l5.5-5.5",
        upleft: "M19 19 6 6M6 13V6h7",
        upright: "M5 19 18 6M18 13V6h-7"
      };
      for (const it of items) {
        const arrow = h("span", { style: { width: "1.25em", height: "1.25em", flex: "none", color: P.accent || "#1cc182", display: "block" } });
        arrow.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ARROW[it.dir] || ARROW.right}"/></svg>`;
        const texts = h("div", { dir: dirFor(w, it.label), style: { flex: "1", minWidth: "0" } },
          h("div", { style: { fontWeight: "700", lineHeight: "1.15" } }, it.label || ""),
          it.place || it.event
            ? h("div", { style: { fontSize: "0.46em", fontWeight: "400", opacity: ".78", marginTop: "0.12em" } },
              [it.place, it.event].filter(Boolean).join(" · "))
            : null);
        const row = h("div", { style: { display: "flex", alignItems: "center", gap: "0.5em", width: "100%" } });
        const ico = it.icon ? h("span", { style: { width: "0.95em", height: "0.95em", flex: "none", opacity: ".85", display: "block" } }) : null;
        if (ico) ico.innerHTML = iconSvg(it.icon, 1.7);
        // the arrow leads the line in the direction the destination reads
        if (dirFor(w, it.label) === "rtl") { row.dir = "rtl"; row.append(arrow, ico, texts); }
        else { row.dir = "ltr"; row.append(arrow, ico, texts); }
        list.append(row);
      }
      body.append(list);
      return;
    }

    if (w.type === "socialwall") {
      const posts = (P.posts || []).filter((p) => p.text || p.user);
      const mode = P.wallLayout || "grid";
      const gap = S.gap ?? 18;
      const host = h("div", { style: { width: "100%", height: "100%", display: "flex", flexDirection: "column", gap: gap + "px" } });
      if (P.hashtag) host.append(h("div", { style: { fontWeight: "700", color: P.accent || "#1cc182", fontSize: "0.72em" } }, P.hashtag));
      const grid = h("div", {
        style: {
          flex: "1", minHeight: "0", display: "grid", gap: gap + "px",
          gridTemplateColumns: mode === "cards" ? "1fr" : "repeat(2, minmax(0,1fr))"
        }
      });
      const card = (p, big) => h("div", {
        style: {
          background: "rgba(255,255,255,.08)", border: "1px solid rgba(255,255,255,.14)",
          borderRadius: (S.radius || 18) + "px", padding: (gap * 0.9) + "px",
          display: "flex", flexDirection: "column", gap: "0.35em", overflow: "hidden",
          fontSize: big ? "1em" : "0.62em"
        }
      },
        h("div", { style: { display: "flex", alignItems: "center", gap: "0.4em", opacity: ".85", fontSize: "0.6em" } },
          h("span", { style: { width: "1.6em", height: "1.6em", borderRadius: "50%", background: P.accent || "#1cc182", flex: "none" } }),
          h("b", null, p.user || ""),
          h("span", null, p.handle || "")),
        h("div", { dir: textDir(p.text), style: { lineHeight: "1.3", overflow: "hidden" } }, p.text || ""));
      const window_ = P.window || (mode === "feature" ? 5 : 4);
      const start = (this._wallOffset || 0) % Math.max(1, posts.length);
      const shown = [];
      for (let i = 0; i < Math.min(window_, posts.length); i++) shown.push(posts[(start + i) % posts.length]);
      if (mode === "feature" && shown.length) {
        grid.style.gridTemplateColumns = "1.35fr 1fr";
        const featured = card(shown[0], true);
        featured.style.gridRow = "span " + Math.max(1, shown.length - 1);
        grid.append(featured);
        for (const p of shown.slice(1)) grid.append(card(p, false));
      } else {
        for (const p of shown) grid.append(card(p, mode === "cards"));
      }
      host.append(grid);
      body.style.height = "100%";
      body.append(host);
      if (posts.length > window_) {
        let ticks = 0;
        const every = Math.max(2, P.rotate || 8) * 4;      // the tick runs 4× a second
        this.updaters.push(() => {
          if (++ticks % every) return;
          this._wallOffset = (this._wallOffset || 0) + 1;
          this.refreshWidgets();
        });
      }
      return;
    }

    if (w.type === "poll") {
      const opts = P.options || [];
      const total = opts.reduce((n, o) => n + (+o.votes || 0), 0) || 1;
      const gap = S.gap ?? 18;
      const wrap = h("div", { style: { display: "flex", width: "100%", height: "100%", gap: (gap * 1.5) + "px", alignItems: "center" } });
      const left = h("div", { style: { flex: "1", minWidth: "0", display: "flex", flexDirection: "column", gap: gap + "px" } });
      left.append(h("div", { dir: dirFor(w, P.question), style: { fontWeight: "700", lineHeight: "1.2" } }, P.question || ""));
      for (const o of opts) {
        const pct = Math.round(((+o.votes || 0) / total) * 100);
        const bar = h("div", {
          style: {
            height: "0.42em", borderRadius: "999px", background: P.accent || "#1cc182",
            width: pct + "%", transition: "width 900ms cubic-bezier(.22,.61,.36,1)"
          }
        });
        left.append(h("div", { style: { fontSize: "0.5em", fontWeight: "500" } },
          h("div", { style: { display: "flex", justifyContent: "space-between", gap: "1em" } },
            h("span", { dir: textDir(o.label) }, o.label || ""),
            h("span", { style: { fontVariantNumeric: "tabular-nums", opacity: ".85" } },
              (loc === "ar" ? toArabicDigits(pct) : pct) + "%")),
          P.resultsAs === "percent" ? null
            : h("div", { style: { background: "rgba(255,255,255,.16)", borderRadius: "999px", marginTop: "0.25em", overflow: "hidden" } }, bar)));
      }
      if (P.showParticipants !== false) {
        left.append(h("div", { style: { fontSize: "0.42em", opacity: ".72", fontWeight: "400" } },
          `${loc === "ar" ? toArabicDigits(total) : total} · ${loc === "ar" ? "مشارك" : "participants"}`));
      }
      wrap.append(left);
      if (P.showQr !== false && P.url) {
        const qr = h("div", { style: { flex: "none", width: "26%", aspectRatio: "1", background: "#fff", borderRadius: (S.radius || 12) + "px", padding: "0.3em" } });
        try { qr.innerHTML = QR.toSvg(P.url, { ecl: "M", quiet: 1, dark: "#1c1554", light: "#ffffff" }); } catch (e) { /* ignore */ }
        const svg = qr.querySelector("svg");
        if (svg) { svg.style.width = "100%"; svg.style.height = "100%"; }
        wrap.append(qr);
      }
      body.style.height = "100%";
      body.append(wrap);
      return;
    }

    if (w.type === "stats") {
      const items = P.items || [];
      const gap = S.gap ?? 22;
      const grid = h("div", {
        style: {
          width: "100%", display: "grid", gap: gap + "px",
          gridTemplateColumns: P.layout === "grid" ? "repeat(2, minmax(0,1fr))" : `repeat(${Math.max(1, items.length)}, minmax(0,1fr))`
        }
      });
      const counters = [];
      for (const it of items) {
        const val = h("div", { class: "stat-val", style: { fontWeight: "700", lineHeight: "1" } }, "0");
        const cardEl = h("div", {
          style: {
            display: "flex", flexDirection: "column", alignItems: P.align || "center", gap: "0.18em",
            background: P.cardBg ? hexA(P.cardBg, P.cardOpacity ?? .12) : "transparent",
            borderRadius: (S.radius || 18) + "px",
            padding: P.cardBg ? (gap * 0.8) + "px" : "0"
          }
        });
        if (it.icon) {
          const ico = h("span", { style: { width: "0.9em", height: "0.9em", display: "block", color: P.accent || "#1cc182" } });
          ico.innerHTML = iconSvg(it.icon, 1.7);
          cardEl.append(ico);
        }
        cardEl.append(val, h("div", { class: "stat-lab", dir: textDir(it.label), style: { fontSize: "0.3em", fontWeight: "400", textAlign: "center" } }, it.label || ""));
        grid.append(cardEl);
        counters.push({ el: val, target: parseFloat(String(it.value).replace(/[^0-9.]/g, "")) || 0, raw: it.value, suffix: it.suffix || "" });
      }
      body.append(grid);
      const started = performance.now();
      const animate = P.animate !== false;
      const dur = Math.max(200, P.countMs || 1400);
      const paint = () => {
        const k = animate ? Math.min(1, (performance.now() - started) / dur) : 1;
        const eased = 1 - Math.pow(1 - k, 3);
        for (const c of counters) {
          const n = Math.round(c.target * eased);
          c.el.textContent = (loc === "ar" ? toArabicDigits(n) : n) + c.suffix;
        }
      };
      paint();
      this.updaters.push(paint);
      return;
    }

    if (w.type === "quote") {
      const items = (P.items || []).filter((q) => q.text);
      const out = h("div", { style: { width: "100%", transition: "opacity 500ms ease" } });
      body.append(out);
      let idx = 0, ticks = 0;
      const draw = () => {
        const q = items[idx % Math.max(1, items.length)] || { text: "", author: "" };
        clear(out);
        if (P.showMark !== false) {
          out.append(h("div", { style: { fontSize: "1.6em", lineHeight: "0.6", color: P.accent || "#1cc182", marginBottom: "0.2em" } }, loc === "ar" ? "”" : "“"));
        }
        out.dir = dirFor(w, q.text);
        out.append(h("div", { style: { lineHeight: "1.3" } }, q.text));
        if (q.author) out.append(h("div", { style: { fontSize: "0.42em", fontWeight: "400", opacity: ".75", marginTop: "0.5em" } }, "— " + q.author));
      };
      draw();
      if (items.length > 1) {
        const every = Math.max(3, P.seconds || 10) * 4;
        this.updaters.push(() => {
          if (++ticks % every) return;
          out.style.opacity = "0";
          setTimeout(() => { idx++; draw(); out.style.opacity = "1"; }, 400);
        });
      }
      return;
    }

    if (w.type === "welcome") {
      const logos = (Store.state.settings.brand && Store.state.settings.brand.logo) || {};
      const host = h("div", { style: { width: "100%", display: "flex", flexDirection: "column", gap: "0.35em", alignItems: S.align === "left" ? "flex-start" : S.align === "right" ? "flex-end" : "center" } });
      const marks = h("div", { style: { display: "flex", alignItems: "center", gap: "0.6em", marginBottom: "0.2em" } });
      const addLogo = (src) => {
        if (!src) return;
        marks.append(h("img", { src, alt: "", style: { height: "1.1em", width: "auto", objectFit: "contain", display: "block" } }));
      };
      addLogo(P.hostLogo === "dark" ? logos.dark : P.hostLogo === "light" ? logos.light : null);
      if (P.guestMediaId) {
        const img = h("img", { alt: "", style: { height: "1.1em", width: "auto", objectFit: "contain", display: "block" } });
        this._url(P.guestMediaId).then((u) => { if (u) img.src = u; });
        marks.append(img);
      }
      if (marks.children.length) host.append(marks);
      if (P.titleAr && (P.lang === "ar" || P.lang === "both")) host.append(h("div", { style: { fontWeight: "700", lineHeight: "1.2", direction: "rtl" } }, P.titleAr));
      if (P.titleEn && (P.lang === "en" || P.lang === "both")) {
        host.append(h("div", { dir: "ltr", style: { fontWeight: P.lang === "both" ? "500" : "700", fontSize: P.lang === "both" ? "0.62em" : "1em", lineHeight: "1.2" } }, P.titleEn));
      }
      if (P.delegation) host.append(h("div", { dir: textDir(P.delegation), style: { color: P.accent || "#1d9af2", fontWeight: "700", fontSize: "0.74em", marginTop: "0.15em" } }, P.delegation));
      if (P.subline) host.append(h("div", { dir: textDir(P.subline), style: { fontSize: "0.4em", fontWeight: "400", opacity: ".8" } }, P.subline));
      if (P.date) host.append(h("div", { style: { fontSize: "0.34em", fontWeight: "400", opacity: ".65", fontVariantNumeric: "tabular-nums" } }, P.date));
      body.append(host);
      return;
    }

    if (w.type === "events") {
      const tzNow = tzParts(tz, new Date());
      const nowMin = tzNow.minutes;
      const today = tzNow.dateStr;
      const items = (P.items || []).filter((e) => e.name);
      const gap = S.gap ?? 20;
      const status = (e) => {
        if (!e.date) return "upcoming";
        if (e.date > today) return "upcoming";
        if (e.date < today) return "done";
        const [hh, mm] = String(e.time || "00:00").split(":").map(Number);
        const start = hh * 60 + (mm || 0);
        if (nowMin >= start && nowMin < start + (e.mins || 120)) return "live";
        if (start - nowMin > 0 && start - nowMin <= 60) return "soon";
        return nowMin >= start ? "done" : "upcoming";
      };
      const labels = {
        upcoming: loc === "ar" ? "قادمة" : "Upcoming",
        soon: loc === "ar" ? "تبدأ قريباً" : "Starting soon",
        live: loc === "ar" ? "جارية الآن" : "Live now",
        done: loc === "ar" ? "انتهت" : "Ended"
      };
      const colours = { upcoming: "#1d9af2", soon: "#ffa300", live: "#1cc182", done: "#8188a6" };
      // the status chip scales on its own, so it can be read from across a hall
      const chip = (P.statusSize ?? 30) / 100;
      const pill = (st) => (P.showStatus === false ? null : h("span", {
        style: {
          fontSize: chip + "em", fontWeight: "600", color: colours[st],
          border: `${Math.max(1, Math.round(chip * 4))}px solid ${colours[st]}`,
          borderRadius: "999px", padding: "0.18em 0.7em", whiteSpace: "nowrap", lineHeight: "1.25",
          background: P.statusFill ? hexA(colours[st], .16) : "transparent"
        }
      }, labels[st]));
      const row = (e, big) => {
        const st = status(e);
        const when = [e.date, e.time].filter(Boolean).join(" · ");
        return h("div", {
          style: {
            display: "flex", alignItems: "center", gap: "0.5em", width: "100%",
            fontSize: big ? "1em" : "0.58em", opacity: st === "done" ? ".45" : "1",
            borderInlineStart: `0.14em solid ${colours[st]}`, paddingInlineStart: "0.45em"
          }
        },
          h("div", { dir: dirFor(w, e.name), style: { flex: "1", minWidth: "0" } },
            h("div", { style: { fontWeight: "700", lineHeight: "1.15" } }, e.name),
            h("div", { style: { fontSize: "0.46em", fontWeight: "400", opacity: ".8", marginTop: "0.1em", fontVariantNumeric: "tabular-nums" } },
              [loc === "ar" ? toArabicDigits(when) : when, e.place, e.type].filter(Boolean).join(" · "))),
          pill(st));
      };
      const host = h("div", { style: { width: "100%", display: "flex", flexDirection: "column", gap: gap + "px" } });
      const mode = P.layout || "list";
      if (mode === "carousel" && items.length) {
        const i = Math.floor(Date.now() / ((P.rotate || 8) * 1000)) % items.length;
        host.append(row(items[i], true));
      } else if (mode === "feature" && items.length) {
        host.append(row(items[0], true));
        for (const e of items.slice(1)) host.append(row(e, false));
      } else {
        for (const e of items) host.append(row(e, false));
      }
      body.append(host);
      let evTick = 0;
      this.updaters.push(() => { if (++evTick % 120 === 0) this.refreshWidgets(); });   // restate statuses every 30s
      return;
    }

    if (w.type === "icon") {
      const wrap = h("div", { style: { width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: S.color || "#2a206a" } });
      wrap.innerHTML = iconSvg(P.name || "star", P.stroke || 1.7);
      const svg = wrap.querySelector("svg");
      svg.style.width = "100%"; svg.style.height = "100%";
      body.style.height = "100%";
      body.append(wrap);
      if (P.label) {
        body.style.justifyContent = "center";
        body.append(h("div", { dir: textDir(P.label), style: { textAlign: "center", fontSize: Math.round((S.size || 40) * 0.5) + "px", marginTop: "0.25em" } }, P.label));
      }
      return;
    }

    if (w.type === "ticker") {
      const rtl = dirFor(w, (P.items || []).map((i) => i.text).join(" ") || P.text || "") === "rtl";
      const gap = (S.gap ?? 120);
      const zone = Store.state.settings.tz || "Asia/Riyadh";
      const live = (P.items || []).filter((it) => it.text &&
        (!it.when || scheduleMatches(Object.assign({ enabled: true }, it.when), zone)));
      const parts = live.length ? live : (P.text ? [{ text: P.text }] : []);
      const sep = P.separator === "none" ? "" : P.separator === "dash" ? "—" : P.separator === "dot" ? "•" : "◆";

      const strip = () => {
        const line = h("span", { style: { display: "inline-flex", alignItems: "center", gap: "0.5em" } });
        parts.forEach((it, i) => {
          if (it.icon) {
            const ico = h("span", { style: { width: "0.85em", height: "0.85em", display: "block", flex: "none", color: P.accent || "#1cc182" } });
            ico.innerHTML = iconSvg(it.icon, 1.8);
            line.append(ico);
          }
          line.append(h("span", { dir: dirFor(w, it.text) }, it.text));
          if (sep && i < parts.length - 1) {
            line.append(h("span", { style: { color: P.accent || "#1cc182", opacity: ".85", padding: "0 0.25em" } }, sep));
          }
        });
        return line;
      };

      if (P.mode === "static") {
        const wrap = h("div", { style: { width: "100%", direction: rtl ? "rtl" : "ltr", display: "flex", justifyContent: "center" } });
        let i = 0, ticks = 0;
        const out = h("div", { style: { transition: "opacity 400ms ease" } });
        const draw = () => {
          clear(out);
          const it = parts[i % Math.max(1, parts.length)] || { text: "" };
          if (it.icon) {
            const ico = h("span", { style: { width: "0.85em", height: "0.85em", display: "inline-block", verticalAlign: "-0.1em", marginInlineEnd: "0.4em", color: P.accent || "#1cc182" } });
            ico.innerHTML = iconSvg(it.icon, 1.8);
            out.append(ico);
          }
          out.append(h("span", { dir: dirFor(w, it.text) }, it.text));
        };
        draw();
        wrap.append(out);
        body.style.height = "100%";
        body.style.justifyContent = "center";
        body.append(wrap);
        if (parts.length > 1) {
          const every = Math.max(3, P.hold || 8) * 4;
          this.updaters.push(() => {
            if (++ticks % every) return;
            out.style.opacity = "0";
            setTimeout(() => { i++; draw(); out.style.opacity = "1"; }, 350);
          });
        }
        return;
      }

      const wrap = h("div", { class: "tk-wrap", style: { "--tk-gap": gap + "px", direction: rtl ? "rtl" : "ltr" } });
      const track = h("div", { class: "tk-track" + (rtl ? " rtl" : ""), style: { animationDuration: Math.max(4, P.speed || 30) + "s" } });
      for (let i = 0; i < 2; i++) track.append(h("span", null, strip()));
      wrap.append(track);
      body.style.height = "100%";
      body.style.justifyContent = "center";
      body.append(wrap);
      return;
    }

    if (w.type === "shape") {
      const kind = P.kind || "solid";
      const fill = kind === "sweep"
        ? `linear-gradient(${P.angle ?? 115}deg, #1cc182, #1d9af2 46%, #852cd0)`
        : kind === "gradient"
          ? `linear-gradient(${P.angle ?? 115}deg, ${P.color1 || "#1cc182"}, ${P.color2 || "#852cd0"})`
          : (P.color1 || "#2a206a");
      const box = h("div", {
        style: {
          width: "100%",
          height: kind === "line" ? (P.thickness || 6) + "px" : "100%",
          background: fill,
          borderRadius: (S.radius || 0) + "px",
          borderEndStartRadius: P.sweep ? (P.sweepSize || 120) + "px" : null
        }
      });
      body.style.height = "100%";
      body.style.justifyContent = kind === "line" ? "center" : "stretch";
      body.append(box);
      return;
    }

    if (w.type === "stat") {
      body.append(
        h("div", { class: "stat-val", style: { fontSize: "1em" } }, (P.prefix || "") + (P.value ?? "") + (P.suffix || "")),
        P.label ? h("div", { class: "stat-lab", dir: textDir(P.label), style: { fontSize: Math.round((S.size || 90) * 0.28) + "px", fontWeight: "400", marginTop: "0.18em" } }, P.label) : null);
      return;
    }

    if (w.type === "agenda") {
      const rows = (P.items || []);
      const toMin = (v) => { const [a, b] = String(v || "00:00").split(":"); return (+a || 0) * 60 + (+b || 0); };
      const gap = S.gap ?? 18;
      const list = h("div", { style: { width: "100%", display: "flex", flexDirection: "column", gap: gap + "px" } });
      const built = rows.map((it, i) => {
        const dot = h("span", { class: "ag-dot", style: { width: "0.34em", height: "0.34em", alignSelf: "center", background: "currentColor", opacity: ".35" } });
        const time = h("span", { class: "ag-time", style: { minWidth: "3.4em" } }, loc === "ar" ? toArabicDigits(it.time || "") : (it.time || ""));
        const title = h("span", { class: "ag-title", dir: dirFor(w, it.title) }, it.title || "");
        const row = h("div", { class: "ag-row", style: { gap: Math.round(gap * 0.8) + "px" } }, dot, time, title);
        list.append(row);
        return { row, dot, time, title, start: toMin(it.time), end: i + 1 < rows.length ? toMin(rows[i + 1].time) : 24 * 60 };
      });
      body.append(list);
      const upd = () => {
        if (P.highlightNow === false) return;
        const nowMin = tzParts(tz, new Date()).minutes;
        const accent = P.accent || "#1cc182";
        for (const r of built) {
          const isNow = nowMin >= r.start && nowMin < r.end;
          const isPast = nowMin >= r.end;
          r.row.classList.toggle("now", isNow);
          r.row.classList.toggle("past", isPast);
          r.title.style.fontWeight = isNow ? "700" : "";
          r.time.style.color = isNow ? accent : "";
          r.dot.style.background = isNow ? accent : "currentColor";
          r.dot.style.opacity = isNow ? "1" : ".35";
        }
      };
      upd(); this.updaters.push(upd);
      return;
    }

    if (w.type === "prayer") {
      const city = SAUDI_CITIES.find((c) => c.id === (P.city || "riyadh")) || SAUDI_CITIES[0];
      const lat = P.lat ?? city.lat, lon = P.lon ?? city.lon;
      const keys = ["fajr", "sunrise", "dhuhr", "asr", "maghrib", "isha"]
        .filter((k) => !(k === "sunrise" && P.showSunrise === false));
      const column = P.layout === "column";
      const host = h("div", { class: column ? "" : "pt-grid", style: column ? { width: "100%", display: "flex", flexDirection: "column", gap: (S.gap ?? 14) + "px" } : { gap: (S.gap ?? 14) + "px" } });
      const cells = {};
      for (const k of keys) {
        const label = h("div", { style: { opacity: .72, fontSize: Math.round((S.size || 48) * 0.5) + "px", fontWeight: "400" } }, PRAYER_NAMES[loc][k]);
        const value = h("div", { class: "cd-num" }, "—");
        const cell = column
          ? h("div", { class: "pt-row" }, label, value)
          : h("div", { class: "pt-cell" }, value, label);
        cells[k] = { cell, value };
        host.append(cell);
      }
      body.append(host);
      const upd = () => {
        const p = tzParts(tz, new Date());
        const times = prayerTimes(p, lat, lon, tzOffsetHours(tz), {
          fajrAngle: P.fajrAngle ?? 18.5, ishaGap: P.ishaGap ?? 90, asrFactor: P.asrFactor ?? 1
        });
        const nowH = p.h + p.mi / 60 + p.s / 3600;
        let nextKey = null;
        for (const k of keys) if (times[k] !== null && times[k] > nowH && k !== "sunrise") { nextKey = k; break; }
        for (const k of keys) {
          cells[k].value.textContent = fmtPrayer(times[k], !!P.h12, loc);
          const isNext = P.highlightNext !== false && k === nextKey;
          cells[k].cell.classList.toggle("next", isNext);
          cells[k].value.style.color = isNext ? (P.accent || "#1cc182") : "";
        }
      };
      upd(); this.updaters.push(upd);
      return;
    }

    if (w.type === "weather") {
      const out = h("div", { style: { display: "flex", alignItems: "center", justifyContent: "center", gap: "0.35em", width: "100%" } });
      const ico = h("span", { style: { width: "1em", height: "1em", display: "block", flex: "none" } });
      ico.innerHTML = iconSvg("sun", 1.6);
      const temp = h("span", { class: "cd-num" }, "—");
      out.append(ico, temp);
      body.append(out);
      if (P.label) body.append(h("div", { style: { textAlign: "center", opacity: .7, fontSize: Math.round((S.size || 60) * 0.34) + "px", fontWeight: "400" } }, P.label));
      const key = `wx:${P.lat ?? 24.71},${P.lon ?? 46.68}`;
      const paint = (data) => {
        if (!data) return;
        temp.textContent = (loc === "ar" ? toArabicDigits(Math.round(data.t)) : Math.round(data.t)) + "°";
        ico.innerHTML = iconSvg(data.code === 0 ? "sun" : data.code < 45 ? "cloud" : data.code < 70 ? "cloud" : "cloud", 1.6);
      };
      paint(Stage.weatherCache[key]);
      const fetchNow = () => {
        if (Stage.weatherCache[key] && Date.now() - Stage.weatherCache[key].at < 900000) { paint(Stage.weatherCache[key]); return; }
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${P.lat ?? 24.71}&longitude=${P.lon ?? 46.68}&current=temperature_2m,weather_code`)
          .then((r) => r.json())
          .then((j) => {
            const rec = { t: j.current.temperature_2m, code: j.current.weather_code, at: Date.now() };
            Stage.weatherCache[key] = rec;
            paint(rec);
          })
          .catch(() => { /* screens keep the last reading */ });
      };
      fetchNow();
      let ticks = 0;
      this.updaters.push(() => { if (++ticks % 1200 === 0) fetchNow(); });
      return;
    }

    if (w.type === "logo") {
      const img = h("img", { alt: "", style: { width: "100%", height: "100%", objectFit: "contain", display: "block" } });
      body.style.height = "100%";
      body.append(img);
      if (P.brandLogo) {
        const logos = (Store.state.settings.brand && Store.state.settings.brand.logo) || {};
        if (logos[P.brandLogo]) img.src = logos[P.brandLogo];
      } else if (P.mediaId) {
        this._url(P.mediaId).then((u) => { if (u) img.src = u; });
      }
      return;
    }
  }

  /** Replays entrance animations — used by the desk's preview button. */
  replayAnimations() { this._animate = true; this._wgSig = null; this._renderWidgets(this.cfg ? this.cfg.widgets || [] : []); this._animate = false; }

  refreshWidgets() { this._wgSig = null; this._renderWidgets(this.cfg ? this.cfg.widgets || [] : []); }
  setSelected(id) { if (this.selected !== id) { this.selected = id; this.refreshWidgets(); } }

  /* ---------- interactive editing ---------- */
  _bindEditing() {
    let drag = null;
    const pctOf = (px, axis) => (px / this.scale) / (axis === "x" ? this.screen.dw : this.screen.dh) * 100;

    this.wgLayer.addEventListener("pointerdown", (ev) => {
      const handle = ev.target.closest(".handle");
      const el = ev.target.closest(".wg");
      if (!el) return;
      const id = el.dataset.id;
      const w = (this.cfg.widgets || []).find((x) => x.id === id);
      if (!w || w.locked) return;
      if (this.opts.onSelect) this.opts.onSelect(id);
      ev.preventDefault();
      el.setPointerCapture?.(ev.pointerId);
      drag = {
        id, el, w: deep(w), startX: ev.clientX, startY: ev.clientY,
        corner: handle ? handle.dataset.corner : null
      };
    });

    const move = (ev) => {
      if (!drag) return;
      const dx = pctOf(ev.clientX - drag.startX, "x");
      const dy = pctOf(ev.clientY - drag.startY, "y");
      const o = drag.w;
      let n = { x: o.x, y: o.y, w: o.w, h: o.h };
      if (!drag.corner) {
        n.x = clamp(o.x + dx, -20, 120 - 0);
        n.y = clamp(o.y + dy, -20, 120);
        if (!ev.altKey) {
          const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
          if (Math.abs(cx - 50) < 1.2) n.x = 50 - n.w / 2;
          if (Math.abs(cy - 50) < 1.2) n.y = 50 - n.h / 2;
          n.x = Math.round(n.x * 10) / 10;
          n.y = Math.round(n.y * 10) / 10;
        }
      } else {
        const c = drag.corner;
        if (c.includes("e")) n.w = Math.max(2, o.w + dx);
        if (c.includes("s")) n.h = Math.max(2, o.h + dy);
        if (c.includes("w")) { n.w = Math.max(2, o.w - dx); n.x = o.x + (o.w - n.w); }
        if (c.includes("n")) { n.h = Math.max(2, o.h - dy); n.y = o.y + (o.h - n.h); }
        n.w = Math.round(n.w * 10) / 10; n.h = Math.round(n.h * 10) / 10;
      }
      Object.assign(drag.el.style, { left: n.x + "%", top: n.y + "%", width: n.w + "%", height: n.h + "%" });
      drag.next = n;
      // highlight the zone the widget is being dropped into
      const z = drag.corner ? null : this.zoneAt(n.x + n.w / 2, n.y + n.h / 2);
      drag.zone = z;
      for (const el of this.zoneLayer.children) el.classList.toggle("hot", !!z && el.dataset.zone === z.id);
    };

    const up = () => {
      if (!drag) return;
      const d = drag; drag = null;
      for (const el of this.zoneLayer.children) el.classList.remove("hot");
      if (d.next && this.opts.onGeometry) this.opts.onGeometry(d.id, d.next, d.zone ? d.zone.id : null);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
    this._unbind = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    };
    this.wgLayer.addEventListener("pointerdown", (ev) => {
      if (!ev.target.closest(".wg") && this.opts.onSelect) this.opts.onSelect(null);
    });
  }

  destroy() {
    clearInterval(this._tick);
    clearTimeout(this.timer);
    this._ro.disconnect();
    if (this._unbind) this._unbind();
    clear(this.host);
  }
}

/** Which units a countdown shows, given its mode and length. */
function countdownUnits(P) {
  const withSeconds = P.showSeconds !== false;
  if (P.mode === "up") return withSeconds ? ["h", "m", "s"] : ["h", "m"];
  if (P.mode === "timer") {
    const len = P.durationSec || 300;
    if (len >= 86400) return ["d", "h", "m", "s"];
    if (len >= 3600) return ["h", "m", "s"];
    return withSeconds ? ["m", "s"] : ["h", "m"];
  }
  return withSeconds ? ["d", "h", "m", "s"] : ["d", "h", "m"];
}

/** Seconds left on a countdown, whether it is running or paused. */
function countdownRemaining(P, tz) {
  if (P.mode === "up") {
    if (P.running === false) return Math.max(0, P.frozenSec ?? 0);
    return Math.max(0, (Date.now() - (P.startedAt || Date.now())) / 1000);
  }
  if (P.running === false) return Math.max(0, P.frozenSec ?? defaultRemaining(P, tz));
  if (P.mode === "timer") {
    if (!P.endsAt) return Math.max(0, P.durationSec || 0);
    return Math.max(0, (P.endsAt - Date.now()) / 1000);
  }
  if (P.endsAt) return Math.max(0, (P.endsAt - Date.now()) / 1000);
  return Math.max(0, defaultRemaining(P, tz));
}

function defaultRemaining(P, tz) {
  if (P.mode === "timer") return P.durationSec || 0;
  if (!P.targetDate) return 0;
  const target = zonedToEpoch(tz, ...P.targetDate.split("-").map(Number),
    ...String(P.targetTime || "00:00").split(":").map(Number));
  return (target - Date.now()) / 1000;
}

/* ------------------------------------------------------------
   Video on a screen must be silent and must start on its own.
   `muted` has to be set as a property before the source is attached —
   with only a muted *attribute* the browser treats the clip as audible
   and refuses to autoplay it.
   ------------------------------------------------------------ */
function makeVideo(url) {
  const v = document.createElement("video");
  v.muted = true;
  v.defaultMuted = true;
  v.volume = 0;
  v.playsInline = true;
  v.setAttribute("playsinline", "");
  v.setAttribute("webkit-playsinline", "");
  v.autoplay = true;
  v.preload = "auto";
  v.setAttribute("disablepictureinpicture", "");
  v.src = url;
  return v;
}

/* If a browser still blocks playback, retry a few times, then start on the
   first touch of the page — which covers an operator's preview tab. */
const BLOCKED_VIDEOS = new Set();
let unlockArmed = false;
function armUnlock() {
  if (unlockArmed) return;
  unlockArmed = true;
  const go = () => {
    for (const v of BLOCKED_VIDEOS) { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    BLOCKED_VIDEOS.clear();
  };
  for (const ev of ["pointerdown", "keydown", "touchstart"]) {
    document.addEventListener(ev, go, { passive: true });
  }
}
function playVideo(node, tries = 0) {
  if (!node) return;
  node.muted = true;
  const p = node.play();
  if (p && p.catch) {
    p.catch(() => {
      if (tries < 4) setTimeout(() => playVideo(node, tries + 1), 400 * (tries + 1));
      else { BLOCKED_VIDEOS.add(node); armUnlock(); }
    });
  }
}

function hexA(hex, alpha) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "#000000");
  if (!m) return `rgba(0,0,0,${alpha ?? 0})`;
  return `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${alpha ?? 0})`;
}

      e.dataTransfer.dropEffect = "copy";
      hot(true);
    }));
    area.addEventListener("dragleave", (e) => { if (e.target === area) hot(false); });

      e.preventDefault(); hot(false);
      const id = e.dataTransfer.getData("text/media-id");
      if (id && Store.media(id)) { addMediaToScreen(id); return; }
      const files = Array.from(e.dataTransfer.files || []);

      for (const f of files) {
        try {
          const rec = await ingestFile(f);
          Store.update((st) => { st.media.unshift(rec); });
          addMediaToPlaylist(rec.id, activePlaylist().id);

  function readAsDataUrl(file, limitMB) {
    if (file.size > limitMB * 1048576) return Promise.reject(new Error(t("fileTooBig", { n: limitMB })));
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new Error("read failed"));
      fr.readAsDataURL(file);
    });
  }

  function uploadLogo(variant) {
    const inp = h("input", { type: "file", accept: "image/png,image/svg+xml,image/webp" });
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      try {
        const src = await readAsDataUrl(f, 3);
        Store.update((s) => { s.settings.brand.logo[variant] = src; s.settings.brand.logo.custom = true; });
        render(); Toast.show(t("saved"));
      } catch (e) { Toast.show(e.message, true); }
    };
    inp.click();
  }

  function uploadFont(family) {
    const inp = h("input", { type: "file", accept: ".woff2,.woff,.ttf,.otf,font/*" });
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      try {
        const src = await readAsDataUrl(f, 6);
        const weight = /bold|700|800|semibold|600/i.test(f.name) ? 700 : /light|300/i.test(f.name) ? 300 : /medium|500/i.test(f.name) ? 500 : 400;
        Store.update((s) => { s.settings.brand.fonts.push({ family, src, weight, name: f.name }); });
        applyBrandFonts(Store.state);
        render(); syncStage(); Toast.show(t("saved"));
      } catch (e) { Toast.show(e.message, true); }
    };
    inp.click();
  }

  function makeSortable(list, onReorder) {
    let drag = null;
    list.addEventListener("pointerdown", (e) => {
      const grip = e.target.closest(".grip");
      if (!grip) return;
      const row = grip.closest(".item");
      const rows = [...list.children];
      drag = { row, from: rows.indexOf(row) };
      row.classList.add("dragging");
      row.setPointerCapture?.(e.pointerId);
      e.preventDefault();
    });
    list.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const rows = [...list.children].filter((r) => r !== drag.row);
      let placed = false;
      for (const r of rows) {
        const box = r.getBoundingClientRect();
        if (e.clientY < box.top + box.height / 2) { list.insertBefore(drag.row, r); placed = true; break; }
      }
      if (!placed) list.append(drag.row);
    });
    const end = () => {
      if (!drag) return;
      drag.row.classList.remove("dragging");
      const to = [...list.children].indexOf(drag.row);
      const from = drag.from;
      drag = null;
      if (to !== from && to >= 0) onReorder(from, to);
    };
    list.addEventListener("pointerup", end);
    list.addEventListener("pointercancel", end);
  }

  /** Edits draft and on-air copies at once — for controls that must act now. */
  function editWidgetLive(id, fn) {
    Store.update((st) => {
      const s = st.screens.find((x) => x.id === screenId);
      for (const c of [s.draft, s.live].filter(Boolean)) {
        const w = (c.widgets || []).find((x) => x.id === id);
        if (w) fn(w);
      }
      s.liveRev = (s.liveRev || 0) + 1;
      if (s.live) s.publishedAt = Date.now();
    }, { silent: true });
    Store.flush();
    if (stage) stage.refreshWidgets();
    syncStage(); renderTop(); renderInspector();
  }

  function timerAction(w, action) {
    const zone = tz();
    editWidgetLive(w.id, (x) => {
      const P = x.props;
      const remain = countdownRemaining(P, zone);
      if (action === "start") {
        const left = P.frozenSec != null ? P.frozenSec : (P.mode === "timer" ? (P.durationSec || 300) : remain);
        P.endsAt = Date.now() + left * 1000;
        if (P.mode !== "timer") {
          const p = tzParts(zone, new Date(P.endsAt));
          P.targetDate = `${p.y}-${String(p.mo).padStart(2, "0")}-${String(p.d).padStart(2, "0")}`;
          P.targetTime = `${String(p.h).padStart(2, "0")}:${String(p.mi).padStart(2, "0")}`;
        }
        P.frozenSec = null;
        P.running = true;
      } else if (action === "pause") {
        P.frozenSec = remain;
        P.running = false;
        P.endsAt = null;
      } else {
        P.frozenSec = null;
        P.running = false;
        P.endsAt = null;
      }
    });
  }

    Store.update((st) => {

      const i = list.findIndex((x) => x.id === id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= list.length) return false;
      [list[i], list[j]] = [list[j], list[i]];
      list.forEach((x, k) => { x.z = k + 1; });
